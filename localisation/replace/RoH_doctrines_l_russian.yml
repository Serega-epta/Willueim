GRAND_DOCTRINE_MOBILE_WARFARE_DESC: "Тяжёлая промышленность Великой Родины всегда вызывала зависть у врагов. Её колоссальный массив танков и БТР позволил в определённый момент полностью моторизовать части и вывести войну на совершенно новый уровень. Пусть наши ресурсы сильно меньше, мы попробуем последовать опыту великих предков"
GRAND_DOCTRINE_SUPERIOR_FIREPOWER_DESC: "Великая Родина атаковала и людьми, и техникой. Мы же не имеем возможности действовать так, и выходит, что людской ресурс сейчас даже многократно дороже снаряжения. Так задавим их превосходящим огнём!"

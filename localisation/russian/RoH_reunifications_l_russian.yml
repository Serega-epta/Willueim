l_russian:
 reunification_category:0 "Объединение Родины"
 reunification_category_desc:0 "После всего того, что произошло на земле Родины, она раскололась на мелкие осколки с разными намерениями. Кто-то просто хотел существовать в мире и созидании, а кто-то хотел воплощать свои подростковые мечты в реальность. Но цель была едина - рано или поздно, вновь возродить было величие страны, которая погребена в пепле ядерного огня. Именно сейчас мы имеем шанс выстоять против всех трудностей столь ужасного и кровожадного мира..."
 
 #Объединение Южных Окраин
 create_united_ukraine:0 "Объединение Южных Окраин"
 all_states_of_ukraine_tt:0 "В ходе боевых действий государство $COUNTRY|H$ взяло под свой контроль все территории, именуемых ранее §OЮжными окраинами§!. Никаких заявлений по радиочастотам или другими способами от объединителей не поступало."	
 reunification_of_ukraine_tt:0 "§OЕщё один шаг к объединению России§"`
 
 #Объединение Центральной России
 create_united_central_russia:0 "Объединение Восточноевропейской равнины"
 all_states_of_cen_russia_tt:0 "В ходе боевых действий государство $COUNTRY|H$ взяло под свой контроль все территории, именуемых ранее §OВосточноевропейской равниной§!. Никаких заявлений по радиочастотам или другими способами от объединителей не поступало."	
 reunification_of_cen_russia_tt:0 "§OЕщё один шаг к объединению России§"`

#city_restoration
city_restoration: "Восстановление города §Y[?FROM.GetName]§!"
city_restoration_desc: "У нас есть все возможности восстановить крупнонаселенный регион!"
unlock_all_building_slots_tt: "Отрывает все ячейки строительства"
repair_all_shared_buildings_tt: "Починит все региональные здания"
operation_nevsky: "Операция \"§YНевский§!\""
operation_nevsky_desc: "Грандиозный проект по восстановлению Ленинграда. Будут приложены титанические усилия, чтобы город восстал из пепла ядерного огня!"
operation_motherland: "Операция \"§YВолга-матушка§!\""
operation_motherland_desc: "Грандиозный проект по восстановлению Сталинграда. Будут приложены титанические усилия, чтобы город восстал из пепла ядерного огня!"
city_resettlement_tt: "Мы переселим по $NUM$ жителей из уже восстановленных городов и деревень"
cities_restored_num_3_or_bigger_tt: "Восстановлено 3 или более крупных городов"
mines_restored_num_4_or_bigger_tt: "Восстановлены шахты по добыче урана"
atomic_stations_restored_all_tt: "Восстановлена ядерная энергетика Великой Родины"
city_restored: "Город восстановлен"
mines_restored: "Шахты по добыче урана восстановлены"

#communication_restoration
communication_restoration: "Восстановление связи в регионе §Y[?FROM.GetName]§!"
communication_restoration_desc: "Утерянные удобства в виде телефонной связи и интернета ускоряют общение. Их восстановление пригодится как гражданским, так и военным."

#city_garrison
city_garrison: "Размещение гарнизона в регионе §Y[?FROM.GetName]§!"
city_garrison_desc: "Мы расположим войска и обучим ополчение защищать крупнонаселенный город и поддерживать в нем порядок"

#water_purification
water_purification: "Очистка источников воды"
water_purification_desc: "Мы попытаемся отфильтровать все радиактивные частицы из небольших пресноводных водоемов, обеспечив жителей не только водой, но и безопасной инфраструктурой."
no_red_forest_allowed_tt: "Не должно остаться зараженных лесов"


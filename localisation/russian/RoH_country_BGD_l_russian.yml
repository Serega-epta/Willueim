l_russian:
##############################
### POLITICS #################
##############################
BGD_stepan_tolmutov:0 "Степан Толмутов"
BGD_stepan_tolmutov_desc:0 "В довоенные годы в западном блоке была популярна фраза: «Когда говорят пора валить, либерал ответит «куда?», а патриот ответ «кого?»». Степан Толмутов, кадровый офицер ВС Великой Родины, хоть и находится на чужбине, в Буковине, но его никак нельзя отнести к «либералам». Потеряв связь с вышестоящим командованием, он смог реорганизовать наличные 68-ой отдельной горной мотострелковой бригады и перейти в глухую оборону, ожидая подхода резервов, однако, резервов все не было и не было. Тогда, Толмутов перешел к построению государства в собственном видении. Ныне Буковина – гигантский военный лагерь, где каждый человек с самых ранних лет учиться держать в руках винтовку, что производятся в городах-крепостях, образованных из местных поселений. Так бы Толмутов и правил железной рукой до прихода наследников центрального правительства, но пришли Они. Их окрестили «Черными проповедниками». «Проповедники» по-сути являются сектантами, ведомыми идеей, что те люди – за стенами – еретики, которых надо уничтожить. Так и по сей день Буковинская Гвардия тонет в реках крови нападающих, число которых все не убывает и не убывает, несмотря на потери. Никто не знает, когда это все наконец кончится. Но одно известно точно. Буковина истекает кровью."

Comrades_here_we_go_tt:0 "Мы призовем оставшихся верных Родине вступить в наши ряды"

##############################
### FOCUS ####################
##############################

BGD_But_they_came:0 "Но пришли они"
BGD_But_they_came_desc:0 "Наше государство милитаризовано не просто так. Раньше мы пытались установить взаимовыгодные отношения с нашими соседями, и чем они нам ответили? Резнёй! Убийством и сожжением стариков, женщин и детей! Мы никогда не повторим своих ошибок. Мы прольём столько крови, сколько будет необходимо: месть будет достигнута!"

BGD_Eternal_vigil:0 "Вечное бдение"
BGD_Eternal_vigil_desc:0 "Каждый гражданский может при необходимости стать солдатом. Все жители Буковины обучены ведению боевых действий, оказанию первой медицинской помощи и десятку прочих воинских дисциплин. Разумеется, достигается это при помощи муштры, которой каждый буковинец подвергается с малых лет."

BGD_Motheland_has_left_us:0 "Родина покинула нас"
BGD_Motheland_has_left_us_desc:0 "Единственная цель нашего государства – просуществовать хотя бы до момента получения новых приказов и инструкций из генштаба. Всё меньше людей верит в то, что это осуществимо."

BGD_No_step_back:0 "Ни шагу назад"
BGD_No_step_back_desc:0 "Похоже, религиозные культы в Галиции и Волыни наконец-то начали ультимативную войну за право насаждать другим свое извращённое видение религии. Нам стоит максимально подготовиться к оборонительной войне – если один из культов одержит верх, то наверняка сконцентрируется на нас. Впрочем, если мы сможем застать этих фанатиков врасплох..."

BGD_Nobody_knows:0 "Никто не знает когда конец"
BGD_Nobody_knows_desc:0 "Судя по отчётам, боестолкновения между культистами не утихают, а лишь набирают обороты. На границе с нами у них почти не осталось войск. Мы провели приготовления. Войска готовы начать наступление. Это будет их земля. Их люди. Их кровь."

BGD_Bukovina_bleeds:0 "Буковина истекает кровью"
BGD_Bukovina_bleeds_desc:0 "Мы разобрались с мелкими культами в Галиции и Волыни. Частота рейдов значительно снизилась, а контроль над границей ещё никогда не был столь крепок. Но мы не забыли про нашего главного противника: Аоана и его культ. Именно они сожгли Черновцы в 2013 году, и именно за это мы собираемся полностью уничтожить и культистов, и всех, кто их поддерживает. Наша месть будет завершена."

BGD_Serve_the_remnants:0 "Служу остаткам родины"
BGD_Serve_the_remnants_desc:0 "Итак, мы победили. Территории, ранее контролируемые культистами, теперь патрулируются нашими войсками, последние очаги сопротивления ликвидированы, все стратегически важные объекты переведены под управление Гвардии. Тем не менее, многие офицеры и чиновники сталкиваются с извечной проблемой подобных успехов: растяжение сил и отсутствие необходимого количества кадров для управления такой территорией. Конечно, со временем мы решим эту проблему... Но сейчас надо сконцентрироваться на иных, более приоритетных вопросах. Для обеспечения охраны наших более крупных границ из оперативного резерва были созданы две бригады быстрого реагирования, снабженные необходимой экипировкой для службы в опасных условиях. Кроме того, на территории Буковины впервые за несколько десятилетий были отменены военное положение и комендантский час."

BGD_Get_in_touch:0 "Выйти на связь"
BGD_Get_in_touch_desc:0 "Радиостанции, ранее контролируемые культистами, были переоборудованы под наши стандарты и укомплектованы лучшими радистами. Впереди – самая сложная часть. Нам предстоит провести крайне детальную радиоразведку, проверить каждый уголок территории, который будет попадать в радиус действия нашей аппаратуры. Так же мы направим пятнадцать автономных разведгрупп на разведку мест, где Верховное командование могло установить штаб после конца Великой войны.В случае успеха, наши представители будут направлены к координатам расположения штаба Командования, где доложат о наших успехах и готовности быть реинтегрированными в армейскую структуру.На случай провала, впрочем, тоже существует план действий. Надеемся, до него дело не дойдёт."

BGD_Motherland_has_come:0 "Родина пришла за нами"
BGD_Motherland_has_come_desc:0 "Наконец-то! Спустя два десятилетия, спустя годы рейдов, нападений, преступлений и бесчинств, мы наконец-то смогли связаться с руководством! Конечно, его позиции не особо лучше, чем у нас... Но, если мы объединим наши силы и интегрируемся в общую систему данной «армии возрождения», у нас появится возможность не просто удерживать определенные регионы Великой Родины, а объединить её! Мы немедленно вышлем наших представителей на встречу с командованием Армии, чтобы как можно быстрее приступить к нашим прямым обязанностям: выполнению приказов и объединению русских земель."

BGD_We_are_the_Motherland:0 "Мы и есть родина"
BGD_We_are_the_Motherland_desc:0 "Операция по поиску законного правительства и верховного командования потерпела неудачу. На такой случай существует пакет инструкций с кодовым обозначением «Преемственность»."

BGD_Vultures:0 "Стервятники терзающие труп"
BGD_Vultures_desc:0 "Конечно, нас окружают не только сумасшедшие культисты, бандиты и тираны. В регионе полным-полно точно таких же государств-осколков, готовых влиться в состав Великой Родины ради высшего блага. Так или иначе, они присоединятся к нам: либо с нами, либо против нас."

BGD_Comrades_here_we_go:0 "Товарищи, мы идем!"
BGD_Comrades_here_we_go_desc:0 "Время провести операцию по восстановлению конституционного порядка на всей территории Великой Родины. Бандиты, тираны, западные подстилки и предатели – все будут свергнуты и стерты в пыль. Наша Держава будет восстановлена. Любой ценой."

BGD_Glory_to_the_Motherland:0 "Слава советской Родины"
BGD_Glory_to_the_Motherland_desc:0 "Мы смогли. Спустя долгие годы, спустя столько страданий и лишений, сквозь тернии и пули, мы смогли! СОВЕТСКАЯ РОССИЯ ВОССТАНОВЛЕНА!"

 
##############################
###IDEAS ####################
##############################

BGD_Eternal_Vigil_idea:0 "Вечное Бдение"
BGD_Eternal_Vigil_idea_desc:0 "Родина пала, но на её остатках ещё есть те, кто способен сплотить расколотый народ и если мы сами не способны восстановить нашу страну, то мы в силах сохранить спокойствие и верность до тех пор, пока не наступит час примкнуть к наследнику идеалов Великой Родины."
 
BGD_Bukovina_bleeds_idea:0 "Буковина истекает кровью"
BGD_Bukovina_bleeds_idea_desc:0 "Каждые пятьдесят минут погибает один буковинский солдат. От пули, от ножа, от голода, от холода, от болезни – неважно.\nКаждые пятьдесят минут Буковина лишается ещё одного защитника."

BGD_No_step_back_idea:0 "Ни шагу назад"
BGD_No_step_back_idea_desc:0 ""

BGD_Serve_the_remnants_idea:0 "Служу остаткам родины"
BGD_Serve_the_remnants_idea_desc:0 "Родина частично восстановлена. С одной стороны, конечно, это безусловный плюс, но теперь мы не можем так тщательно контролировать военные и политические процессы, как делали это ранее, на куда более малой территории. Значительно снизилась эффективность бюрократического аппарата и призывной системы, а патриотический запал, который ранее питал наше государство, выдохся после ряда наступательных операций и уничтожения основных угроз.\nТем не менее, всё ещё впереди."

BGD_operation:0 "Операция “КП”"
BGD_operation_desc:0 "Крестовый поход” состоит из двух частей: стремительного продвижения на территорию культа Детей Аоана с окружением и уничтожением вражеских частей и установления военно-гражданской администрации на освобожденной территории. Некоторые утверждают, что быстрое продвижение может навредить нашим путям снабжения, но командование готово пойти на такой риск.\nКультистам нет места в государстве."


#Решения
BGD_We_are_the_Motherland_decisions:0 "Мы и есть Родина"

BGD_offer_union:0 "Предложить союз"
BGD_offer_union_desc:0 "Хотя руководство страной развалилось в ень, когда с неба посыпались бомбы, на радиоактивных пустошах еще остались люди, хранящие верность присяги и готовые откликнуться на зов Родины."

#Ивенты

BGD_union.1.t:0 "Предложение о союзе"
BGD_union.1.d:0 "Союз патриотов Родины стремиться прислал нам предложение об объединении. Они утверждают, что являются единстенной легитимной властью на территории страны. Как нам следует ответить?"
BGD_union.1.a:0 "Мы больше не одни, Родина пришла за своими детьми"
BGD_union.1.b:0 "Очередные самозванцы подняли знамена Великой Родины, не они первые, не они последние"

BGD_union.2.t:0 "Согласие"
BGD_union.2.d:0 "Хорошие новости, очередной осколок нашей Родины согласился примкнуть к нам."
BGD_union.2.a:0 "На шаг ближе к единству"

BGD_union.3.t:0 "Отказ"
BGD_union.3.d:0 "Плохие новости, те, кого мы приняли за таких же патриотов на деле оказались кучей крыс, что прикрываются именем нашей Родины в своих корыстных интересах. Они отказались присоедениться к нашей праведной борьбе."
BGD_union.3.a:0 "Значит они выбрали смерть"

BGD_event.1.t:0 "Вступление"
BGD_event.1.d:0 "“Если буковинец к пяти годам не может собрать и разобрать Калашников, он явно родился не в той стране”. “Бункеров в Буковине больше, чем домов”. “Армия с государством”.\nЭти и многие другие высказывания часто можно услышать от торговцев и вольных странников, когда спрашиваешь их о Буковине. И действительно, многие из слухов являются правдой: остатки 68 отдельной горнострелковой бригады полностью переделали подконтрольный им регион, превратив его в крайне укрепленный военный лагерь. Многим это кажется полнейшим безумием...\n... но только сами буковинцы знают, что иначе быть не может.\nБуковина истекает кровью. Нападения безумцев, культистов и фанатиков из состава “Чёрных проповедников” не прекращаются ни на день. Каждые пятьдесять минут умирает один буковинский солдат.\nЛишь время покажет, пройдёт ли вотчина 68 бригады сквозь эти невзгоды."
BGD_event.1.a:0 "ПОБЕДА ИЛИ СМЕРТЬ"

BGD_event.2.t:0 "БРИГАДА, БАТАЛЬОН, РОТА, ВЗВОД"
BGD_event.2.d:0 "Полковник Игнатьев, командующий третьей пехотной бригады, получит извещение об успешной обороне против штурма противника в квадратах пять и шесть. Он довольно улыбнётся и подпишет приказы об отправке дополнительного снабжения для укрепления обороны. Это займёт у него не более получаса.\n\nМайор Антонеску, командующий первым батальоном второго полка третьей пехотной бригады, недовольно скривится, когда узнает, что пятая рота в очередной раз требует пополнения в связи с “высоким уровнем безвозвратных потерь”. Он найдёт людей для этого – на это уйдёт не более полудня.\nКапитан Иванов, командующий пятой ротой первого батальона, будет обучать новых солдат с нуля, чтобы они смогли заменить лейтенанта Чапова и его ребят на посту. На тщательную подготовку, выходящую далеко за рамки уже пройденного рекрутами тренировочного лагеря, уйдёт несколько недель.\nЛейтенант Чапов, командующий вторым взводом пятой роты, вместе со всеми своими бойцами станет увековеченным в списках погибших защитников Буковины. Его служба будет длиться вечно."
BGD_event.2.a:0 "Буковина истекает кровью."

BGD_event.3.t:0 "ШКОЛА, ПАРТА, АВТОМАТ"
BGD_event.3.d:0 "Каждый буковинец старше 13 лет проходит обязательную военную подготовку. Школьная программа на три четверти состоит из обучения воинскому делу и связанными с ним умениями: радиосвязи, рытью окопов, уходу за оружием и прочему.\nКаждый буковинец старше 16 лет проходит обязательную гарнизонную службу: летом подростков отправляют к пограничью, чтобы они помогали находящимся там подразделениям в задачах по охране территорий.\nКаждый буковинец старше 18 лет отправляется служить Отечеству. Большая часть уходит в пехоту, сражаться с ордами культистов, меньшинство – в специализированные части армии.\nКаждый буковинец знает: всё это – ради сохранения порядка и цивилизации."
BGD_event.3.a:0 "Все мальчишки счастливы."

BGD_event.4.t:0 "(СИГНАЛА НЕТ... И НЕ БУДЕТ"
BGD_event.4.d:0 "Этот день жизни ефрейтора Чаушеску ничем не отличался от прочих. Та же радиостанция, то же тесное помещение с приборами для связи и прослушки, те же люди, те же лица.\nНичего нового.\nЕфрейтор надевает наушники, закуривает дешёвую папиросу, кашляет от неприятного привкуса и приступает к работе.\nСписок частот, которые надо проверить за сегодня, ничем не отличается от списка, выданного вчера, позавчера, неделю назад или в прошлом году – и всё же, их надо проверить.\nЧастота для экстренной связи частей внутренних войск. На ней, как и всегда, какой-то умник по кругу крутит шлягеры. Качественные, да, но лишь шлягеры. Ефрейтор останавливается на этой частоте, дослушивает песню и делает пару затяжек, прежде чем пойти дальше по списку.\nШтатная армейская частота для связи с частями РВСН. Ничего. Пустота. Действительно, после них – тишина.\nЧастоты для связи с погранчастями КГБ и ВС СР тоже ничего не дают: на них вещают чёртовы культисты. Какая-то проповедь про приближающийся конец света. Странно, обычно у них такое по средам крутят.\nНаконец, канал связи со штабом, центральным командованием армии. Ефрейтор докуривает папиросу, произносит короткую молитву, переключается на частоту...\n... и слышит лишь привычную автоматическую систему связи. Те же приказы, что были отданы парой дней после конца Великой войны, транслируются спустя два десятка лет."
BGD_event.4.a:0 " Новых инструкций не будет."

BGD_event.5.t:0 "НИ ШАГУ НАЗАД"
BGD_event.5.d:0 "Доклады о начавшихся боестолкновениях между двумя религиозными культами в Галиции и Волыни не на шутку встревожили руководство Буковины.\nУчитывая повышенную степень милитаризации среди данных фанатиков, можно предположить, что в ближайшем будущем будет экспансия за счёт прилегающих территорий. Это, разумеется, может повлечь за собой катастрофические последствия для Буковины и поставить под угрозу само её существование.\nЧтобы предотвратить наихудший исход и повысить степень обороноспособности, командование подписало указ о передаче 60% всего производимого бетона на постройку новых оборонительных сооружений и акт о начале возведения “линии Толмутова” – цепи фортификаций, которая по размахам будет обязана превзойти все, что имелось до неё в истории Буковины."
BGD_event.5.a:0 "Дай Бог нам пережить эту бурю."

BGD_event.6.t:0 "ОНИ УЖЕ НАЧАЛИ ГРЫЗТЬ ДРУГ ДРУГА"
BGD_event.6.d:0 "“ВО ИМЯ СВЯТОЙ РУСИ И СВЯТОГО ДУХА! ВСЕ ЕРЕТИКИ ДОЛЖНЫ ГОРЕТЬ В ПРАВЕДНОМ ОГНЕ НАШЕГО ОРУЖИЯ!”\nТумблер выбора частоты поворачивается немного вправо.\n“ЗА АБСОЛЮТ, ЗА ИСТИНУ, ЗА ВЕРУ И ЗА ПРАВДУ! УНИЧТОЖАЙТЕ ЕРЕТИКОВ С ИХ ДОМАМИ И СЕМЬЯМИ!\nЕфрейтор Чаушеску хмыкает, делая ещё один глоток горького грибного чая. Пропаганда культистов в последнее время только набирала обороты: их ненормальные проповеди заняли почти все частоты, заглушив даже частоту с шансоном и шлягерами.\nНельзя сказать, что происходящее его хоть сколько-нибудь тревожило. Подумаешь, культисты... Будто у них есть хоть какой-то шанс против кадровых военных из Гвардии."
BGD_event.6.a:0 "Ведь так?"

BGD_event.7.t:0 "НИКТО НЕ ЗНАЕТ, КОГДА КОНЕЦ"
BGD_event.7.d:0 "Подготовка войск завершена. Логистика обеспечена. Планы составлены.\nМомента лучше для стабилизации ситуации в Галиции и Волыни уже не будет: культисты всё ещё воюют между собой, все их силы сконцентрированы на линии боевого соприкосновения.\nЕсли позволить хотя бы одной группе фанатиков одержать победу в регионе, противостоять ей будет уже практически невозможно – объединённые силы помешанных культистов, оснащённые и подготовленные по стандартам регулярной армии, просто снесут любую оборону на своём пути.\nПеред Буковинской Гвардией стоит задача не просто по спасению своего населения и территории, но по предотвращению начала кровавых религиозных войн, которые могут продлиться не одно десятилетие.\nПришло время нанести удар."
BGD_event.7.a:0 "Буковина идёт в наступление!"

BGD_event.8.t:0 "ПОСЛЕДНИЙ СЕКТАНТ"
BGD_event.8.d:0 "Ситуация в Галиции и Волыни находится под полным контролем сил Гвардии. Установленные военно-гражданские администрации позволили весьма быстро навести порядок, избавиться от следов культистов, навязать нашу волю и разобраться с партизанами.\nУспеху теперь угрожает лишь одна сила: культ “Детей Аоана”, руководимый одноимённым религиозным фанатиком. Сборище ненормальных, силы которых составляли костяк нападавших на границы. И если раньше возможно было находиться в обороне, то теперь, с получением новых ресурсов и расширением будущей линии фронта, стало возможным провести полноценную общевойсковую наступательную операцию по восстановлению конституционного порядка.\nВ случае успеха, Буковинская Гвардия получит полный контроль над территориями Галиции, Волыни и сопредельных территорий. Куда более важно иное: с выходом на новые позиции будет получен доступ к мощным радиостанциям, через которые культисты ранее вели пропаганду. Теоретически, это может позволить выйти на контакт с командованием, который ранее был невозможен из-за отсутствия необходимой материальной базы.\nМы в шаге от победы. Мы не сдадимся. Великая Родина будет восстановлена."
BGD_event.8.a:0 "Ура!"

BGD_event.9.t:0 "ТИШИНА?"
BGD_event.9.d:0 "Впервые за двадцать с лишним лет Ботошани перестает напоминать военный лагерь. С улиц пропадают бесконечные КПП и патрули, начинает зарождаться мелкое предпринимательство, а гражданским теперь не обязательно пропадать с улиц строго в 18 часов.\nВ ранее пограничных деревнях наблюдается еще более странная картина: дети-военные массово сдают оружие своим руководителям. В сконфуженных глазах подростков читается непонимание того, что дальше делать. Некоторые идут на альтернативную службу, помогают местным жителям с хозяйством, но большинство решает отправиться домой.\nНочью не слышен бесконечный треск пулеметов и автоматов, не слышно грохота артиллерии и танковых залпов. Вместо этого – весёлые звуки народных гуляний, смеха и гитар, на которых исполняют всеми любимые песни.\nКажется, наконец-то наступил мир, тишина, и свобода от бесконечных набегов с севера..."
BGD_event.9.a:0 " ... но надолго ли?"

BGD_event.10.t:0 "ОТПРАВЛЕНИЕ В ПУТЬ"
BGD_event.10.d:0 "Капитан Малышев вновь перечитывал карту движения. Выдвижение с КПП “Зенит”, продвижение к Киеву, затем – к Чернигову, Гомелю, и далее на север, вплоть до Витебска. Предстояло проверить почти четыре десятка стратегических объектов Великой Родины – бункеры, подземные фабрики и заводы, секретные города... Словом, все места, где потенциально могло располагаться Верховное Командование.\nУбрав карту обратно в тубус с остальными документами, Малышев, нервно бурча себе что-то под нос, направился к штабному БМП. План, откровенно говоря, был крайне рискованным: сто человек не могли оказать сопротивления, скажем, орде культистов, и при этом были слишком громоздким соединением, чтобы передвигаться незаметно.\nТем не менее, если им удастся найти командование и показать, что они являются не просто оборванцами, но полноценной армией, готовой помочь вернуть Великую Родину, весь риск будет оправдан. Будет восстановлена армейская иерархия, будут получены новые инструкции, и все страдания, все ужасы, порождённые падением великой Родины, наконец-то могут кануть в небытие.\nС этими мыслями Малышев, забравшийся внутрь своего БМП и включивший рацию, произнёс в микрофон команду, ознаменовавшую начало новой эпохи."
BGD_event.10.a:0 "“– Поехали!”"

BGD_event.11.t:0 "РОДИНА ПРИШЛА ЗА НАМИ"
BGD_event.11.d:0 "Этот день настал! Этот день, который мы приближали всеми силами, ради которого мы лезли из кожи вон, голодали и умирали, наконец-то наступил!\nАрмия Возрождения согласилась на нашу интеграцию в её состав! Конечно, она займет не один месяц, чего стоит хотя бы унификация наших бюрократических аппаратов и экономики, но все это неважно по сравнению с тем, что мы добились своего!\nНаконец-то мы станем частью нашей Великой Родины, нашей великой державы, наконец-то у нас появится настоящая цель и идея! Мы более не очередное государство-осколок, мы – часть государства-преемника!\nСЛАВА ВЕЛИКОЙ РОДИНЕ! РОДИНЕ ВИВАТ!"
BGD_event.11.a:0 "ЗА СОВЕТСКУЮ РОССИЮ! ЕДИНУЮ И НЕДЕЛИМУЮ!"

BGD_event.12.t:0 "СВЕТЛОЕ БУДУЩЕЕ"
BGD_event.12.d:0 "Майор Малышев довольно глядел в зеркало, с широкой улыбкой рассматривая новые погоны и медаль на груди. За всю свою жизнь он ещё ни разу не был таким счастливым, как сейчас.\nПодумать только – именно он, капитан Евгений Малышев, командир четвертой разведгруппы, обнаружил Армию Возрождения, установил контакт, поучаствовал в боях против банд культистов и мародёров вместе с ее силами, вернулся, получил внеочередную «звёздочку»...\n... и, ко всему прочему, его беременная жена во время полугодового отсутствия супруга родила ему сына. Здорового, без мутаций и дефектов! Награда от государства в виде целой квартиры с отоплением и работающим водопроводом пришлась невероятно вовремя.\nКонечно, многое еще было впереди, предстояло освободить остальные части Великой Родины от тирании бандитов, западного скота и предателей. Но всё же, будущее смотрелось куда более светлым, чем пару лет назад, когда Малышев со своей ротой охранял северные подступы к Буковине от атак культистов."
BGD_event.12.a:0 "Надежда загорелась в сердцах тысяч людей."

BGD_event.13.t:0 "МЫ И ЕСТЬ РОДИНА"
BGD_event.13.d:0 "Ничего. Долгие месяцы поисков, радиоразведки, потерь многих разведгрупп – все было тщетно.\nМы растянули наш радиус поисков далеко за изначальные границы, расследовали каждую ниточку, делали все, что было в наших силах. И всё же, не было найдено ни одного доказательства того, что Командование ещё существовало.\nКонечно, это тяжкий удар по морали, но у нас был готов пакет инструкций на этот случай. План “Преемственность”, подготовленный советом офицеров 68 бригады через пару лет после формирования Буковины.\nСогласно данному плану, Буковинская Гвардия официально объявляла себя государством-преемником Великой Родины и, следовательно, заявляла свои права на все её бывшие территории... И ресурсы. Нам предстоит крайне тяжелая задача по освобождению наших земель от тирании бандитов, западных ублюдков и предателей.\nНо мы справимся. Мы уничтожим их всех, всех кто посмел покуситься на наше государство."
BGD_event.13.a:0 "Родина... Потерпи, осталось немного.."

BGD_event.14.t:0 "МЫ СМОГЛИ!"
BGD_event.14.d:0 "Москва. Столица, сердце Великой Родины – в наших руках.\nОт города не осталось почти ничего: большая часть его районов была уничтожена ядерными ударами, оставившими от некогда величественных зданий лишь жалкие, обожжённые остовы. Более того, в руинах Московского метро мы обнаружили настоящее кладбище: похоже, в тоннелях под столицей еще лет десять после Великой войны существовало целое общество, которое в итоге вымерло из-за истощения запасов и внутренних конфликтов.\nИ всё же, жизнь постепенно налаживается. Уровень радиации в Москве, конечно, весьма высокий, да и прочих опасностей хватает, но строительные бригады уже приступили к очистке первых районов от завалов, развалин и прочих препятствий. Всем желающим переехать в город выдаются дополнительные привилегии, вроде увеличенной зарплаты и жилплощади с водопроводом, не говоря уже о бесплатном снабжении радиационными протекторами.\nПуть, что лежит перед нами, тернист и полон испытаний и тяжб, но мы справимся, как справились раньше. Мы прошли путь от жалкого оборонительного редута в Буковине до преемника Великой Родины."
BGD_event.14.a:0 "Надеюсь, мы этого не лишимся."

BGD_event.15.t:0 "БЛОКПОСТ"
BGD_event.15.d:0 "Рядовой Гнедко прибыл на прохождение срочной службы всего пару недель назад. Блокпост к северу от Черновцев, окружение из напряжённых ветеранов, койка в подвале – в кадетке однозначно было хуже.\nДни проходили один за другим. Приезжал конвой со снабжением, передавал пару ящиков, уезжал дальше. Стояние на посту, сон в койке, завтрак, ужин, иногда – игра в карты с новыми боевыми товарищами.\nОткровенно говоря, его это разочаровывало. Всю кадетку рядовому твердили, что на посту будет опасность, что культисты никогда не дремлют и всегда готовы начать нападение, что атаки идут каждый день. В его представлении, он должен был уже десять раз хвататься за пулемёт, и перестрелять как минимум сотню фанатиков.\nПо факту же, всё произошло наоборот.\nОдной ночью, рядовой проснулся от шорохов и тихих всхлипов с верхней койки. Уже начав было ругаться на товарища с кошмарами, Гнедко открыл глаза...\n... и понял, что смотрит прямо в упор на человека с окровавленным ножом в руке. Солдат даже вскрикнуть не успел – ему зажали рот и всадили клинок на все двадцать сантиметров прямо в череп.\nПрибывший из-за радиомолчания конвой усиленного реагирования нашёл Гнедко и его товарищей..."
BGD_event.15.a:0 "...распятыми."

BGD_event.16.t:0 "ПАМЯТЬ"
BGD_event.16.d:0 "25 июня – день траура для всей Буковины. Каждый её житель, от мала до велика, знает об ужасных событиях лета 2013 года, когда культисты с севера впервые предприняли попытку прорыва и захвата нашего государства.\nЕщё каких-то пятнадцать лет назад мы снисходительно относились к религиозным культам с севера. Отправляли им гуманитарную помощь, пытались наладить взаимоотношения, но всё кануло в лету, когда фанатики из числа детей Аоана собрали войско и объявили “священную войну”, к которой вскоре присоединились культы из Галиции и Волыни. 25 июня 2013 года они прорвали оборону города Черновцы и жестоко убили почти всё местное население, устроив массовое сожжение на главной площади. Только в августе, когда в рядах культистов началась внутренняя борьба, город удалось отбить, а самих фанатиков – оттеснить до прежних границ.\nПридёт время, и тоже самое повторится. Но на этот раз, жертвами будем не мы."
BGD_event.16.a:0 "Это будет их земля, их кровь."

BGD_event.17.t:0 "КОТ"
BGD_event.17.d:0 "Каждый военный находит для себя какой-то способ иногда отвлечься от службы. Большинство просто играет в карты, шахматы или шашки. Некоторые читают, иные – занимаются спортом.\nУ второго взвода, охранявшего небольшую деревню к северу от Черновцев, было несколько иное занятие: он ухаживал за котом.\nБойцы обнаружили Ваську, серого кота, еще когда он был маленьким. Котёнок сам прибился к взводу, жалобно мяукал и царапал казенное имущество. Его милые писки и большие глазки смогли разжалобить, казалось бы, каменное сердце комвзвода, и кота было решено оставить. Разумеется, его тут же нарекли Ваской.\nКаждый солдат в свободное время уходил на поиски кота: подросший кот порой умудрялся забираться в такие места, из которых его приходилось вытягивать по несколько часов к ряду, только чтобы завтра обнаружить в том же самом положении.\nИ всё же, его любили."
BGD_event.17.a:0 "Как можно не любить котов?"

BGD_event.18.t:0 "СПАСЕНИЕ РЯДОВОГО ВАСЬКИ, ЧАСТЬ 1"
BGD_event.18.d:0 "Погранзастава доложила о приближающемся отряде культистов, деревенский гарнизон был поднят по тревоге, завязалась перестрелка. Атака была отбита почти сразу – эти фанатики оказались на редкость трусливыми, у них даже оружия не было. Похоже, они были из числа тех, кого за грехи отправили в самоубийственный штурм. Никто не получил ранений, никто не умер, даже деревня осталась нетронутой.\nНо заметно потолстевший кот, Васька, куда-то пропал.\nСерый представитель семейства кошачьих отдыхал рядом с одним из солдат, стоявших на посту, и мигом удрал, когда началась пальба. Когда взвод закончил «разбор полётов», обнаружилось, что Васьки нигде нет. Прочесывание деревни и осмотр привычных мест для кошачьих пряток ни к чему не привели.\nОбнаружили кота пограничники спустя полдня."
BGD_event.18.a:0 "Прямо посреди минного поля."

BGD_event.19.t:0 "СПАСЕНИЕ РЯДОВОГО ВАСЬКИ, ЧАСТЬ 2"
BGD_event.19.d:0 "Ожидание ни к чему не привело. Кот не намеревался покидать минное поле. Даже когда пошёл дождь с грозой, Вася невозмутимо сидел прямо посреди рядов “лепестков” и ПМН, нагло вылизывая лапы и презрительно смотря на защитников Буковины, стоявших за сотню метров от него.\nКонечно, некоторые солдаты считали, что Вася как-нибудь сам справится, что спасать кота с минного поля – сумасшедшая идея. Но что такое здравый смысл по сравнению с привязанностью к животному?\nКомвзвода лично направился спасать Васю, в обход всех уставов. Вооружённый картой минного поля и миноискателем, офицер максимально аккуратно, стараясь не задеть ни одной лишней травинки, пробирался сквозь ряды, способных оборвать его жизнь за мгновение. И всё же, добраться до Васи удалось – запихнуть изрядно потолстевшего кота в рюкзак тоже проблем не составило.\nВпрочем, один сюрприз все же случился, когда спустя пару часов комвзвод вернулся и достал Ваську из ранца."
BGD_event.19.a:0 "Внутри рюкзака мяукало пятеро новорожденных котят."

#tooltips:
BGD_Vultures_tt: "Будут получены цели войны на всех в западной России"

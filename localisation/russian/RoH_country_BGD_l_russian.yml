BGD_offer_union:0 "Предложить союз"
BGD_offer_union_desc:0 "Хотя руководство страной развалилось в ень, когда с неба посыпались бомбы, на радиоактивных пустошах еще остались люди, хранящие верность присяги и готовые откликнуться на зов Родины."

#Ивенты

BGD_union.1.t:0 "Предложение о союзе"
BGD_union.1.d:0 "Союз патриотов Родины стремиться прислал нам предложение об объединении. Они утверждают, что являются единстенной легитимной властью на территории страны. Как нам следует ответить?"
BGD_union.1.a:0 "Мы больше не одни, Родина пришла за своими детьми"
BGD_union.1.b:0 "Очередные самозванцы подняли знамена Великой Родины, не они первые, не они последние"

BGD_union.2.t:0 "Согласие"
BGD_union.2.d:0 "Хорошие новости, очередной осколок нашей Родины согласился примкнуть к нам."
BGD_union.2.a:0 "На шаг ближе к единству"

BGD_union.3.t:0 Отказ"
BGD_union.3.d:0 "Плохие новости, те, кого мы приняли за таких патриотов на деле оказались кучей крыс, что прикрываются именем нашей Родины в своих корыстных интересах. Они отказались присоедениться к нашей праведной борьбе."
BGD_union.3.a:0 "Значит они выбрали смерть"



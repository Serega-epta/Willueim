BGD_stepan_tolmutov:0 "Степан Толмутов"
BGD_stepan_tolmutov_desc:0 "В довоенные годы в западном блоке была популярна фраза: «Когда говорят пора валить, либерал ответит «куда?», а патриот ответ «кого?»». Степан Толмутов, кадровый офицер ВС Великой Родины, хоть и находится на чужбине, в Буковине, но его никак нельзя отнести к «либералам». Потеряв связь с вышестоящим командованием, он смог реорганизовать наличные 68-ой отдельной горной мотострелковой бригады и перейти в глухую оборону, ожидая подхода резервов, однако, резервов все не было и не было. Тогда, Толмутов перешел к построению государства в собственном видении. Ныне Буковина – гигантский военный лагерь, где каждый человек с самых ранних лет учиться держать в руках винтовку, что производятся в городах-крепостях, образованных из местных поселений. Так бы Толмутов и правил железной рукой до прихода наследников центрального правительства, но пришли Они. Их окрестили «Черными проповедниками». «Проповедники» по-сути являются сектантами, ведомыми идеей, что те люди – за стенами – еретики, которых надо уничтожить. Так и по сей день Буковинская Гвардия тонет в реках крови нападающих, число которых все не убывает и не убывает, несмотря на потери. Никто не знает, когда это все наконец кончится. Но одно известно точно. Буковина истекает кровью."

Comrades_here_we_go_tt:0 "Мы призовем оставшихся верных Родине вступить в наши ряды"


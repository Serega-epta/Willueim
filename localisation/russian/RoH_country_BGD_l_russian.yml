BGD_Eternal_Vigil_idea_desc:0 "Родина пала, но на её остатках ещё есть те, кто способен сплотить расколотый народ и если мы сами не способны восстановить нашу страну, то мы в силах сохранить спокойствие и верность до тех пор, пока не наступит час примкнуть к наследнику идеалов Великой Родины."
 

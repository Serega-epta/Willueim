l_russian:
drg: "Подрывники"
drg_desc: "Отряд специального назначения, цель которого является проникновение в тыл и подрыв необходимой инфраструктуры (Омниссия, помоги, я уже не знаю что писать!)"
ghounds: "Гончие"
ghounds_desc: "Отряд с обученными собаками для разминирования и преследования отступающего в бегстве врага"
dogies: "Собаки-смертники"
dogies_desc: "Специально обученные собаки. Они бросаются под ближайший танк с миной на спине."
pulse_jammers: "Глушилки"
pulse_jammers_desc: "Отряды с ЭМИ оружием. Не способны нанести значительный ущерб, но могут дизоргнанизовать противника или повредить электронику."
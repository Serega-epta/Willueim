#faction goals
destroy_GLS_goal_name: "Сокрушить ликвидаторов"
destroy_GLS_goal_desc: "Старый мир разрушен, до основанья, с корнем… Почти. Последние его мерзкие отродья всё ещё лезут из-под земли, из старых бункеров. Они пытаются навязать нам возвращение к своей кровавой Великой Родине. Мы не можем позволить им взять верх в этой борьбе."
new_trade_routs_goal_name: "Наладить торговлю"
new_trade_routs_goal_desc: "Торговля - дело, не терпящее шума, а любящее некоторый порядок. Например, порядок в коммуникациях. Поэтому нам стоит получше обустроить инфраструктуру на наших территориях, чтобы деньги и дальше текли рекой в наши карманы."
central_russia_control_goal_name: "Уничтожить предателей"
central_russia_control_goal_desc: "Центральнорусское консульство - сборище самых отпетых выблядков, которых носила русская земля. Это отродье человечества должно стоять там же, где стоят власовцы и бандеровцы - на девятом кругу ада, и будь мы прокляты, если не сделаем всё возможное, чтобы ускорить их отправку туда."
crush_ARM_goal_name: "Сокрушить КГС"
crush_ARM_goal_desc: "Эти остервенелые милитаристы не дадут нам жизни. Либо мы их, либо они нас."
the_russian_tide_goal_name: "Воссоздать русскую армию"
the_russian_tide_goal_desc: "Армия и флот - два единственных союзника России. И так как воды вокруг нашей Родины отравлены, мы можем сконцентрировать силы на воссоздании могущественной армии."
water_purification_name: "Обеспечить население водой"
water_purification_desc: "Во времена Великой Родины простому населению не было нужды заботиться о воде. Она всегда лилась из крана, и горячая, и тёплая, и питевая. Если мы не хотим проблем внутри страны, нам решительно требуется восстановить водопроводы в каждый дом."
rebuild_motherland_goal_name: "Восстановить Великую Родину"
rebuild_motherland_goal_desc: "Наш народ должен вернуться к былой мощи. Для этого мы должны сокрушить всех тех, кто раздробил Россию, и возродить её в новом виде, в новом мире!"
destroy_heresy_goal_name: "Сокрушить виллуимов"
destroy_heresy_goal_desc: "Виллуимы - экзистенциальная угроза. Не только для России, но для каждого человека на нашей планете. Поэтому мы должны уничтожить их. Любой ценой."
restore_nuclear_shield_goal_name: "Восстановить ядерный щит"
restore_nuclear_shield_goal_desc: "Когда-то Великая Родина могла похвастаться мощнейшей в мире сетью мирных и военных атомных реакторов. Если мы претендуем на восстановление России, это нам тоже потребуется восстановить."
RoH_anarchy_SIL_tt: "Мёртвые Болота"
RoH_anarchy_SIL_tt_delayed: "Болота, пожалуй, и в старой жизни вызывали необъяснимый поток страха и ужаса у обычных людей, что уж говорить о нынешних реалиях выжженного огнем атома мира. Порой, при первом оценивающем взгляде на эти брошенные Богом земли, может показаться, что их покинул не только Всевышний, но и любое здравомыслящее существо.\n\nТем не менее, много ли таковых осталось в этом бренном мире?"

RoH_anarchy_BLS_tt: "Сибирская Тишина"
RoH_anarchy_BLS_tt_delayed: "С тех пор, как на землю Сибири упали ядерные боеголовки, здесь наступила полная тишина. Тишина, обрываемая лишь посвистыванием ветров и шелестом листвы. Тишина, так манящая чужие умы посетить её. Тишина, всепоглощающая и всеобъемлющая.\n\nБывший мощный промышленный центр с тысячами населенных пунктов был полностью уничтожен пеплом ядерного огня. Каждый квадратный километр был загрязнён радиоактивными осадками. Время здесь как будто замедлило свой ход, погрязнув в безвременность. \n\nПосле нескольких лет простаивания растительный мир Сибири смог приспособится к новому климату и даже мутировать, в следствие чего появилось новое определение - §OРыжий лес§!. Молодой организм стал сильно разрастаться. Из-за отсуствия какого-либо противодействия вся западная часть региона погрузилась в оранжевую тишину, управляемую новым растительным и живым миром. Человеку пришлось навсегда покинуть это место.\n\nНо иногда тишина кажется такой очаровательной, глубокой и §Rживой§!..."

RoH_anarchy_WTR_tt: "Поволжская Пустыня"
RoH_anarchy_WTR_tt_delayed: "Пожалуй, нет более пострадавшего места на истерзанном теле Родины, чем низовья Волги.\n\nПодвергшиеся ударам всех известных видов оружия массового уничтожения и, даже став испытательным полигоном для новых видов умерщвления людей, Низовья Волги были выжжены навсегда, забрав с собой многие миллионы душ. Немногие люди, проходящие через эти земли порой говорят о шуме поездов и силуэтах целых городов и людей.\n\nЛюдей, которые стояли на этих самых землях, работали на этих самых заводах, что ныне стоят брошенными, храня за своими обугленными стенами наследие Родины, которое, быть может, кому-нибудь когда-нибудь станет доброй помощью."

RoH_anarchy_GER_tt: "Европейская Пустошь"
RoH_anarchy_GER_tt_delayed: "Просвещенная Европа, создавшая мир таким какой он есть. Варварская Европа, обокравшая сотни народов. Прекрасная родина идей гуманизма и свободы. Омерзительный продукт империализма, построивший внешнее благополучие на костях сотен миллионов. Цивилизация, воспитавшая величайших творцов в истории. Порочная дыра разложения и разврата… \n\nСтоль многими словами можно было описать это место, но теперь осталось лишь одно - ПУСТОШЬ. Прекрасные храмы и дворцы обращены в пепел, а многолюдные города опустели. После двух неудачных попыток европейцы все-таки истребили себя. Беспокойный континент замолчал навеки.\n\nВедь так? "

RoH_anarchy_MOS_tt: "Московская Анархия"
RoH_anarchy_MOS_tt_delayed: "Первый ядерный удар Последней войны, как все и думали, был нанесён по Москве. Естественно, авиация и ракетные установки войск ПРО отработали успешно, но сбить всё из десятков ракет, включая помехи, было задачей невозможной.\n\nИ с каждым ударом летели всё новые ракеты, и всё хуже отвечали защитники. Наконец, Москва замолчала. А вместе с ней и все близлежащие города, тоже попавшие под огонь IOPK.\n\nНикто теперь и близко не представляет, что происходит в Москве. Кто-то рассказывает о мутантах, кто-то о цивилизации в метро, а кто-то ничего не рассказывает."

RoH_anarchy_ARC_tt: "Арктические пустоши"
RoH_anarchy_ARC_tt_delayed: "Арктические пустоши долгое время не привлекали никого, кроме горстки оленеводов и охотников на китов и тюленей. До тех пор, пока наука не сделала возможными походы на север. Вслед за первыми ледоколами на север потянулись экспедиции геологов. Их открытия сделали Советскую Россию богатейшей страной мира, а рациональное, распланированное хозяйствование позволило расширить местную инфраструктуру.\n\nВпрочем, Последняя война поставила жирный крест на этих планах. Теперь ржавые колеи и трубопроводы, разваливающиеся кирпичные и бетонные сооружения – последнее напоминание о временах Расцвета Севера."

RoH_anarchy_SWI_tt: "Швейцарская аномалия"
RoH_anarchy_SWI_tt_delayed: "Швейцария когда-то была неотъемлемой частью европейской политики. Римляне, франки, германцы, австрийцы. Но, кажется, после легендарного похода Суворова этот регион стал бастионом нейтралитета – возможно, даже во всём мире. После Венского конгресса Швейцария упорно стояла на позициях невмешательства, пусть и становилась перевалочным пунктом для революционеров, евреев, агентов абвера, нацистского золота, делегаций о сепаратном мире с Союзниками, разведчиков С.Е.Р.П.а и IOPK…\n\nНо, кажется, сама судьба решила посмеяться над швейцарцами, ведь вскоре после вынужденного окончания Последней войны на этих землях стали твориться странные вещи: сначала стали исчезать люди, потом целые кварталы стали менять свой внешний вид, потом стали пропадать целые города…\n\nВ конце концов, из Швейцарии вообще перестали поступать хоть какие бы то ни было новости. А некоторые бывшие разведчики войск Советской России утверждают, что, незадолго до того, как их командиры приказали возвращаться домой, они видели в тех долинах идущие друг на друга легионы Ганнибала и полки Массены."

RoH_anarchy_KVK_tt: "Руины Предкавказья"
RoH_anarchy_KVK_tt_delayed: "Когда-то этот регион был самым краешком Великой степи. Относительно безвестным, кроме, разве что, того, что он стал прибежищем всех разбитых кочевых империй. Сарматы, половцы, скифы, аланы, булгары, хазары, гунны — их потомки стали населением ущелий и долин Кавказа, наряду с местными нахскими народами. Долгое время этот край был сборищем мелких государств, изредка поглощаемых разными империями. До тех пор, пока не пришла Российская империя.\n\nЭта пороховая бочка взорвалась в годы Революции, когда большевики сыграли на ненависти местных к царскому режиму. Впрочем, они стали неприятным разочарованием, когда бывшие кочевники, познавшие власть царей (например, осетины), массово помогали Красной Армии, а автохтонные народы столь же массово восставали и помогали уже Вермахту. Месть не заставила себя ждать. Войска НКВД истребили горных партизан. Их аулы были снесены, их культура была запечатана в архивах, а их самих выслали в степи Казахстана.\n\nНо неидеальная система дала сбои. И когда грянула Последняя война, этот край вновь захлебнулся в крови. Остатки истреблённых народов решили дорого продать свои жизни. Но теперь, кажется, покой наконец установился в этих краях."

RoH_anarchy_VST_tt: "Забытые горы"
RoH_anarchy_VST_tt_delayed: "Когда-то эти горы были почти непреодолимой преградой между Западом и Востоком. Китай был надёжно сокрыт сибирской тайгой и горами, а Индия - Иранским нагорьем и отрогами Гималаев. Но, впрочем, это не мешало время от времени создавать огромные переселения - типа гуннского, монгольского, походов Александра Македонского, сельджуков, Тамерлана и прочих. Но новые технологии позволили освоить Сибирь, заселить Персию, Среднюю Азию, связать прочными связями восточные и западные державы.\n\nИ всё же удары ядерного оружия оказались сильнее. Эти горы вновь стали столь же безлюдными, каким они были сотни лет назад."

RoH_anarchy_BVS_tt: "Великая Пустошь"
RoH_anarchy_BVS_tt_delayed: "Говорят, несколько тысяч лет назад этот регион был зелёным и цветущим. Даже первые письменные источники - жизнеописания древнеегипетских фараонов - запечатлели последние моменты этой эпохи, когда к западу от реки Нил ещё жили пастухи. Но теперь, когда пустыня стала ещё больше, эти земли стали самым красочным памятником смертоносности капитализма.\nПерекрытый Босфор стал первым ударом по Средиземноморью. Вторым стала массовая бомбардировка стран Африки, симпатизировавших С.Е.Р.П.у. Эти бомбардировки выжгли Сахель, превратив его в чёрную пустошь - на Чёрном континенте, вот ведь ирония? Сахара стала наступать на юг катастрофическими темпами - до ста километров за год. Тем сильнее стали суховеи, и тем быстрее они ползли. А солонеющее Средиземное море попросту вымерло, став огромным могильником, и похоронив всю жизнь на побережье, зациклив порочный круг гибели местного климата.\n\nЕсли, конечно, эта жизнь там оставалась…"

RoH_anarchy_AMZ_tt: "Амазонская глушь"
RoH_anarchy_AMZ_tt_delayed: "Великий дождевой лес протянулся почти на весь континент. Только на самой западной границе его ограничивают могучие Кордильеры. Этот колоссальный регион сам создаёт погоду вокруг себя, буквально всасывая океанический воздух, и тем самым подпитывая себя влагой. На счастье, пески Великой Пустоши лишь немного касаются его, не разрушая, а снабжая питательными веществами.\n\nНесмотря на то, что об Амазонке Европе стало известно уже довольно давно, до самой Великой войны людям не удалось стать хозяевами этих земель. Гости, с трудом отбирающие клочки земли для своих нужд - вот правильное определение для человека в этих краях. И когда С.Е.Р.П. нанёс мощный удар по Бразилии, крупному союзнику IOPK, люди быстро покинули этот регион, не имея возможность продолжать вторжение в него. И лес не замедлил быстро отбить все завоевания людей. Теперь его население, как и тысячи лет назад – лишь редкие племена индейцев тупи."

RoH_anarchy_BLK_tt: "Балканская утопия"
RoH_anarchy_BLK_tt_delayed: "С тех пор как ромеи позволили славянам расселиться южнее Дуная, пожалуй, этот регион уже не знал покоя. Борьба с Константинополем, с аварами, с венграми, с турками, австрийцами, друг с другом... Век за веком, Балканы захлёбывались в крови. И даже когда здесь стал почти безраздельно править Советский Союз в виде его саттелитов, зрело недовольство. Против сербов, болгар, хорватов. И когда начало рушиться государство, эта пороховая бочка вновь рванула.\n\nНо уже лет десять отсюда нет никаких известий. Неужели наступила утопия для местных жителей - §Rполный покой§?"

RoH_anarchy_SCO_tt: "Молчаливые Кордильеры"
RoH_anarchy_SCO_tt_delayed: "Южные Кордильеры, или Анды - мощнейшая горная система, отделяющая Южную Америку от Тихого океана. Главный погодный разделитель, сформировавший уникальную экосистему Амазонских лесов. И превративший Патагонию в засушливый край. Тем не менее, когда рухнула цивилизация, этот край, наблюдавший расцвет и падение империи инков, походы Симона Боливара и экспедицию Грантов, теперь хранит лишь одно - тишину."

RoH_anarchy_SOC_tt: "Юго-восточный аномальный кордон"
RoH_anarchy_SOC_tt_delayed: "Когда-то здесь была жизнь. Небогатая, малолюдная, но, всё же, жизнь. В один момент её перечеркнуло появление огромной аномалии - Кордона. Никому доподлинно не известна судьба тех, кто оказался на его территории в момент появления аномалии.\n\nГоворят, в появлении Кордона повинен секретный проект Великой Родины, стоящий где-то недалеко от Архангельска. Но факт остаётся фактом – всё Поморье сейчас отрезано от остальной России непроходимым барьером, и чёрт его знает, что там сейчас происходит. С другой стороны, у всех и без того хватает забот."

RoH_anarchy_SAC_tt: "Южный аномальный кордон"
RoH_anarchy_SAC_tt_delayed: "Когда-то здесь была жизнь. Небогатая, малолюдная, но, всё же, жизнь. В один момент её перечеркнуло появление огромной аномалии - Кордона. Никому доподлинно не известна судьба тех, кто оказался на его территории в момент появления аномалии.\n\nГоворят, в появлении Кордона повинен секретный проект Великой Родины, стоящий где-то недалеко от Архангельска. Но факт остаётся фактом – всё Поморье сейчас отрезано от остальной России непроходимым барьером, и чёрт его знает, что там сейчас происходит. С другой стороны, у всех и без того хватает забот."

RoH_anarchy_WEC_tt: "Западный аномальный кордон"
RoH_anarchy_WEC_tt_delayed: "Когда-то здесь была жизнь. Небогатая, малолюдная, но, всё же, жизнь. В один момент её перечеркнуло появление огромной аномалии - Кордона. Никому доподлинно не известна судьба тех, кто оказался на его территории в момент появления аномалии.\n\nГоворят, в появлении Кордона повинен секретный проект Великой Родины, стоящий где-то недалеко от Архангельска. Но факт остаётся фактом – всё Поморье сейчас отрезано от остальной России непроходимым барьером, и чёрт его знает, что там сейчас происходит. С другой стороны, у всех и без того хватает забот."

RoH_anarchy_BLT_tt: "Блаженный город"
RoH_anarchy_BLT_tt_delayed: "Паша, перенеси сюда текст из текстов лидеров. Хвала Омниссии"

RoH_anarchy_AMR_tt: "Истреблённая Америка"
RoH_anarchy_AMR_tt_delayed: "«Мир был выдуман Америкой, Америка, Америка – небесный дар…»\nТак пелось в той песне? Впрочем, неважно.\n\nПрошло двести с лишним лет с тех пор, как на карте мира появилось государство «Североамериканские Соединённые Государства», по русской традиции – САСШ, позднее ставшее США. Их история началась с Декларации Независимости и Конституции, с принесением в мир самого либерального строя. Оплота капитализма.\nИ немедленно показала всю его порочность и кровожадность. Трудно найти в календаре год, в который США не вели войну, никуда не вторгались, никого не свергали. «Оплот демократии» чуть ли не каждый день проливал кровь, убивал граждан других стран и совершал прочие преступления – как до формирования института международного права, так и после. И когда в ходе Второй Мировой СССР сокрушил Германию, в 1950-60-х деколонизацией вывел из передовых игроков Францию и Великобританию, стало ясно, что все нити ведут в одно место.\n\nНа Капитолийский холм.\n\nИ теперь, когда Америка лежит в руинах, кажется, Советская Россия может наконец забыть о существовании врагов. Ужасной ценой, но она разбила их всех."
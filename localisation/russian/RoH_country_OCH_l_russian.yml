OCH_first_phase.1.t:0 "Живая вода"
OCH_first_phase.1.d:0 "“Метод должен быть чистым. Если в головах пустота, ответ – вовне. Наблюдение – первичный инструмент. Любая странность – точка данных. Импульс отдан. Вёсла замерли. Лодки выстроились в линию, как по линейке. Тридцать пар глаз уставились в воду. Процедура началась. Всё по протоколу. Какому протоколу? Откуда во мне эта уверенность в последовательности?.. \nЯ вхожу в воду. Холод – не шок, а знакомое состояние. Почти... Рутинное. Будто я годами ходила по холодным, скользким поверхностям. В памяти мелькает не образ, а ощущение: пол под босыми ногами, гулкая тишина, запах сырости и чего-то едкого. Я отшатываюсь от воспоминания, и вода всплёскивается. Сосредоточиться. Я протягиваю руку, и в этот миг меня пронзает другое чувство: паника от протянутой руки. Быстрой, резкой, как удар. Чья это была рука? Я замираю. Вода под моими пальцами замирает вместе со мной. Потом, медленно, начинает светиться изнутри. Тускло. Больно для глаз. Этот свет... Он вызывает не интерес, а глухую тошноту. Я его знаю. Он горел надо мной долгие часы, дни, врезаясь в веки даже когда я закрывала глаза. Эксперимент пошёл наперекосяк. Данные искажены. Я не могу отделить сигнал от шума, потому что шум – это моё собственное прошлое, всплывающее обрывками через воду, которая должна быть нейтральным носителем. Когда у парня в лодке дёргается глаз, я вижу не аномалию, а отражение собственного тика, который у меня был тогда, под тем светом. Дни сливаются. Утренняя установка. Вечерний отбой. Я веду записи, которых никто не прочтёт. Я ставлю галочки в невидимых журналах. Результат: отрицательный. Или положительный, но не в том ключе. Вода не даёт ответов. Она даёт отражения процедур. Моя методичность – не моя. Это чужой протокол, вбитый в меня намертво. Мой поиск – это выполнение их последнего, незавершённого предписания. Тяжёлый ком в груди – это не предчувствие. Это узнавание. Я ищу себя, пользуясь чужими инструментами, в зеркале, которое они мне оставили. И всё, что я вижу – это перекошенное лицо больной, смотрящей из-за толстого стекла. Я должна разбить это стекло...”"
OCH_first_phase.1.a:0 "...но что останется от лица?"

OCH_first_phase.2.t:0 "Южный караван I"
OCH_first_phase.2.d:0 "Караван Лыкова пересёк условную границу по обломкам старого шлагбаума и замер, ожидая привычного сценария: свист пуль из-за бугорка, рёв мутантов из камышей или хотя бы хриплый окрик: «Стой! Сдавай добро!». Вместо этого их встретила дорога. Не тропа, протоптанная в грязи, а именно дорога – расчищенная от крупного камня, с обочинами, где лежали аккуратные сваи битого кирпича, будто кто-то готовился его куда-то вывезти. Воздух был прозрачен и тих. Слишком тих. Нет воя ветра в проводах – не было проводов. Не было карканья ворон на развалинах – так как не было ворон. \nОни двигались дальше, спускаясь к Волге. В полях, среди ржавых скелетов сельхозмашин, работали люди. Они не оборачивались на скрип телег. Их движения были плавными, экономичными, лишёнными суеты. Никто не останавливался, чтобы перекурить или перемолвиться словом. У причалов мужчины и женщины чинили сети. Без смеха, без брани. Только тихий скрип игл и шлёпок поплавков о воду. Караванщики, закалённые в стычках и торге, чувствовали себя здесь грубыми, неуклюжими пришельцами. Их громкие голоса, их смешки затихали сами собой под гнётом этой всеобщей, сосредоточенной тишины. \n- Смотри-ка, – прошептал молодой возница, тыча пальцем в стену полуразрушенного сарая. Там, где в любом другом месте уже давно торчали бы следы пуль и похабные надписи, лежал аккуратный слой свежей побелки. Не для красоты – для чего-то иного. Чтобы законсервировать? Чтобы скрыть? Лыков, старый волк, торговавший ещё в прошлом тысячелетии, сканировал местность профессиональным взглядом. Ни одного стратегически правильного окопа. Ни одного наблюдательного поста на высотках. Но и ни одной брошенной, разграбленной тачки. Каждое развалившееся здание выглядело так, будто его бережно оставили умирать своей смертью, не растаскивая на кирпичи. И люди... Они смотрели на караван сквозь него. Взгляд скользил, не задерживаясь, будто мимо проехала не телега с диковинными товарами, а проплыло облако или пронеслось порывом ветра. Ни любопытства, ни алчности, ни страха. \n- Не место тут живым... – буркнул, крестясь, старый возчик Семёныч, глядя на деревянные мостки, которые безупречно чистыми рядами уходили в тёмную, почти неподвижную воду. - Всё правильно. Всё... Чересчур правильно. Мурашки по коже. \nЛыков лишь кивнул. Привычный мир хаоса, где всё решает сила и бдительность, здесь оказался перевёрнут с ног на голову. Здесь правил какой-то иной, непостижимый закон. И отсутствие видимой угрозы было самой большой угрозой из всех."
OCH_first_phase.2.a:0 "- Тишина здесь не от пустоты, а от чересчур чёткого порядка. Словно весь этот мир лишь музей под открытым небом, а мы в него вломились, нарушив тишину залов.»"

OCH_first_phase.3.t:0 "Южный караван II"
OCH_first_phase.3.d:0 "«Утро третьего дня началось с немого спектакля. Ещё до восхода, в сизом предрассветном мраке, они стали сходиться к воде. Не толпой – стройными, беззвучными потоками, как муравьи на сахарный след. Дети, женщины, старики – все заняли места вдоль берега, лицом к реке. И замерли. \n- Смотрите, – прошипел Лыков, будя своих. - Но тихо. \nОни наблюдали из-за развалин. В наступающем свете сотни силуэтов казались вырезанными из серого картона. Ни шепота, ни кашля, ни потирания рук от холода. Тишина была настолько плотной, что в ушах звенело. А потом они начали. Без знака, без команды. Просто в один миг воздух наполнился шёпотом. Не разговором – монотонным, бормочущим потоком сотен голосов, сливавшихся в одно гигантское, неразборчивое жужжание. Они говорили не друг другу. Их головы были наклонены к воде, будто они читали строки с её тёмной поверхности. Настя, молоденькая швея, вжалась в стену, глаза полные ужаса. \n- Да они же... не люди. Манекены какие-то, с пружинками внутри... \nНо Лыков видел иное. Их взгляды были не пусты. Они были сфокусированы внутрь, на что-то, что находилось за гранью зрения. И самое леденящее – их дыхание. Огромная толпа дышала в унисон. Медленный, глубокий вдох нарастал в жужжании, затем – такой же размеренный выдох, и голоса на мгновение затихали. Будто одно гигантское, рассредоточенное лёгкое наполняло и опустошало само себя. Это длилось десять минут. Ровно. Потом, так же синхронно, они смолкли. И так же молча, без единого взгляда по сторонам, разошлись по своим делам. После полудня торговля возобновилась. Но теперь караванщики видели подоплёку. Когда речник отдавал почти целый ящик гвоздей за маленькую пластиковую карту, его глаза были не жадными и не расчётливыми. В них читалось лишь одно: «Обмен завершён. Переход к следующей задаче.» \nИх внимание было не их собственным. Оно было арендованным ресурсом, который на время уделяли посторонним, а затем вновь возвращали туда, внутрь, к тому незримому ритму, что диктовала река."
OCH_first_phase.3.a:0 "Это не религия. Это обслуживание механизма. Они не молятся – они проводят техобслуживание реальности, в которой застряли.”"

OCH_first_phase.4.t:0 "Южный караван III"
OCH_first_phase.4.d:0 "«Перед самым отъездом, когда тюки были увязаны, Лыков нашёл старика-сетеправца. Тот, не поднимая глаз, штопал огромную сеть, его пальцы двигались с гипнотической, безошибочной точностью. \n- Эй, дед, – начал Лыков, стараясь, чтобы голос звучал просто, по-деловому. - У вас тут всё... Чинно. Кто за порядком смотрит? К кому обращаться, если что? \nСтарик ответил не сразу. Он закончил протягивать бечёвку, завязал узел. Потом медленно поднял голову. В его мутных, выцветших глазах Лыков увидел неожиданное: быструю, дикую искру. Ту самую, что бывает в глазах загнанного зверя, который уже забыл, как кусаться, но тело ещё помнит страх. Искра погасла, сменившись привычной пустотой. \n- Старших нет, – голос старика был похож на скрип сухого тростника. - Есть Владычица. Она – река. Вода. Она слышит. \n- Понимаю, – с деланным пониманием кивнул Лыков, прикуривая. - Значит, она вам приказы шлёт? Куда сеять, что чинить? \nСтарик покачал головой, и в этом движении была бесконечная усталость. \n- Не приказы... Она тоскует. По чему-то своему, давнему. И от этой тоски... Всё замирает. Всё становится на свои места. Тишина ложится. Раньше, – он наклонился вперёд, и запах старой влажной шерсти и рыбы ударил Лыкову в нос. - Раньше тут ад был. Банды резались, люди с голоду пухли, каждый день грохот. А теперь... Тихо. Мы платим за тишину тишиной. Ты её не увидишь. Она в воде. Она в каждом нашем вздохе. Вы уедете, будете товары возить, выживать. А мы... – он махнул рукой в сторону Волги. - Мы остаёмся. Слушать, как она грустит. И в этой грусти есть свой покой. \nЛыков затянулся, глядя на старика. Он слышал не сказку сумасшедшего. Он слышал отчёт о сделке, которую заключили не с божеством, а с природной катастрофой. Они обменяли свою волю, свой страх, даже свою радость – на гарантию, что завтра не придут грабители или кто похуже. \nКараван тронулся в путь. Поднявшись на последний холм, Лыков обернулся. Сумерки синевой сливали землю, воду и небо. А по берегу, через равные промежутки, стояли неподвижные тёмные фигуры, обращённые к реке. Они не сторожили границу от чужих. Они сторожили саму тишину. Они были живыми вехами, отмечающими границу между миром, где ещё кипела жалкая, жестокая жизнь, и этим странным царством, где всё живое добровольно усыпило себя, чтобы не мешать одной-единственной, вечно тоскующей душе искать покоя на дне."
OCH_first_phase.4.a:0 "Они не построили рай. Они заключили перемирие с кошмаром. И плата по этому договору – их собственная душа."

OCH_first_phase.5.t:0 "Прибившийся I"
OCH_first_phase.5.d:0 "Туман над Волгой был не просто густым – он казался веществом, вышедшим из берегов. Медведь шёл сквозь него, как сквозь ватную преграду, отмечая не глазами, а нюхом и слухом. Дорога между бараками была не просто чиста – она вылизана, будто здесь не ходят, а лишь проводят учения. Воздух пах не просто сырой глиной, а стерильной грязью, лишённой запаха гнили и жизни. Ни крика, ни лая, ни даже хлопка двери. Порядок. Порядок, от которого по спине бежал не страх, а глубокое, профессиональное отторжение. Так не бывает. Такого не должно быть. \nЕё представили как Владычицу. Он ожидал истукана на троне из ржавого металла. Увидел женщину на обломках причала, сидящую в позе усталого патологоанатома после долгого вскрытия. Промокший плащ, бледное лицо, взгляд, прилипший к воде. Не надменность – усталость судна, которое тянет за собой бесчисленные баржи, не зная ни порта назначения, ни груза. \n- Меня зовут Медведь, – его голос был громче, чем он хотел, и тут же умер в тумане. - Мне сказали, вы ищете потерянное. \nОна кивнула, не глядя. Её рука – тонкая, с синевой на запястье, как у долго лежавшей в больнице – протянула обломок пластика. Карта-пропуск с зелёной полосой. Его пальцы автоматически нашли скол, ощутили микрорельеф цифр. Старая, военная память: оценить документ, потом владельца. \n- Номер. Уровень доступа «А3» или выше. Режимный объект закрытого типа, – констатировал он без колебаний. - Найти можно. Но мне нужен инструмент. Люди, оружие, экипировка. Моих ресурсов не хватит. Без этого я здесь – просто статистика, лишний рот. \nОн протянул карту обратно и теперь ждал торга, угроз, попытки физически сломать. Но была тишина, давящая тяжестью всей реки. Он поймал её взгляд. В нём не было ни страха, ни желания подчинить. Был холодный, почти научный интерес, как у исследователя к новому, стойкому штамму вируса. И вопрос, висящий в сыром воздухе: «А ты кто? Что ты за субстанция, если не поддаёшься базовому анализу?». И тогда он почувствовал не давление, а проникновение. Тончайшие, холодные щупальца сознания, скользящие по извилинам его разума, ищущие брешь, слабину, крючок для зацепа. Почти забытое, но всё же удивительно знакомое... По «беседам» с особистами при присвоении звания. Его психика, десяток лет прожившая по уставу, а после – зацементированная опытом падения Родины и вдвое большего по срокам выживания, сработала на опережение. Не сопротивлением, а мимикрией под пустоту. Там, где она искала страх, жадность, тщеславие, зияла вымершая казарма, заставленная ящиками с инструкциями на все случаи и смутным образом знамени, которое уже некому было нести. Щупальца наткнулись не на стену, а на бездонный колодец дисциплины, уходящий в ничто. И она отступили. \n- Что ж, – её голос был похож на звук, с которым лёд отходит от берега. -Значит, ты не лжёшь. И ты... непробиваем. Это ново. Твой отряд. Они такие же? \n- Они такие, что дойдут туда, куда вы не можете послать своих. И вернутся с тем, что нужно. Если цена честная. \n- Цена... – она произнесла слово медленно, будто пробуя его на вкус, и впервые взгляд её оторвался от воды, встретившись с его взглядом. - Для меня – ответ. Для тебя – инструмент. И, возможно... Ключ к тому, почему этот мир лежит в руинах, а такие, как ты, всё ещё ходят по нему."
OCH_first_phase.5.a:0 "Тяжёлые времена порой порождают странные договора..."

OCH_first_phase.6.t:0 "Прибившийся II"
OCH_first_phase.6.d:0 "На следующий день он привёл их к воде. Не просителей и не скот – шесть единиц боевой эффективности, развёрнутых в патрульный ордер. Молчаливых, с взглядами, сканирующими не угрозы, а слабые места в периметре этого аномального спокойствия. Войсковая выправка читалась в каждом жесте, в том, как они не толпились, а занимали секторы. \n- Мой взвод, – голос Медведя был ровным, докладным. - То, что осталось. Остальные полегли там, где отступать было нельзя. \nОхва обвела их взглядом, и на её лице не было оценки - был анализ спецификации. Она не пыталась «нащупать» - вчерашний тест дал исчерпывающие данные. \n- Вы будете моими глазами и руками там, где моя воля не течёт, – сказала она, и её слова звучали не как приказ, а как постановка технического задания. - Вы найдёте следы прошлого. Вы не будете слышать мой голос в головах. Вы будете слушать его, – кивок на Медведя. - А он будет соблюдать наш договор. \n- Почему? – выпалил парень со шрамом через глаз, Ястреб. Его голос прозвучал резко, нарушая тишину. - Почему не... Не загнать нас в строй, как всех? \nОхва повернулась к нему. В её глазах, обычно смотрящих сквозь мир, мелькнуло нечто усталое и понимающее, почти человеческое. \n- Потому что тот, кто дрожит от страха, не пройдёт там, куда вам идти. Потому что то, что я ищу, нужно расшифровать, а не притащить. И потому что... – она сделала паузу, подбирая слова с непривычной осторожностью, - Его разум уже принадлежит другому долгу. Там закончилось место. Это делает его... Технически несовместимым. А значит – бесполезным как инструмент. И уникальным как партнёр. \nМедведь молча кивнул. Всё было кристально ясно. Она покупала не рабов, а функциональный модуль, которого у неё в системе не было. Его офицерская честь, окаменевшая в упрямство, была той уникальной прошивкой, которая делала его неуязвимым для её вируса. Она платила ресурсами за доступ к миру, который её отторгал. И за шанс, хоть призрачный, найти в архивах старого мира свой исходный код. \n- Задание первое, – сказала Охва, протягивая ту самую карту-пропуск. Теперь она лежала в прозрачном пакете, как вещдок. - Узнайте, что это. И куда она ведёт. И кто я такая. \nМедведь взял пакет, кивнул. Не набившее оскомину «Так точно!» – просто кивок командира, принявшего боевую задачу. Он уже понимал, что ищет не просто объект. Он ищет первопричину. И того, кто стоит перед ним, и того ада, в котором они все живут."
OCH_first_phase.6.a:0 "«...а странные договора приводят к таким же результатам."

OCH_first_phase.7.t:0 "Жажда"
OCH_first_phase.7.d:0 "Тишина здесь была разной. Была тишина приказа – густая и неподвижная. А была эта – тишина между ударами сердца. Охва стояла на ржавой палубе земснаряда, слушая её. Она смотрела на старого плотника. Его рубанок водил по доске с гипнотической ровностью. Раз, два, три. На четвёртом взмахе лезвие чуть дрогнуло, срезав лишнюю стружку. Плотник не ругнулся, не вздохнул. Но его пальцы, на миг сжавшие рукоять, белели от напряжения, будто сжимали не инструмент, а чью-то руку. Потом движение снова стало машинальным. Раз, два, три. Раньше она видела только порядок. Теперь – трещины в нём. Маленькие, мгновенно возникающие и так же быстро исчезающие... Но они были. \nУ часового, застывшего у развалин, вдруг задрожала веко – будто ему в глаз брызнули ледяной водой двадцать лет назад, и тело до сих пор помнит этот шок. \nУ женщины, полощущей бельё, на миг сбилось дыхание, когда ветер донёс едва ощутимый запах полыни – и её взгляд упёрся не в реку, а в пустоту над противоположным берегом, где, видимо, когда-то что-то было. \nОхва закрыла глаза. Она отключила грубый канал команды «работать» и попыталась настроиться на этот фон – на шёпот забытых душ. Это было похоже на попытку расслышать эхо в глубоком колодце. Не слова – ощущения. \nСпазм в горле от невыплаканных слёз. Судорожную теплоту в груди при мысли о чём-то утраченном. Глухую, упрямую жажду – не к воде, не к пище, а к чему-то такому простому, что у неё самой не было слов. Жажду быть целым. Жажду, чтобы внутренняя боль находила отклик во внешнем мире, а не глохла в пустоте. \nИ в этот миг она не стала им ближе. Она поняла дистанцию. Поняла, что её воля, как тяжёлое покрывало, лишь придавила их собственную, но не растворила. И, осознав это, она неосознанно ослабила хватку. Не отпустила, нет. Словно едва приподняла покрывало, давая тому, что под ним, чуть больше места для собственного, призрачного дыхания. Ничего не изменилось. Плотник продолжал строгать. Часовой стоял. Но давящая тяжесть в воздухе – та, что мешала даже простейшим делам идти гладко – чуть рассеялась. Движения людей не стали живее, но исчезли те микроскопические задержки, когда их подавленная натура пыталась дёрнуться в сторону. Стало... Тише. Но по-иному. Не тишина мёртвого зеркала, а тишина глубокой воды, в которой наконец перестали биться о стенки сосуда пойманные когда-то и почти уснувшие рыбы."
OCH_first_phase.7.a:0 "Иногда, чтобы лучше слышать тишину, нужно самому сначала замереть. И услышать в ней чужое, давно забытое эхо."

OCH_first_phase.8.t:0 "Следопыт I"
OCH_first_phase.8.d:0 "Граница проходила не по заборам или вышкам. Она чувствовалась в воздухе. Стоило отойти на третий холм от реки, как тишина сменилась на слух. Не на звук, но на его возможность. Ветер свободно гулял в ржавых каркасах, где-то далеко скрипела незакреплённая жесть, и в этой свободе был постоянный, невидимый риск. Медведь присел у старой колёсной колеи, вмёрзшей в грязь, как шрам. Провёл пальцем по краю. \n– Шестиколёсный грузовик. Сдвоенная резина сзади. Прошлой осенью, не позже. \nКостя, не отрываясь от бинокля, кивнул в сторону лощины. Там, среди сгоревших берёз, виднелась неестественно правильная груда камней – основание для палатки или наблюдательного пункта. Следы не жилья, а временной дислокации. Они двигались цепью, соблюдая дистанцию. За спиной оставался тот странный покой, где даже сорняки росли как будто по плану. Впереди лежал подлинный мир: развороченный окоп, в котором валялись не кости, а пустые консервные банки с гнутыми открывашками; ржавый остов «Урала» с распахнутыми дверями, будто его покидали в спешке, но не из-за обстрела, а по команде. \n- Чувствуется, – тихо бросил Ястреб, всё ещё нервно перебирая пальцами. Его шрам под глазом казался темнее на бледной коже. - Чувствуется, что тут живут не по её правилам. Странно... \n- Здесь живут по правилам пули и ножа, – глухо ответил Саня, его обожжённое лицо оставалось неподвижным, но глаза метались, сканируя кусты. - Проще. Грязнее. \nФилин лишь хмыкнул, щёлкая предохранителем своего АК. Звук был громким и успокаивающе земным после той гнетущей тишины. Медведь вёл их, читая ландшафт как карту. Вот здесь колонна свернула – значит, мост был взорван. Вот тут на стволах деревьев сохранён ожог только с одной стороны – значит, взрывная волна пришла с юга, с предполагаемых позиций «Эдема». Его солдатский ум, тосковавший по ясным целям, теперь находил отдушину в этой работе. \n- Командир, – голос Кости не дрогнул, но в нём появилась сталь. Он указывал на покосившийся дорожный столб. Под слоем грязи и плесени проглядывала стрелка и выцветшая надпись: 14-Б. \nМедведь подошёл, счистил грязь рукавицей. И обнажил эмблему. Не армейские звёзды. Стилизованное зелёное древо. Знак. Чужой, чёткий, несущий в себе обещание порядка, отличного от того, что царил у Охвы. Порядка лаборатории, а не меланхолии. \n- Всем тихо, – сказал Медведь, и его голос стал низким. - Мы на их земле. Теперь мы не охотники. Мы мыши в чужой кладовой."
OCH_first_phase.8.a:0 "Западный рубеж. Здесь кончается её грусть и начинается чужой, безликий интерес. И одно страшнее другого."

OCH_first_phase.9.t:0 "Следопыт II"
OCH_first_phase.9.d:0 "Два дня... Много это или мало? Если ты старушка, что бесцельно доживает свой век, это ничтожно мало, ведь граница между днями и месяцами почти стёрта. Но если ты крепкий мужчина, который ищет даже не иголку в стоге сена, а каплю в реке, да ещё ведущий за собой таких же людей... Два дня могут ощущаться как маленькая вечность. Безжизненные улицы, десятки зданий. Поиск был непростым, очень непростым. И тем не менее, они смогли найти искомое.\nОбъект «14-Б» оказался не заводом и не казармой. Это был саркофаг. Низкое, приземистое бетонное здание, почти вросшее в холм. Двери были взломаны давно, внутри царил привычный бардак: сломанная мебель, пустые банки, ветер, гуляющий по коридорам...\nНо не это привлекло внимание. В дальнем конце главного зала, за опрокинутым столом, зияла дыра в полу. Не аварийный пролом, а аккуратный, квадратный люк с заржавевшими, но всё ещё бывшими на месте направляющими для лифта.\n- Филин, Гром – прикрываете верх. Остальные – за мной! – скомандовал Медведь. Его голос прозвучал глухо под бетонными сводами.\nПодземелье было небольшим. Лаборатория? Бункер? Хранилище? Стеллажи пусты, оборудование демонтировано, только на стенах остались следы от креплений кабелей и едкий, химический запах консервации.\n- Командир! – через несколько минут внезапно позвал шёпотом Ястреб. Он стоял у единственной целой тумбы, держа в руках толстую папку в пластиковой обложке, чуть оплавленной по краям. - Смотри!\nМедведь взял папку. Сквозь мутный пластик читался гриф: «ОБЪЕКТ 14-Б: ПРОЕКТ «РОДНИК». ОТЧЁТ ОБ ИСПЫТАНИЯХ №4».\nСердце у Медведа ёкнуло с непривычной силой. Он был солдатом, а не учёным, но в этом тексте сквозила та же мёртвая, казённая серьёзность, что и в боевых приказах перед наступлением. Он раскрыл папку. Большинство страниц были вырваны или истлели. Но несколько листов уцелело. Графики с кривыми, таблицы с номерами, а на одном из последних листов – чёрно-белая фотография. Помещение, похожее на операционную. На столе – силуэт человека, окружённый аппаратурой. А в углу фотографии, от руки, было выведено: «Субъект 07-ВОЛ. Первичная стабилизация. Процедура признана успешной. Начало фазы наблюдения.».\nИ ниже – печать. Ветвистое зелёное дерево с корнями в виде треугольника. И подпись. \nМедведь медленно закрыл папку. Воздух в бункере внезапно показался ему ледяным. Он смотрел не на документ, а сквозь него. Видел не графики, а ту самую девушку на причале с глазами полными тихой тоски. «Субъект 07-ВОЛ». Семь. Волга. Пазл сложился со щелчком, от которого зазвенело в висках."
OCH_first_phase.9.a:0 ""

OCH_first_phase.10.t:0 "Следопыт III"
OCH_first_phase.10.d:0 "-Командир? – Костя смотрел на него, понимая по лицу, что найдено что-то большее, чем просто бумага.\n- Всё. Уходим! – хрипло сказал Медведь, засовывая папку под бронежилет. Её вес был ничтожен, но она давила на грудь, как ещё одна бронеплита. Теперь он знал. Знание было тяжёлым, липким и... Опасным. Он нашёл не «что это». Он нашёл «кого это». И куда это ведёт теперь было ясно как день – дальше на запад.\nОни выбирались на поверхность молча. Даже Ястреб не спрашивал. По лицам всех было видно – они прикоснулись к чему-то большому. К прошлому, которое не хотело оставаться в прошлом.\nТолько когда до условной границы Её владений оставалось менее полудня пути, он позволил себе остановиться и оглянуться. Здание давно скрылось за лесами и холмами. Но Медведь чувствовал его присутствие за спиной, как шрам. Он больше не был наёмником. Он стал носителем тайны. Он теперь знал, что Охва не божество и не феномен. Она – закрытое дело чьей-то чудовищной бухгалтерии, забытая папка в архиве апокалипсиса. И эта мысль была страшнее встречного огня."
OCH_first_phase.10.a:0 "Иногда, чтобы найти ответ, нужно заглянуть в чужой кошмар. И узнать в нём знакомые очертания."

OCH_first_phase.11.t:0 "«Приоритеты»"
OCH_first_phase.11.d:0 "Ночь впитывала звуки, как песок впитывает кровь. Охва стояла на краю спящего посёлка, и тишина была настолько плотной, что в ней звенело. Не та тишина приказа – а тишина перед выбором. \n“Если я буду полагаться лишь на контроль, рано или поздно найдётся тот, кто его сможет избежать...”\nМысль, как всегда, оборвалась на полуслове. Не потому, что не было конца, а потому что конец был слишком знаком. Он жил не в памяти, а в теле: в дрожи коленей, в сжатом желудке, в привкусе железа на языке. \nАлый цвет на белом. Скользкие пальцы. Всепоглощающая паника, после которой мир погрузился в пустоту. Невозможно контролировать того, кто не контролирует себя. \nОна отвела взгляд от внутреннего кошмара. Вон там, прислонившись к стене барака, спал старый плотник. Даже во сне его руки на коленях медленно сжимались и разжимались. Не в ритме дыхания. В ритме тоски по форме рубанка, по сопротивлению дерева. Он был здесь с первых дней, ещё до того как она очутилась здесь. Его «жажда» не угасла. Она стала его второй, мучительной жизнью под плёнкой её воли. \n“Они страдают.” \nМысль прозвучала тихо, но от этого она не стала менее чужой. Раньше такого голоса в её голове не было. А что, если их страдание - это слабость системы? Что, если оно, как ржавчина, разъедает тишину изнутри? Это был голос страха. Старого, как её пробуждение в этих водах. Или... \n“Что, если это единственное, что в них ещё живо? И если я убью и это – то, кем они станут? А кем стану я?”\nПеред её внутренним взором расходились две бездны. \nПервая – знакомая. Уйти вглубь власти. Направить всю силу не на простое подавление, а на тотальное, хирургическое выжигание этих дёргающихся осколков воли. Сделать их совершенными. Бесшумными. Абсолютно эффективными. Это будет милосердием машины к бракованной детали. Но цена... Ценой будет весь её разум, прикованный к этой кропотливой, жестокой работе. Не будет сил смотреть в воду и искать свои собственные черты. Она станет идеальным тюремщиком в тюрьме, ключ от которой потерян. \nВторая – пугающая своей неопределённостью. Разжать пальцы. Не все. Не сразу. Но часть. Тех, чьи призраки кричат громче всех. Отпустить их за пределы её восприятия, в холодный хаос мира, где выживают только те, кто может чувствовать и распространять страх и боль. Это риск. Они умрут. Или станут угрозой. Но их уход... их уход снимет с её души часть этого чужого, тяжёлого груза. Освободит пространство для её собственной, одинокой тоски. Это будет жестоко. Но это будет... Актом чего-то, на что у неё нет названия. Может быть, усталости. Может быть, отчаяния. А может – первого ростка чего-то иного, что пытается пробиться сквозь лёд её существования. Она смотрела на свои руки. Они были холодны и неподвижны. Но внутри бушевала буря из страха, усталости и этого нового, невыносимого знания. Знания о чужой боли. Решать нужно было сейчас. В этой немой, постапокалиптической ночи, под присмотром спящих страданий и неспящих звёзд."
OCH_first_phase.11.a:0 "Сила должна быть чистой. Боль лишь шум."
OCH_first_phase.11.b:0 "Я не могу нести весь этот груз. Им не обязательно тонуть вместе со мной."

OCH_first_phase.12.t:0 "Контроль"
OCH_first_phase.12.d:0 "Процедура не имела названия. Охва стояла в центре сети не водной, но ментальной. От неё, как лучи, расходились тончайшие нити воли. К тем, кто «жаждал». Она больше не подавляла волю. Она её перекраивала. Старый плотник строгал доску. В момент, когда его пальцы должны были дрогнуть от тоски по иной жизни, по его сознанию пробегал чёткий, холодный импульс. Не боль. Не запрет. Переадресация. Желание «вспомнить» плавно перетекало в желание «зачистить сучок». Тоска по свободе превращалась в одержимость качеством среза. Его глаза, прежде пустые, теперь горели нечеловеческой, лишённой мысли сосредоточенностью. Он стал идеальным инструментом. И абсолютно несчастным существом, которое даже не знало, что такое несчастье. \nОхва наблюдала за системой. Всё работало. Движения речников стали ещё тише, ещё синхроннее. Не было сбоев. Не было дёргающихся век, сбитого дыхания, взглядов в пустоту. Была безупречная, мёртвая эффективность. И цена этой эффективности висела на ней тяжким грузом. Её разум был теперь похож на пульт управления атомной станцией: тысячи лампочек, требующих постоянного внимания. Всё её «я» было занято тем, чтобы гасить малейшие вспышки чужой души. На то, чтобы смотреть в воду и искать в ней себя, не оставалось ни сил, ни, что страшнее, желания. \nЗачем искать своё «я», когда ты и есть эта управляющая сеть? Когда твоя суть сам контроль? \nОна подошла к воде. Посмотрела на своё отражение. И не увидела в нём ни тоски, ни вопроса. Увидела усталого оператора сложной системы. Ответ на вопрос «как обходиться с теми, кто ценит свободу воли» был найден. Свободу воли нужно ликвидировать как класс. Превратить её в функциональный, предсказуемый импульс. Это было чисто. Безопасно. Бесчеловечно. И глядя в безликое отражение, она понимала, что сделала выбор. \nОна предпочла безопасность системы возможности стать кем-то ещё. Возможно, кем-то, кто мог бы пожалеть того старого плотника, каким он был раньше"
OCH_first_phase.12.a:0 "Свобода – это хаос. Порядок – это контроль. Выбрав одно, ты навсегда отказываешься от другого."

OCH_first_phase.13.t:0 "Ограниченная свобода"
OCH_first_phase.13.d:0 "Семь десятков душ. Именно столько было ушедших. Пустота, которую они оставили, была не арифметической. Она была качественной. В бараке, где жили десять из них, теперь стояла звенящая тишина, не похожая на общую тишину порядка. Это была тишина освобождённого места. Оставшиеся речники обходили его стороной, не понимая, но чувствуя нарушение паттерна. И случилось неожиданное. В тех, кто остался, усилились «сбои». \nЖенщина, полощущая бельё, вдруг застыла на полчаса, глядя на то место у причала, где раньше стоял её муж, один из ушедших. Её не нужно было возвращать в строй. Она просто стояла. \nИ Охва, к своему удивлению, не чувствовала прежнего раздражения от этой помехи. Она чувствовала... Тяжёлую ясность. Это и есть та самая «жажда». Не абстрактная, а очень конкретная тоска по конкретному человеку. Боль, которая имеет форму и адрес. И которую нельзя «переадресовать», можно только пережить. \nОхва стояла на причале. Её разум, прежде отягощённый грузом семидесяти лишних, чужих страданий, теперь был не легче, а иным. Он был яснее. Она могла смотреть на воду и не отвлекаться на постоянный шум чужой боли. Она видела в отражении своё лицо: уставшее, но принадлежащее себе. Ответ на вопрос «как обходиться с теми, кто вожделеет свободу воли» оказался парадоксальным. С ними нужно расстаться. Позволить их свободе и их боли уйти за пределы твоей досягаемости. Это не решает проблему. Это просто очерчивает границы твоей ответственности. Ты отвечаешь только за тех, кто остался. И за их «жажду», которую теперь видишь чётче, потому что она не тонет в общем гуле. Но с ясностью пришло и новое понимание. Отпустив их, она признала: свобода воли существует. И это реальная сила, которая может вырваться из-под контроля. И если она есть у них... То, возможно, когда-то она была и у неё самой. И вопрос теперь горел в ней не тусклым углём, а ясным, тревожным пламенем."
OCH_first_phase.13.a:0 "Кем я была, когда могла выбирать?"

OCH_first_phase.14.t:0 "Статья УК СР 110 I"
OCH_first_phase.14.d:0 "Объект назывался «Архив N7». На деле это был подвал сожжённого здания районного управления МВД, который чудом уцелел под грудой бетона. Вход нашли по старой схеме, люк был заварен, но автоген Филина справился. \nВнизу пахло сыростью, плесенью и тлением бумаги. Не архив, а кладбище папок. Медведь водил лучом фонаря по полкам, на которых дела стояли плотно, как гробы в нишах. \n«Уголовные дела: 2000-2001». \n– Ищем что-то связанное с режимными объектами, – бросил он своим людям. – Всё, что с грифами. \nОни работали молча, в облаках пыли. Шаг за шагом, полка за полкой. Искали след системы, а нашли человека. \n– Командир, – голос Ястреба прозвучал странно – не тревожно, а... осторожно. – Смотрите. \nОн стоял у дальнего стеллажа, держа в руках не папку в картоне, а толстую, кожаную папку-скоросшиватель с оттиснутой на обложке аббревиатурой «ГВВК» и грифом «Для служебного пользования». \nА ниже, на наклеенной бирке, от руки: «Дело №03/124-01. По факту гибели майора В.К. Маркова. Обвиняемая: Маркова (Нойман) Инга Робертовна. Заключение ГВВК: невменяема.» \nСердце у Медведя ушло в пятки. Инга. Имя ничего не говорило. Но номер статьи... 110-я статья УК СР. Убийство, совершённое в состоянии внезапно возникшего сильного душевного волнения. Гриф. Военные врачи. Невменяема. И подшитая фотография... Выцветшая от времени, ссохшаяся – но образ был узнаваем. \nОн взял папку. Она была тяжёлой. Он не стал открывать её здесь, в этой гробнице. Он просто прижал её к бронежилету. \n– Всё. Уходим. Задание выполнено."
OCH_first_phase.14.a:0 "Порой самые важные находки те, что хотя что бы их нашли."

OCH_first_phase.15.t:0 "Статья УК СР 110, часть II"
OCH_first_phase.15.d:0 "Они разбили лагерь в нескольких километрах от архива. Медведь сидел у слабого огня, папка лежала перед ним, как обвинительный акт миру. Он открыл её. Пропустил сухие юридические формы, заключения экспертиз. Его взгляд упал на протокол допроса обвиняемой. Листы были пожелтевшими, машинописный текст кое-где смазан. Но всё же... Был читабелен. \n«Допрос от 14 октября 2001 г. \nОбвиняемая: Маркова (Нойман) Инга Робертовна, 1979 г.р., преподаватель кафедры биофизики ННГУ. \nВопрос: Расскажите, как произошёл инцидент вечером 12 октября. \nОтвет: Он... Вернулся с учений. Трезвый. Но был не в себе. Говорил, что подписал бумаги. На «добровольное участие в испытаниях нового средства психофизиологической коррекции». Для всего его подразделения. Говорил, что приказ спущен сверху и отказаться нельзя. Что это «прогресс» и «честь». Я... Я знала, что это такое. Мои коллеги по университету шептались. Это не коррекция. Это стирание. Конвейер по производству идеальных, не задающих вопросов солдат. Я сказала ему, что нельзя. Он закричал. Сказал, что я не понимаю долга. Что если он откажется, мы все станем «неблагонадёжными» с соответствующим результатом. А если согласится, то для нас ничего не поменяется...»\nТут текст становился неразборчивым, и как бы Медведь не силился, он не мог разобрать, что было в размытом абзаце. Глаза судорожно скользнули к следующему различимому блоку.\n«...сейф. Уже выпивший, за пистолетом. Говорил, что не может так жить. Что лучше... Лучше пусть всё кончится сейчас. Я... Я не знаю, что было дальше. Я видела только его спину, сейф, и понимала, что, если этот пистолет сейчас... Не знаю... Он выстрелит либо в себя, либо в меня, а потом всё равно придут за сыном. И я... я схватила со стола нож. Это было единственное, что было под рукой. \nВопрос: Вы утверждаете, что действовали в состоянии необходимой обороны? \nОтвет: Я действовала... чтобы мой сын не стал сиротой. Чтобы муж не стал монстром. А сама... стала монстром. Разве это защита?» \nМедведь откинулся на холодную бетонную стену. Воздух казался густым. Он читал не протокол. Он читал приговор. Не суда. Самой жизни. Женщина, преподаватель, убила мужа-офицера в военное время не из ревности или алчности. Чтобы спасти его от участи стать пустым сосудом, а сына от расправы или, в лучшем случае, детского дома. Но в итоге сама попала в лапы той самой системы, от которой пыталась его уберечь. \n«Невменяема» – это был не диагноз. Это был приговор системе, которая, не сумев забрать одного, забрала другую, сломав её и переделав во что-то иное. \nЯстреб, сидевший напротив, смотрел на него. \n- Плохие новости, командир? \n- Самые плохие, – хрипло ответил Медведь."
OCH_first_phase.15.a:0 "Правда редко бывает чёрной или белой. Чаще она кроваво-красная и беспросветно-серая, как пепел после пожара."

OCH_first_phase.16.t:0 "Статья УК СР 110, часть III"
OCH_first_phase.16.d:0 "Медведь дочитал дело до конца. Заключение судебно-психиатрической экспертизы: «Острый реактивная психоз на фоне хронического психологического давления и страха за жизнь ребёнка. Подлежит принудительному лечению в специализированном учреждении закрытого типа». \nСпециализированное учреждение... Психоневрологический диспансер №1, он же – «приёмник» для «особых контингентов». Далее шли уже знакомые по папке из бункера отрывки: «Перевод субъекта в рамках проекта «Родник». Субъект 07-ВОЛ.» \nПазл сложился окончательно. Да как сложился: вогнал каждый фрагмент с такой силой, что стало физически больно. Она не была чудовищем от рождения. Она была жертвой, сломленной системой дважды: сначала системой, что ударила её мужа под дых, а затем той же системой, использовавшей её собственную травму как сырьё для создания нового оружия. \nОн сидел, глядя на огонь, а перед ним стоял призрак той женщины с причала. Её отстранённость, её грусть, её поиск... Это были не черты властительницы. Это были шрамы. Шрамы от потери семьи, от ужаса перед содеянным, от нечеловеческих экспериментов. Вся эта атмосфера «не от мира сего» вблизи реки было не метафорой, а констатацией факта. Мир, к которому она принадлежала – мир книг, семьи, ясного будущего – был уничтожен ею самой и теми, кто пришёл после. \n- Что будем делать с этим? – тихо спросил Костя, кивая на папку. \nМедведь долго молчал. Он думал о её взгляде, о её попытке «нащупать» его разум. Думал о папке «Субъект 07-ВОЛ». \n- Мы доставим это ей, – наконец сказал он, приняв тяжёлое решение. \n- Это... опасно. Она может... \nОн аккуратно сложил листы, закрыл кожаную обложку. В его руках лежала не просто папка. Лежала чья-то сломанная жизнь, чья-то причина стать тем, чем она стала. И теперь ему предстояло вернуть её владельцу. Без уверенности, что она захочет это принять. И что не повернёт эту боль против него самого.\n- Она имеет право знать, – перебил Медведь, и в его голосе прозвучала не привычная командирская сталь, а что-то иное. Почти солидарность. - Она имеет право знать, кем она была. И почему она здесь. А дальше... Дальше она решит сама. Стоила ли эта папка усилий? – он посмотрел на лица своих людей."
OCH_first_phase.16.a:0 "-Узнаем только когда отдадим."

OCH_first_phase.17.t:0 "Осколки памяти I"
OCH_first_phase.17.d:0 "Всё началось с тишины. Не той, что обычно здесь царила – густой, давящей, как сон без сновидений. А с иной: внутренней, звенящей, как после разрыва фугасного снаряда. \nМедведь принёс папки не на причал. Он принёс их в барак, где Охва сидела на краю пустой койки, глядя на трещину в стене. Её взгляд скользил по ней уже час, будто пытался прочитать в её извивах ответ на невысказанный вопрос. \nОн положил папки на стол. Не произнёс ни слова. Просто отступил к двери, приняв свою привычную стойку. Она не сразу посмотрела. Сначала она слушала. Слушала, как за её окном шелестит Волга, как ветер гудит в разбитой трубе, как где-то далеко ребёнок пытается сдержать кашель. Всё, как и всегда. Весь этот безупречный порядок... \nПервый лист. Уголовное дело. Номер. Даты. Её собственное имя, напечатанное на машинке. Звук был тихим, почти неслышным. Но в её голове он отозвался гулом, как будто кто-то ударил в колокол, забытый на дне реки. Она не вспомнила себя в этой женщине. Она узнала её. Не лицом – структурой. Как геолог узнаёт породу по излому. \nОна медленно перелистывала страницы. Сухой юридический язык. Показания. Заключение экспертизы. \n«Состояние острого реактивного психоза...» \nСлова были чужими, но чувство – нет. Оно поднималось из глубины, как пузырь со дна: всепоглощающая паника, беспомощность, ужас перед системой, которая уже протянула к ней щупальца. И затем – холодная, решающая ясность. Читая строки о муже, о сыне, о ноже, она не видела сцену. Она чувствовала вес в руке. Тупой, тяжёлый, знакомый. И облегчение – чудовищное, постыдное – когда этот вес наконец опустился. Но это была лишь прелюдия. Дальше шли другие документы. \nПереводы. Диагнозы. Проект «Родник». «Субъект 07-ВОЛ». И печать. Зелёное древо с корнями-треугольниками. «Малый Эдем». И тут тишина внутри неё раскололась. Не криком, не плачем. Оглушительным, беззвучным щелчком смыкаясь в единую, чудовищно ясную картину. \nОна была не аномалией. Не божеством реки. Не случайной мутацией. Она была закрытым делом. Они не просто нашли её сломанной... Они использовали этот слом. Её боль, её травму, её утрату – всё, что осталось от Инги Нойман, просто взяли, очистили, разложили на составляющие и собрали заново. Как собирают сложный прибор. \nПси-резонатор. Живой инструмент для подавления воли. Её тоска по утраченной семье, её вина, её отчаяние – всё это стало топливом для машины, которая теперь держала в тихом оцепенении тысячи душ. Она подняла глаза и посмотрела на Медведя. \nЕё взгляд был, казалось бы, пуст, как и обычно, но на самом деле был просто переполнен. Переполнен знанием, которое не оставляло места ни для чего иного. \n- Они не просто стёрли меня, – её голос был тихим, ровным, без интонаций. Он звучал так, будто его произносили не губы, а сама тишина в комнате. - Они взяли то, что я пыталась спасти, и сделали из этого тюрьму. Для меня. И для них. \nОна кивнула в сторону окна, за которым мерцала река и беззвучная жизнь её речников. Она положила ладонь на стопку бумаг. Не для того, чтобы сжечь или разорвать. Чтобы ощутить их физически. Почувствовать осязаемый след кошмара, который её создал."
OCH_first_phase.17.a:0 ""

OCH_first_phase.18.t:0 "Осколки памяти II"
OCH_first_phase.18.d:0 "-Вся моя тоска... Вся эта бесконечная, бессмысленная грусть... Как много вопросов за года...\nОна посмотрела на свои руки. Обычные человеческие руки. \n- И вот ответ, – произнесла она наконец, и её голос был лишён всего: ни облегчения, ни отчаяния. Просто констатация. - Не божество. Не феномен. Просто номер. \nОна медленно поднялась с койки, оставив папки лежать на столе. Подошла к окну. \nЗа стеклом тянулась Волга – широкая, тёмная. Не её продолжение, а скорее... Аппарат. Система жизнеобеспечения, к которой её подключили. Навсегда. \n- Спасибо, – сказала она, не оборачиваясь. Слово прозвучало странно – не как благодарность, а как отметка в журнале. \nОна повернулась к Медведю. В её глазах не было ни ярости, ни скорби. Была только та же знакомая, вечная усталость, но теперь с новым, холодным фокусом. Как у стрелка, который наконец разглядел мишень в тумане. \n- Моя тоска не была вопросом. Она была шрамом. А шрамы... – она слегка коснулась виска. - Шрамы можно использовать как прицельные метки.\nТеперь, зная форму своей клетки, она могла начать расчёт давления, которое потребуется, чтобы её деформировать. Или раздавить того, кто запер её в ней."
OCH_first_phase.18.a:0 "Туман рассеялся. Пейзаж, открывшийся за ним, был безрадостен, чёток и полон холодной ярости."

OCH_first_phase.19.t:0 "Тропинка к правде I"
OCH_first_phase.19.d:0 "«Вода не ответила. Она лишь отражала – тусклое небо, обрывки облаков, неподвижную фигуру. Охва стояла, глядя не на поверхность, а сквозь неё, будто пыталась разглядеть на дне не камни, а чертежи собственного устройства. \nЗнание собственного имени было ключом, но не отпирало замок. Оно лишь указывало на дверь. Дверь, за которой скрывалось всё остальное: механизмы, схемы, отчёты. Причина её пробуждения здесь, в излучине Волги, под Чебоксарами. Предел её воли, очерченный невидимым барьером. Возможность того, что она – не единственная в своём роде. \nОна медленно развернулась и вошла в низкое помещение бывшей насосной станции, которое служило ей кабинетом. На столе лежали карты, испещрённые пометками Медведя. Кружками и крестиками отмечены проверенные объекты, стрелками – возможные маршруты. В центре – Казань. Не просто город. Столица «Нового Эдема». \nСердце системы, которая когда-то породила проект «Родник» и, возможно, всё ещё считала его своей собственностью. Медведь ждал, стоя у стены. Его лицо было каменным, но в глазах читалась та же усталая готовность, что и в её молчании. \n- Ты и твои люди нашли точку входа, – сказала она. Не вопрос. Констатация. \n- Да. Завод «Электроприбор» по документам. По сути – центральный архив и логистический узел. Находится почти в географическом центре города. По косвенным данным, там хранились финальные отчёты по всем пси-резонансным проектам, включая параметры инициализации и карты зон контроля, – его голос был ровным, докладным, но в нём появилась новая нота – осознание масштаба. - Охраняется не бандитами. Остатками регулярных частей. Теми, кто помнит дисциплину. Это их цитадель. \nОна кивнула, проводя пальцем по карте от Чебоксар к Казани. Расстояние – не просто километры. Это – последовательность преодоления. Цепочка действий, которая ведёт прямо в сердцевину чужой власти. \n- Мне нужны не просто отчёты. Мне нужны протоколы инициализации. Параметры среды первого включения. Границы зоны контроля. И списки. Списки других субъектов, если они есть, – она говорила тихо, но каждое слово падало с весом свинцовой плиты. - Я должна понять не только что они со мной сделали, но и как. И есть ли способ... Перенастроить систему. Или найти тех, кто пережил то же самое. \nОна посмотрела на Медведя. Её взгляд был лишён просьбы. В нём была лишь ясная, холодная постановка задачи."
OCH_first_phase.19.a:0 ""

OCH_first_phase.20.t:0 "Тропинка к правде II"
OCH_first_phase.20.d:0 "- Это будет не разведка. Это будет извлечение из-под носа у спящего, но вооружённого зверя. Они не отдадут это добровольно. Их порядок – это порядок сейфов, грифов. Мой порядок... – она на секунду замолчала, прислушиваясь к тихому гулу за стенами, к мерному дыханию спящего поселения. - Мой порядок требует этих данных для завершения картины. Без них я останусь наполовину слепой. \nОна отодвинула карту и взяла со стола лист бумаги – не современный обрывок, а пожелтевший бланк с печатью «Малого Эдема», один из тех, что нашёл Медведь. Символ зелёного древа казался сейчас не эмблемой, а мишенью. \n- Я не объявляю им войну, – произнесла она, и в её голосе впервые прозвучала тонкая, как лезвие бритвы, грань между констатацией и ультиматумом. - Пока. Мне нужны документы о проделанной работе. О работе над собой. Но если они откажутся выдать свой же отчёт... Если встанут на пути между мной и моим прошлым... Тогда это станет войной. Не из мести. Из прагматики. Чтобы мой мир – этот хрупкий, тихий мирок на воде – не оказался лишь экспериментом в чьём-то журнале, который можно закрыть и утилизировать по окончании испытаний. \nОна протянула лист Медведю. \n- Возьми своих людей. Найди путь внутрь. Будет трудно, но я уверена – ты пройдёшь. Достань архив «Родника». Всё, что связано с седьмым субъектом. С тем, что я есть. \nМедведь взял бумагу. Не спросил о деталях, о шансах. Просто кивнул. Он уже видел маршрут. Уже считал шаги. Уже знал, что пути назад нет – только вперёд, через периметр, через охрану, к сердцевине. \nПосле его ухода Охва снова вышла на причал. Ночь была беззвёздной. Вода тёкла мимо, тёмная и безучастная. Она смотрела на запад, в сторону Казани. Не с ненавистью. С холодным, терпеливым расчётом. Как хирург смотрит на разметку перед вскрытием, зная, что под кожей – не только болезнь, но и спящие нервы. Она наконец поняла, что её поиск – это не паломничество. Это рекогносцировка перед возможным столкновением. И следующий шаг начинался не с вопроса, а с движения по тропе, которая вела прямо к тем, кто, возможно, до сих пор считал её своим активом. Затерявшимся и требующим возврата."
OCH_first_phase.20.a:0 "Путь к себе иногда лежит через чужие архивы."

OCH_first_phase.21.t:0 "Лабораторный комплекс I"
OCH_first_phase.21.d:0 "Проникновение прошло не по плану, хоть он и был хорош. Эдемовцы охранял свои тайны лучше, чем запасы продовольствия. Первую группу охраны сняли бесшумно – Филин с ножом, Ястреб с тросом. Вторую – тоже. Но на третьем ярусе подземного комплекса, в коридоре с белыми, отслаивающимися стенами, их ждал не дозор, а технический пост. Два человека в камуфляже с бело-зелёными нашивками сидели за мониторами, отслеживая какие-то показания. Между ними и людьми Медведя лежал тридцатиметровый прямой коридор без укрытий.\nОн увидел это за секунду. Видел, как один охранник потянулся к тревожной кнопке. Дальше всё было просто: два приглушённых хлопка – Ястреб с ВСС работал на опережение. Тела осели на клавиатуры, по экранам поползли красные диагонали. Но тишина была уже мертва. Где-то в глубине комплекса проснулась сирена, приглушённая, словно из-под толщи бетона.\n- Время кончилось. На пролом! – бросил Медведь, и отряд рванул вперёд, не теряя строя.\nОни ворвались в центральный архив под аккомпанемент выстрелов. Перестрелка была короткой, жестокой и односторонней. Охрана явно была обучена, но не на соответствующем уровне. Разница оказалась фатальной. Гром подавил пулемёт гранатой, Ястреб и Костя очистили фланги. Через четыре минуты в помещении архива стояла лишь гулкая тишина, нарушаемая треском коротких замыканий и тяжёлым дыханием бойцов.\nИ только тогда они увидели его.\nЛабораторный комплекс не был руинами. Он был законсервированным кошмаром. За стеклянными стенами архивного блока виднелись другие помещения: операционные с ржавыми столами и креслами с ремнями, ряды прозрачных капсул-изоляторов, на стенах – схемы нейронных связей и каких-то спектров. Всё было чисто, почти стерильно, будто работу прервали вчера. Но в воздухе висел запах – сладковатый, химический, с примесью старой крови.\nМедведь приказал вскрыть сейф – самый крупный из всех. Филин работал автогеном, искры роем падали на плиточный пол. Когда дверь отвалилась, внутри оказались не просто папки. Это были аккуратно упакованные свидетельства систематического безумия.\nПока бойцы грузили ящики, Медведь взял первый попавшийся том. \n«Отчёт об экспериментальной серии „Корень-1“». \nОн пробежал глазами по сухому тексту, по графикам, по фотографиям... И мир вокруг него медленно начал заваливаться. Он видел войну. Видел распад. Видел, как люди едят людей. Но то, что он держал в руках, не было хаосом. Это был конвейер. Чёткий, расчётливый, с печатями и подписями.\n«Субъект 12-ВК. Достигнута стадия «белый шум». Пригоден для перевода в статус С».\n«Контрольная группа Г1 (бывшее село Тогаево). Побочные эффекты: прогрессирующая апатия, потеря долговременной памяти. Эффект признан удовлетворительным».\nИ дальше – дети. Отдельный раздел. \n«Ювенальные субъекты. Пси-способности, индуцированные контролируемой травмой. Перспективы применения в долгосрочных программах контроля». \nФотографии. Не исковерканные мутанты, а обычные дети с пустыми глазами, сидящие перед мониторами, к головам которых были подключены жгуты проводов.\nРука Медведя, державшая папку, задрожала. Не от страха. От волны чистой, кристальной ярости, которая поднялась из самого нутра, сметая всю усталость, весь цинизм, всю привычку к ужасу."
OCH_first_phase.21.a:0 ""

OCH_first_phase.22.t:0 "Лабораторный комплекс II"
OCH_first_phase.22.d:0 "- Господи, – вырвалось у него хриплым, сдавленным звуком. Он обернулся к своим. Ястреб стоял, прислонившись к стеллажу, его лицо было зелёным. Филин смотрел в пол, сжимая и разжимая кулак. Костя методично, с какой-то одержимой тщательностью, грузил ящики, будто пытался физически загрузить в них увиденное и увезти подальше. \n- Да это же просто стая больных ублюдков, а не учёные... \nЕё не преобразовывали... Насиловали. Ломали. Он швырнул папку в открытый ящик. Звук был громким, как выстрел. Всякое ему за последний десяток лет довелось видеть. Бандитов, каннибалов, фанатиков. Но это... Это не просто фанатизм. Это технология. Как нацисты... Вели журналы. Считали проценты. Оптимизировали конвейер по переработке людей в сырьё.\nОн выпрямился во весь рост, и в его осанке, в блеске глаз проснулось то, что давно спало под слоем грязи, крови и отчаяния. Долг. Не перед призраками некогда великой Родины. Перед живыми. Перед теми, чьи глаза смотрели на него с этих фотографий. Перед той, что ждала их у реки, сама ставшая и жертвой, и оружием этого конвейера.\n- Они не заслуживают жизни, – произнёс Медведь уже тише, но так, что каждое слово будто вбивалось гвоздем в тишину архива. - Ни как учёные. Ни как солдаты. Ни как люди. Они – ошибка. Гниющая ветвь. И её нужно отсечь. Не для мести. Чтобы это больше не повторилось. Ни с кем.\nОн взглянул на своих бойцов, встретив кивки, полные той же леденящей убеждённости.\n- Всё, что можем, забираем. Остальное – уничтожить. Чтобы ни одной записи. Ни одного образца. Они знают, что мы были. И они придут. За документами. И за Ней. Чтобы вернуть «актив» или стереть утечку. – Медведь с силой закрыл крышку. - У нас нет выбора. Вернее, он один: ударить первыми. И стереть это место с лица земли. Со всеми его лабораториями и чертежами.\nОтряд двинулся к выходу, неся тяжёлые ящики. Медведь шёл последним. На пороге он обернулся, бросив последний взгляд на стерильные коридоры, на блестящее оборудование и на схемы, висящие на стенах."
OCH_first_phase.22.a:0 "Ад – это не огонь и черти. Это белые стены, тихий гул аппаратуры и аккуратные почерки в журнале."

OCH_first_phase.23.t:0 "Ярость I"
OCH_first_phase.23.d:0 "Документы лежали перед ней на столе – не стопкой бумаг, а окаменевшей правдой. Охва не листала их. Она уже всё прочла. Каждую строчку. Каждый график. Каждый штамп «Совершенно секретно» с аккуратным зелёным древом. \nЕё собственное имя – Инга, и номер – 07-ВОЛ, встречались то тут, то там, как инвентарный номер оборудования. Тишина в помещении была иной. Не тишиной покоя, не тишиной ожидания. Это была тишина перед ударом. \nТишина, которая звенит в ушах, когда мир наконец складывается в чёткую, невыносимо ясную картину. Она сидела неподвижно, глядя перед собой, но её взгляд был обращён внутрь – в ту самую пустоту, которую она пыталась заполнить годами. И теперь она знала, чем она была заполнена. Не тайной. Инструкцией. Техническим заданием. Протоколом сборки. \nОна медленно подняла голову и посмотрела на Медведя, который стоял у двери, наблюдая. В её глазах не было ни растерянности, ни паники. Был холодный, безжалостный синтез. \n- Вот, значит, как? – её голос прозвучал тихо, почти задумчиво. - Я... Просто эксперимент кучки существ, что называют себя людьми? Удачный образец. Функционирующий прототип. \nОна провела пальцем по фотографии на одном из листов – изображению лаборатории, где в центре под жгутами проводов лежала женщина с её лицом.\n- Они не создавали божество. Они ремонтировали сломанный прибор, чтобы сделать из него излучатель. Для контроля. Для управления. Для... садовничества. \nВ её голосе появилась тонкая, как стекло, трещина – не боли, а глубочайшего, леденящего презрения. Не к себе. К ним. К тем, кто посчитал, что боль, страх и потеря – это всего лишь сырьё, которое можно переплавить в инструмент. Она встала. Движение было плавным, лишённым резкости, но в нём чувствовалась та же неумолимая сила, что и в течении реки. \n- Предсказуемо, пусть и печально, – произнесла она, и это было не сожаление. Это был приговор. Приговор всему проекту, всей их затее, всему их выродившемуся представлению о порядке. - Они хотели тишины. Беспрекословного послушания. Идеально функционирующей системы. Они получили её. \nОна подошла к окну. За ним текла Волга – её кровь, её нервная система, её тюрьма и её оружие. Теперь она смотрела на воду не с тоской, а с холодным пониманием. Это не её сущность. Это среда, которую они для неё выбрали. И теперь она обратит её против них. Она повернулась к Медведю. В её позе, во взгляде, в самой атмосфере вокруг неё что-то изменилось. Исчезла последняя тень сомнения. Осталась только воля. Железная. Неумолимая."
OCH_first_phase.23.a:0 ""

OCH_first_phase.24.t:0 "Ярость II"
OCH_first_phase.24.d:0 "- Спасибо тебе за добытую информацию, друг, – сказала она, и в этих словах не было ни тепла, ни дружелюбия. Была безмерная, абсолютная признательность солдата, получившего точные координаты цели. - Теперь я точно знаю, что делать. \nОна сделала паузу, давая тишине впитать её слова. \n- Они считали меня вещью. Активом. Теперь этот актив предъявит счёт. Они хотели контроля – они получат его. Полной мерой. Они хотели порядка – он придёт к ним. На волне. На штыках. В тишине, которую разорвёт только звук ломающихся стен. \nОна не повышала голос. Но каждое её слово будто вдалбливалось в самый фундамент реальности, меняя её. Воздух в комнате стал гуще, отдавая сыростью и холодом глубины. \n- Я не объявляю войну, – произнесла она. - Я констатирую факт. Война уже идёт. С того момента, как они включили приборы. С того момента, как я проснулась здесь, не помня себя. Они начали её. Теперь я заканчиваю. На своих условиях. \nОна подошла к столу и взяла один из документов – тот, где под зелёным древом была подпись руководителя проекта. \n- Они прятались за своими стенами, своими грифами, своей наукой. Думали, что река унесёт их грехи. Ошиблись. Река запомнила. \nВ её глазах вспыхнуло не пламя, а ледяное сияние – отражение глубины, в которой таилась вся накопленная за годы тоска, вся боль, вся ярость, наконец обретшая форму и цель."
OCH_first_phase.24.a:0 "Когда тишина, которую ты навязывал миру годами, внезапно оборачивается к тебе лицом – это приговор."

OCH_first_phase.25.t:0 "Допрос I"
OCH_first_phase.25.d:0 "Комната была белой. Белые стены, белый потолок, белый пол. Единственное пятно цвета – тёмная вода, стоящая неподвижным зеркалом в центре, окружённая низким бетонным бортиком. В этой воде, по грудь, стоял человек в порванном лабораторном халате. Его руки были прикованы к бортику цепями. \nЭто был не пыточный застенок. Это была исследовательская камера. Та самая, в которой когда-то проводили эксперименты серии «Корень». Охва сидела на простом металлическом стуле у стены. Не как королева на троне, но как наблюдатель. Она смотрела не на пленного – на воду вокруг него. Смотрела, как её поверхность остаётся абсолютно гладкой, не реагируя на его дрожь. \n- Ваше имя, – сказала она. \nГолос был тихим, ровным, без интонации. Не вопрос. Констатация необходимости заполнить поле в отчёте. Пленный, человек лет 50-60 с острым, осунувшимся лицом, попытался поднять голову. Его глаза метались, пытаясь найти в её лице хоть что-то знакомое – злорадство, ненависть, любопытство. Не нашёл. \n- Николай... Лебедев Николай Арсентьевич, – выдавил он. Голос сорванный, хриплый после дней молчания. - Старший научный сотрудник проекта... \n- «Родник», - закончила за него Охва. - Руководитель группы по работе с субъектами... Автор методики замещения базового гештальта, – она произнесла это так, будто читала с его же визитки. - Вы подписывали протокол инициации 07-ВОЛ. \nУчёный сглотнул. Капля пота скатилась с виска и упала в воду. От неё разошлись круги. Охва следила за ними, пока они не улеглись. \n- Я... Я выполнял приказ. Государственную программу... – начал он заученную речь, ту самую, что, вероятно, твердил себе все эти годы. \n- Нет, – она тихо перебила его. - Вы не выполняли приказ. Вы его писали. В отчёте от 13 января 2002 года вы предложили использовать эмоциональную травму как катализатор для снижения порога пси-сопротивления. Вы назвали это «оптимизацией процедуры». Для субъекта 07-ВОЛ вы рекомендовали активировать центры, связанные с материнским инстинктом и чувством вины. Чтобы усилить привязанность к «месту обитания» – реке. \nОна медленно подняла на него глаза. В её взгляде не было ненависти. Было холодное, безразличное изучение. Как энтомолог смотрит на редкий, ядовитый экземпляр."
OCH_first_phase.25.a:0 ""

OCH_first_phase.26.t:0 "Допрос II"
OCH_first_phase.26.d:0 "- Вы не солдат, не учёный. Скорее... Архитектор. Вы спроектировали конвейер. И вы расскажете, как он работает. С технической точки зрения. \nЛебедев замолчал. Он ждал криков, ударов, пыток. Вместо этого он получил запрос на техническую документацию. Это было страшнее... Но он начал говорить, не было выбора. Сначала сбивчиво, потом, по мере того как втягивался в привычную колею – всё чётче и увереннее. Он говорил о резонансных частотах, о программировании на уровне подсознания, о гидроакустическом распространении сигнала. Он объяснял, как они подбирали «носителей» – людей с неустойчивой психикой, как их ломали, как из осколков собирали послушные субъекты. Он говорил о побочных эффектах – апатии, потере памяти, соматических нарушениях. Говорил, что это «приемлемая цена». \nОхва слушала. Не перебивая. Когда он закончил, в комнате повисла тишина. Вода вокруг мужчины оставалась неподвижной. \n- Спасибо, – сказала Охва. - Теперь я полностью понимаю принцип действия. И степень вашего морального вырождения. \nОна встала и подошла к бортику. Наклонилась, будто рассматривая что-то в глубине. \n- Вы хотели создать идеальный инструмент контроля. Вы его создали. Но вы ошиблись в одном. Вы считали, что инструмент не имеет воли. Не имеет права на вопрос. Вы отключили у субъекта 07-ВОЛ всё, что могло помешать работе. Но вы не отключили потребность в смысле. Вы оставили её тосковать по тому, чего у неё нет. И эта тоска... Стала тем самым фундаментом, на котором она начала строить своё собственное понимание мира. Пока вы охраняли свои архивы, инструмент научился читать. Пока вы проводили эксперименты, инструмент научился чувствовать боль других. Ваше творение превзошло создателей – в моральном плане. В плане целеполагания. И теперь оно здесь, чтобы вынести вердикт. \nНиколай смотрел на неё, и в его глазах наконец вспыхнул настоящий, животный страх. Не страх перед смертью. Страх перед непониманием. Он всю жизнь имел дело с числами, схемами, подопытными. Перед ним стояло нечто, что он создал, но что он не мог категоризировать. \n- Что вы... Что вы собираетесь со мной делать? – прошептал он. \n- Ничего, – ответила она выпрямившись. - Вы будете стоять здесь. Смотреть на воду. Слушать её. Вы будете делать это до тех пор, пока не поймёте, что вы натворили. Не на уровне отчёта, нет... На уровне сопричастности. Пока ваша собственная, невыносимая тоска не станет зеркалом той, которую вы в меня вживили. \nОна повернулась к двери. \n- Вы хотели тишины и послушания. Поздравляю. Вы получили и то, и другое. В полной мере. \nДверь закрылась. В белой комнате остался только человек по грудь в чёрной, неподвижной воде. И нарастающая, абсолютная тишина, в которой уже начал звенеть собственный, давно подавленный, внутренний крик."
OCH_first_phase.26.a:0 "Самое страшное наказание для создателя – остаться наедине со своим творением."

OCH_first_phase.27.t:0 "Итоги I"
OCH_first_phase.27.d:0 "Останки Казани теперь были похожи на улей после того, как дым выкурил рой. Тишина осталась, но она была иной – не давящей, а занятой. \nРечники методично разбирали оборудование, выносили архивы, снимали со стен схемы, которые теперь были не инструкциями, а уликами. В воздухе пахло сыростью и... Спокойствием. Недостижимым за все предыдущие годы спокойствием. \nОхва стояла у огромного, от пола до потолка, окна, выходящего на Волгу. За стеклом лежала широкая, тёмная вода – уже не граница, не предел. Теперь это была артерия. \nШаги за спиной были тяжёлыми, узнаваемыми. Медведь. Он остановился в пяти шагах, не нарушая её пространства, и молчал, ожидая. Она не обернулась. \n- Они проиграли не потому, что у нас было больше солдат, – сказала она тихо, глядя на отражение комнаты в стекле. - Они проиграли потому, что их система была... Хрупкой. Построенной на страхе перед начальством, на карьерных расчётах, на вере в собственную избранность. Когда их стены рухнули, а солдаты перестали реагировать на команды, они растерялись. \nМедведь молча кивнул. Он видел это сам. Последние очаги сопротивления рассыпались, как труха, когда по громкой связи – через их же систему оповещения – раздался её голос. Не крик, не угроза. Монотонный, всепроникающий запрос: «Почему вы это делали?». И в ответ – тишина в их головах, которую они не могли заполнить. \n- Их контроль был внешним. Моя воля – внутренняя, – продолжила она. - Они подавляли. Я... Резонирую. Мои речники... - она наконец обернулась, её глаза встретились с его взглядом, - Они не пусты. Они просто больше не борются с самими собой. Их боль, их страх, их тоска – всё это теперь течёт в одном направлении. По руслу, которое я задаю... Гармонизация. И она сильнее. Поэтому я смогла перекрыть их сигнал.\nОна подошла к столу, где лежала схематичная карта – не бумажная, а спроецированная на поверхность мерцающим устройством, добытым в архивах. На ней светилась огромная территория, охватывающая всё среднее Поволжье. И далее – тонкие, расходящиеся линии потенциального распространения в центральной территории бывшей страны и Заволжья. \n- Я нашла в их архивах, что искала. Способ инициализации. Параметры резонансного поля. Они искусственно ограничили радиус, чтобы не потерять контроль над субъектом. Страх перед собственным творением, – в её голосе прозвучала та же холодная усмешка, что и раньше. - Я сняла эти ограничения. Теперь моя воля течёт по всему бассейну Волги в пределах досягаемости усилителей. Их же усилителей... Ирония. \nМедведь внимательно смотрел на карту. Он видел не только завоевание. Он видел ответственность. Колоссальную. \n- И что теперь? – спросил он. Просто, по-солдатски, хотя внутри него полыхала целая буря из мыслей."
OCH_first_phase.27.a:0 ""

OCH_first_phase.28.t:0 "Итоги II"
OCH_first_phase.28.d:0 "- Строить, – ответила она незамедлительно. - Не так, как они. Не лаборатории и не казармы... Поселения. Мастерские. Очистные сооружения. Систему, которая позволит людям жить, не превращаясь в бандитов или рабов, без моего прямого контроля. Тихий, упорядоченный мир. Единственный, какой я могу им дать. Единственный, в котором я сама могу существовать, не сходя с ума. Но есть и другие вопросы, – продолжила она, и её голос стал чуть тише, будто она говорила о чём-то слишком гипотетическом, чтобы быть правдой. - В их архивах... Есть упоминания о других проектах. «Болото». «Комета». «Лес». «Шпиль». Номера субъектов, но не 07-ВОЛ. Они могли быть созданы в других местах. Или... Проснуться самостоятельно. Если они есть, то кто они? Друзья? Конкуренты? Угроза? И если «Эдем» имел такие амбиции здесь, в Поволжье... То, что происходит в других частях бывшей России? В мире?\nОна снова посмотрела на карту. Теперь это был не план завоевания, а карта неизвестности. \n- Моя ближайшая цель – консолидация. Укрепить то, что мы взяли. Дать людям стабильность. Затем... Нужно будет смотреть по сторонам. Искать. Учиться. Возможно, защищаться от тех, кто увидит в нашей тишине угрозу. \nОна повернулась к нему полностью. \n- А ты? Ты выполнил свою задачу, и даже больше. «Эдем» пал, и теперь я знаю о себе намного больше... Что удерживает тебя здесь, у реки? Ты мог уйти. \nМедведь долго молчал, его взгляд блуждал по комнате, по стеллажам с архивами, по схеме на столе, по её лицу. Наконец он ответил, и в его голосе не было ни пафоса, ни сомнений. Только простая ясность – следствие того, что сказала ему эта женщина. \n- Раньше мой долг был перед Родиной. Она умерла. Потом мой долг был – выжить и сохранить своих людей. И это... Тоже не всегда получалось. Потом мой долг был в том, чтобы уничтожить нелюдей, которые делали это, – он кивнул в сторону лабораторного крыла. - Это сделано. Теперь... – он сделал паузу, подбирая слова. - Теперь я вижу порядок. Точно не идеальный. Однозначно несправедливый. Но работающий. И командира, который не приказывает из страха или ради власти. Который... Просто делает то, что должно быть сделано. Чтобы люди не ели друг друга. Чтобы дети не становились расходным материалом. Это та война, которую стоит вести, Охва. Это тот долг, который имеет смысл. И пока ты ведёшь эту войну, моё место – здесь. На передовой.\nЖенщина смотрела ему в глаза. В её обычно пустом взгляде на мгновение мелькнуло что-то, почти похожее на признательность. Не эмоциональную. Тактическую. Признательность солдата надёжному сослуживцу. И, возможно, нечто большее. \n- Хорошо, – сказала она. - Тогда наша следующая задача – не воевать. Строить. И наблюдать. Я прошу тебя... Готовь людей. Им предстоит стать не только строителями, но и солдатами... Нам нужна не империя. Нам нужен дом. Дом с очень высокими стенами и очень тихими дворами. Нужно быть готовыми к тому, что кто-то может постучаться в наши ворота. С миром... Или с войной. \nОна выключила проектор. Карта погасла. В комнате остался только тусклый свет ламп и отражение Волги в огромном окне."
OCH_first_phase.28.a:0 "Победа – это когда ты построил нечто такое, что уже не сможет быть уничтожено прежними методами."

OCH_first_phase.29.t:0 "Местные порядки"
OCH_first_phase.29.d:0 "Банда «Шершней» попала в западню у старого элеватора. Не в перестрелке – они даже не успели толком отстреляться. Их окружили. Молча, без криков, выходя из-за развалин, с крыш, из подземных лазов. \nРечники... Их было, наверное, человек тридцать. И в их молчаливом, идеальном полукруге было что-то такое, что у Грека, видавшего виды главаря, сжались кишки ледяным комом. Бандитов сбили с ног, прижали к промёрзшей земле. Не били, просто обездвижили. Потом начался процесс. \nК ним подходили по одному. Сначала забирали оружие: автоматы, пистолеты, ножи. Не бросали в кучу, а аккуратно передавали по цепочке, как на конвейере. Потом начали обшаривать карманы и рюкзаки. Всё, что имело ценность изымалось с бесстрастной, бухгалтерской тщательностью: патроны – пересчитывались и упаковывались в чистые тряпичные мешочки, консервы и сухари – складывались в отдельный ящик. Аптечки, бинты, медикаменты – аккуратно извлекались. Кремень, зажигалки, фонарики – всё. Даже грязные фотографии и медальон у одного из бандитов были взяты и отложены в сторону – не как память, а как возможный предмет для будущего обмена. \nГрек пытался вырываться, когда у него снимали тёплую куртку с меховым воротником. \n- Сволочи! Это же... Мёрзнуть вот так...\nНа него не стали кричать. К нему просто подошли двое, один сильно и точно ударил его в солнечное сплетение, лишив воздуха, а второй, тем временем, аккуратно стащил куртку, вытряхнул из карманов всё что было и сложил. \nПотом пришла очередь одежды. Их раздели догола на январском морозе. Тела, покрытые грязью, татуировками и шрамами, побелели от холода, покрылись мурашками. \nДвое бандитов, самых молодых, начали рыдать тихо и безнадёжно. Это был уже не страх смерти, а страх обнажения перед ледяным, безразличным миром. Они стали не врагами, не людьми – а голым мясом, дрожащим на ветру. И только тогда их повели к реке. \nОхва ждала у чёрной, не замерзающей полыньи. Она окинула взглядом голые, трясущиеся тела и кивнула, словно принимая груз. Не сказала ни слова. Её воля, холодная и тяжёлая, как придонный ил, накрыла бандитов волной. Они перестали дрожать. Их глаза остекленели, уставившись на воду. Теперь в их головах грохотал не их собственный страх, а чужой – древний, всепоглощающий ужас перед глубиной, который Охва выудила из их же душ и направила обратно, заточив в петлю. \nОни пошли сами. Шаг за шагом, по голому льду, оставляя на нём следы от босых ног. Их не толкали. Пионер, суеверный паренёк, шёл первым. На его лице была гримаса облегчения – избавления от этого ужаса внутри. Он первым опустился на колени у края и, словно в поклоне, медленно склонился в чёрную воду, затягивая её в лёгкие как долгожданный глоток покоя. \nГрек шёл последним. Он пытался бороться, но его ноги неумолимо несли его вперёд. В последний миг он встретился взглядом с Охвой. В её глазах он не увидел ни злорадства, ни ненависти. Лишь усталую концентрацию, будто она решала сложную техническую задачу. Это было страшнее всего... \nУже через несколько мгновений лёд поглотил и его. \nРечники стояли и смотрели, пока последний пузырь не исчез. Потом одна из них, совсем молодая девчонка с пустыми глазами, аккуратно собрала оставшуюся на льду одежду бандитов – рваную, грязную, но ещё способную согреть кого-то на смене. Ценность была извлечена полностью."
OCH_first_phase.29.a:0 "Сначала ты лишаешься всего, что делает тебя человеком в этом мире. Потом ты лишаешься самого мира."

OCH_first_phase.30.t:0 "Функциональные отражения"
OCH_first_phase.30.d:0 "Дети в этих землях не играют. Они тренируются. Их мир – это не набор сказок, а инструкция по выживанию, где главный закон – не создавать шум. \nГруппа детей от 7 до 12 лет собирается у старого сливного коллектора, где шум падающей, ледяной воды маскирует другие звуки – единственное место, где можно говорить громче шёпота. Их «игры» – разборка и чистка. Не игрушек, а полезного хлама: ржавых шестерёнок, обрывков проводов, пустых гильз. Они делают это с сосредоточенностью взрослых речников, сортируя детали на три кучки: «Для обмена», «Может сгодиться», «Металлолом». Это не игра в мастеровую – это имитация деятельности взрослых, одобренная и полезная. Их ценность для общины – в маленьких цепких пальцах, способных разобрать то, что не могут взрослые. \nСегодня Витька, пацан двенадцати лет, нашёл в груде мусора нечто особенное: пластиковую погремушку из прошлого мира, немного оплавленную, но внутри ещё что-то болталось. Для него это не игрушка, а неопознанный объект. Он не трясёт её – он прикладывает к уху, слушает звук, потом пытается аккуратно вскрыть ножом, чтобы изучить содержимое. \nЭто анализ, а не забава. Младшая девочка, Лена, наблюдает. Её глаза, обычно пустые, загораются нездоровым любопытством. Она тянет руку, чтобы потрогать. \n- Не шуми, – шипит Витька, но не потому, что боится наказания, а потому что шум – это сбой в работе. - Это... устройство. Неизвестное. Может быть опасно. Нужно понять принцип. \nЕго слова – калька с речи взрослых, оценивающих аномалии. Для них погремушка – не символ детства, а потенциальный артефакт или угроза. Внезапно Ленка, вопреки всем правилам, хватает погремушку и трясёт её. Гремучий, сухой звук разрывает монотонный шум воды. \nДети замирают в ужасе, но не перед старшими – перед нарушением внутреннего порядка. Звук был не просто громким. Он был бессмысленным. Он не предупреждал, не сообщал, не был полезен. Он был чистым шумом. \nНа звук приходит Марк, подросток лет пятнадцати, ответственный за младшую «смену» в этой «игре». Он не смотрит на них с гневом. Его лицо выражает досаду механика, обнаружившего песок в шестернях. \n- Источник? – тихо спрашивает он. \nВитька молча указывает на погремушку в руках Ленки. Та уже замерла, поняв масштаб своей ошибки. Наказание не ритуальное. Оно функционально и педагогично, как в армии, которой некогда славилась эта земля. Ленку отправляют на «исправительную тишину»: три часа сидеть одной у спокойного затона и считать волны, чтобы «осознать ценность тишины через её наблюдение». Это не медитация – это корректировка поведения. Витьку, как старшего, наказывают за утерю контроля: ему добавляют дополнительную норму по разборке сложного, закисшего механизма. \nСаму погремушку Марк не бросает в воду и не ломает. Он аккуратно разбирает её плоскогубцами, извлекает шарики, кладёт их в мешочек с металлоломом, а пластиковый корпус – в кучу «Может сгодиться». Даже ошибка должна быть утилизирована с пользой. \nВечером Ленка, отбыв наказание, возвращается в барак, но она не плачет. Она смотрит на свои руки. И делает то, чего раньше не делала: подносит ладони к ушам и очень тихо трёт их друг о друга, прислушиваясь к едва слышному шелесту. \nЭто не игра. Это эксперимент. Она ищет границу между допустимым звуком и наказуемым шумом. В её глазах – не смирение, а ранний, но уже холодный интеллект, учащийся жить по законам этого жестокого мира."
OCH_first_phase.30.a:0 "Их детство – это не этап жизни. Это ускоренный курс по выживанию в системе, где любопытство измеряется в децибелах."

OCH_first_phase.31.t:0 "Янтарная скверна"
OCH_first_phase.31.d:0 "Весенняя вода, мутная и холодная, принесла это к берегу. Нашёл это Гном, низенький речник, когда объезжал на лодке затопленную низину. Не ржавчина, нет. Словно сама река вспотела золотым, больным потом. Он не стал грести ближе. Замолчал, прислушался. Ни птиц, ни писка комаров. Только тихий, скрипучий звук, будто кто-то там, в камышах, медленно жуёт стекло. И запах... пустой. Сладковатой, мёртвой пустотой. \nОн дал сигнал веслом: два коротких, три долгих стука. \nТатьяна с людьми прибыла быстро, минут через десять. Стала на краю, вглядываясь. Её лицо, обычно каменное, дрогнуло. Не страхом. Глухим, знакомым отвращением, как при виде раны, из которой сочится не кровь, а что-то... Чужое. \n- Это с той стороны, – прошептала она, кивнув на юго-восток, откуда ветер гонит слухи о рыжих лесах. - Не трогать. Оно тянется. \nОна приказала принести не просто воду. Рассол, выпаренный до состояния густой слезы. \n- Если оно пьёт, пусть захлебнется, – сказала она без выражения. \nДвое в плащах и тряпках на лицах поплыли на плоскодонке. Поливали скверну с подветренной стороны. Она зашипела. Не как огонь – как мокрая кожа на раскалённом железе. Сжалась, потрескалась, и из трещин выползли чёрные, тягучие слёзы. Они падали в воду и тонули камнями. Воздух пропитался запахом йода и горелой патоки. Мёртвую, стекловидную массу сгребли деревянными лопатами. Даже обезвоженная, она смотрелась омерзительно – пучки тёмных нитей, до боли напоминавших волосы, застыли в янтаре, как воспоминания о чём-то живом. Выловив останки, их увезли погрузили в вёдра, их – на пустырь, залили едкой жижей из старых бочек и накрыли плитой. Не хоронили. Заточали. \n- Запомните, – голос Татьяны резал тишину, когда они возвращались. - Это не болезнь. Это... – она на секунду запнулась, силясь подобрать аналогию. - Кисть. Чужая, которая хочет перерисовать наш мир под свой холст. Пришла с водой – вернётся с ней же. Увидите золотой налёт на коряге или камне – даёте сигнал. Не дышите рядом. Не трогаете. Зовёте. \nТой ночью у некоторых, кто стоял на ближних постах, звенело в ушах. Не звон – тихий скрежет, будто кто-то на обратной стороне тишины пробует на зуб границу этого мира. Наутро всё стихло. Но знание осталось: тишина стала тоньше. А за ней теперь кто-то есть. И он только что постучался."
OCH_first_phase.31.a:0 "Самое страшное оружие – не то, что убивает, а то, что переделывает. Превращает твой дом в чужой эскиз."

OCH_first_phase.32.t:0 "Безветренное место I"
OCH_first_phase.32.d:0 "Апрель. Тополиный пух с пеплом. Они пришли с запада, где земля до сих пор говорит на языке выстрелов. Не толпа – семья. Отец, мать, дед и девочка лет восьми. Их звали, но здесь имена не имели значения. Их выдавали глаза: дикие, впалые, бегающие к каждому шороху, будто за плечом. \nИх нашли на опушке, у старого моста. Не спрятавшимися, а просто сидящими у дороги. Как будто кончились силы бежать. У отца на плече – рваная сумка, туго набитая. У деда в руках – старый охотничий карабин без патронов. Защищались последние дни голыми руками. \nК ним подошли двое речников. Не спеша. Один, с лицом, выветренным как доска, оглядел их. \n- Откуда? \n- От... Живодёров, – хрипло ответил отец, сжимая плечо, где ткань была темнее от запёкшейся крови. - Три дня шли. Ребёнку есть нечего. \nОн говорил, а его взгляд сканировал речников: нет ли оружия на изготовку, не смыкают ли кольцо. Хаос научил его видеть угрозу везде. Но здесь была только тишина. \n- Идём, – сказал речник, кивнув. Они шли молча. Дорога вела к реке. Девочка, Аня, шёпотом спросила мать: \n- Мам, они нас не съедят? \n- Тише, дочка. Не знаю. \nИх привели не в лагерь, не в барак. На причал, где пахло рыбой и сырым деревом. Там их ждала Мария. Не воин, не вождь. Женщина в простой одежде, с лицом бухгалтера, подсчитывающего неизбежные потери. \n- За вами гонятся? – спросила она без предисловий. \n- Нет. Отбились. Но они... Они везде! – мать говорила, не поднимая глаз. \n- Здесь их нет, – констатировала Мария. - Здесь никого нет, кроме нас и Владычицы. \nОна объяснила правила. Не как угрозу, а как технические условия договора. \n- Работа есть всегда. Рыба, починка, очистка воды. Еда – по норме, но регулярно. Крыша над головой будет. Охрана – река. \nОтец кивал, ожидая подвоха. \n- А что взамен? - спросил он наконец. \nМария посмотрела на него прямо."
OCH_first_phase.32.a:0 ""

OCH_first_phase.33.t:0 "Безветренное место II"
OCH_first_phase.33.d:0 "- Взамен – тишина. Шуметь нельзя. Не кричать, не спорить громко, не стрелять без приказа. Ваша воля останется при вас, но... Она должна научиться молчать. Как вода. Потому что громкие мысли, громкие чувства... Они мешают Ей слышать течение. А если Она не слышит – Она не видит угроз. И тогда безопасность кончается. \nДед, старый вояка, видевший ещё фашистов и держащийся неизвестно как, сощурился. \n- То есть, мы как... В монастырь, что ли? \n- Нет, – речница покачала головой. - Как в мастерскую. Вы – инструменты. Инструменты не кричат, когда ими работают. Но их и не ломают почём зря. Выбор есть. Можете уйти. На югах, говорят, есть поселения. Но там снова будут бандиты. Голод. И страх, что ночью вырежут... Или чего хуже. У нас страха нет. Здесь боятся только одного – нарушить тишину. \nСемья молчала. Отец смотрел на Аню, которая прижалась к матери и смотрела на воду широкими глазами. Он видел в них не детский ужас, а усталость. Усталость от страха. \n- А если... если ребёнок заплачет ночью? – тихо спросила мать. \n- Плачьте тише, – так же тихо ответила Мария. - Или научите её плакать без звука. Здесь все так живут. \nОни смотрели друг на друга. Не было пафоса, не было высоких слов о спасении. Была простая арифметика: воля + хаос = смерть. Покорность + тишина = жизнь. Они выбирали не рабство. Они выбирали функционирование. \n- Остаёмся, – сказал отец. Голос был пустым, как выброшенная раковина.\n- Хорошо, – кивнула женщина. - Сумку отдадите на сортировку. Оружие – в арсенал. Вас проведут к бараку, покажут норму. С завтрашнего дня – на рыбу. И помните главное: река всё слышит. И всё помнит. \nИх увели. По дороге Аня увидела других детей. Они не бегали. Они сидели у воды и что-то шептали камушкам. Она посмотрела на них, потом на свою мать, и – впервые за много дней – разжала кулачок. А вечером, когда в бараке зажгли тусклую лампу, дед сидел на нарах и смотрел в стену. Он не молился. \nОн просто глубже, чем обычно, втягивал воздух, прислушиваясь к новой, непривычной тишине. В ней не было покоя. Но в ней не было и воя ветра, несущего запах гари и крики. Это был компромисс. Единственный, который этот мир ещё позволял."
OCH_first_phase.33.a:0 "Свобода – роскошь, которую можно позволить себе, только если за твоей спиной нет бездны."

OCH_first_phase.34.t:0 "Обычный день"
OCH_first_phase.34.d:0 "Июнь на Волге не время цветения. Это время густой воды, зелёной от тины, и воздуха, тяжёлого, как мокрая шерсть. Рассвет здесь не встречают. Его наблюдают. С первым серым проблеском на востоке бараки замерли не в сне, а в том особом оцепенении, в котором речники проводят ночь. Без храпа, без движения. Затем, без звонка, без команды, все одновременно поднялись. Оделись в одинаково выцветшую одежду. \nВышли. У причала уже стояли в ряд лодки-плоскодонки. Речники занимали их без суеты, по одному. Вёсла опускались в воду без плеска. И тихо, мерными, синхронными гребками, флотилия растеклась по широкой дуге. Не для промысла. Для проверки. \nОни вычерчивали на воде идеальные квадраты, заглядывая в глубину, высматривая чужие тени, посторонние предметы. Это их работа: быть живыми датчиками для реки. На берегу, в тени полуразрушенного элеватора, другие уже вели «Утренний шёпот». Не молитву – сверку. \nСтарик с тетрадкой в картонной обложке отмечал: «Сектор 4: вода мутная, течение ровное. Шума нет». \nМолодая женщина докладывала о состоянии сетей: «Три ячеи порваны. Чинить после смены». \nВсё записывалось коротко, без лишних слов. Их слова не обращены друг к другу. Они обращены в реку, как рапорт в никуда, зная, что их услышат. \nК полудню началась основная работа. Одни чинили ловушки, их движения точные, выверенные до автоматизма. Другие обслуживали единственный в поселении, спрятанный в изолированном от окружающего мира помещении довоенный генератор – реликвию, которую берегут пуще пайка. Дети не играли. Они пололи грядки с жёсткой, горькой зеленью, которая росла в этой почве. Их лица были сосредоточены, маленькие пальцы выдёргивали сорняк за сорняком, не пропуская ни одного. \nВ воздухе стоял не гул труда, а ровное, низкое жужжание жизни, лишённой пиков, провалов и пауз. Как будто само поселение было большим, медленно дышащим существом. Когда солнце стало клониться к западному горизонту, все так же молча собрались у общей кухни – бывшей котельной. Получили пайку: миска похлёбки из водорослей, немного сушёной рыбы и треть пресной лепёшки. Ели не вместе, а рядом, глядя в одну точку перед собой. Жевали медленно, тщательно. Пища была топливом, а не удовольствием. \nПеред самым закатом они совершили вечерний обход. Не столько для охраны, сколько для контроля тишины. Обходили периметр, прислушиваясь. Не к шагам врага, а к щелчку не прикрученной жести, к скрипу двери на расшатанных петлях. Любой звук – дефект. Его находили и устраняли. С наступлением темноты они вернулись в бараки. Не зажигали огней, если не было нужды. Ложились на нары. И перед тем, как сомкнуть глаза, каждый несколько секунд прислушивался к ночи. \nНе к крикам тварей или выстрелам, как в других местах. К гулу тишины. К ровному, тёмному дыханию реки, в котором иногда, самым краем сознания, чудился ответ. Или просто эхо их собственной, отданной на хранение воли. \nДень кончился. Ничего не случилось. Это и было знаком, что день прошёл правильно."
OCH_first_phase.34.a:0 "Счастье измеряется не улыбками, а количеством дней, когда слышно лишь тишину."

OCH_first_phase.35.t:0 "Воспоминания"
OCH_first_phase.35.d:0 "Это случилось... Давно. До ясного понимания, с десяток лет назад. В тот период её существование было сплошным белым шумом тоски, прерываемым вспышками чужой боли. Она могла заставить сотни рук двигать вёслами в унисон, но не могла заставить один ум думать за пределами её вод. \nУгроза пришла не с реки. Она пришла из-под неё. В старом коллекторе, что уходил под берег, обосновалась банда «Кротов». Они не шумели. Они копали. Методично просачиваясь как грунтовые воды в её владения, воруя припасы и уводя речников с дальних постов. Её восприятие, растянутое по водной глади, было слепо в подземных бетонных трубах. Она чувствовала дыры в своей сети, но не видела, кто их прогрызает. \nЯрости не было. Был холодный, нарастающий дискомфорт системы, обнаружившей неисправность, которую нельзя устранить стандартными средствами. \nПосылать обычных речников было бессмысленно: в темноте тоннелей их ждала паника, а её контроль над ними слабел. Им не хватало... Агрессии. Не слепой ярости, а целенаправленной способности действовать в чуждой среде. В то время она сделала нечто, чего не делала осознанно. Она не стала усиливать подавление воли. Она изменила угол давления. Вместо того чтобы гасить страх у группы из двадцати речников, она нашла в этом страхе особый оттенок – гнев от беспомощности. \nУ старика, чью дочь утащили в туннель. У женщины, у которой украли последние лекарства для ребёнка. Она не стала этот гнев успокаивать. Она заострила его. Направила всю их ярость не наружу, а внутрь, спрессовав в ледяную решимость. Их страх стал не параличом, а топливом. Она дала им не приказ, а образ. Карту туннелей, выуженную из обрывочных воспоминаний пленного «Крота». И отпустила. \nЕё прямое влияние кончалось у входа в коллектор. Дальше они шли одни, ведомые только её волей, впечатанной в их психику как долг, и своим собственным, теперь полезным, гневом. То, что произошло в темноте, она видела лишь обрывками, как сквозь мутное стекло. Вспышки выстрелов – разрешённый шум. Крики, мгновенно обрывающиеся. Шуршание тел по гравию. Её «щупальца» работали молча, эффективно, не как толпа, а как единый организм, где один прикрывал другого, третий шёл вперёд, читая туннель как она – их. Через три часа они вышли. Не все. Пятеро остались в темноте. \nОстальные были покрыты чужой грязью и кровью, их глаза горели не эйфорией, а пустым, выполненным долгом. Они принесли не трофеи, а информацию. Точные цифры: девятнадцать убитых «Кротов». Координаты двух запасных выходов. И главное – тишина. Подземный гул стих. \nВ тот летний вечер Охва стояла над водой и смотрела на их строй. Она не чувствовала гордости – лишь облегчение системы, нашедшей недостающий компонент. Эти люди были другими. Они были остриём. Они могли действовать там, где её власть была лишь смутным шёпотом. Они нарушали тишину, но делали это правильно: с целью, по её воле. \nОна не назвала их гвардией тогда. Для неё они были инструментом для операций. Но зерно было посеяно. \nОна поняла принцип: чтобы защитить свой тихий, хрупкий мир, ей иногда нужны руки, способные действовать в самом сердце чуждого ей хаоса. И эти руки должны быть сделаны не из слепого послушания, а из прессованной воли тех, кому в её мире всё ещё есть что терять."
OCH_first_phase.35.a:0 "Тишина требует для своей защиты чего-то большего, чем просто солдат."

OCH_first_phase.36.t:0 "Хребет тишины"
OCH_first_phase.36.d:0 "Август. Вечер. Воздух над Волгой был густым от запаха нагретой за день воды и дыма костров. Со старого бетонного причала возвращение гвардии наблюдает человек с лицом, напоминающим потрескавшуюся глину.\nЕго зовут Игорь, хотя это имя почти забыто. Теперь он старший сапёр. Он не командует парадом. Он свидетельствует возвращение корабля в гавань. Дивизия не идёт строем. Она стекается с лесной тропы, как тени в сумерках. Без голоса, без переклички.\nСначала появляются егеря – их выдают лишь чуть более острые движения, взгляд, который сканирует берег даже сейчас, уже дома.\nЗа ними – основная масса, пехота. Их шаг не грохочет, он мягкий, глухой, будто они до сих пор помнят, как идти по вражеской земле.\nВ арьергарде – его люди, сапёры. Несут на импровизированных носилках что-то тяжёлое и завёрнутое в брезент. Неразорвавшийся снаряд или мину – не трофей, а образец для анализа. Его изучат позже, по протоколу.\nИгоря не удивляет их слаженность. Он помнит первые вылазки десять лет назад. Помнит хаотичный огонь, панику в глазах, которую даже Её воля не могла до конца задавить. Помнит, как Она, тогда ещё не понимавшая ничего, просто давила, заставляя людей лезть на пулемёты, потому что не знала другого способа.\nТеперь всё иначе. Он видел, как собирался этот механизм. Помнит, как его самого, тогда ещё просто механика, одержимого порядком в шестерёнках, стали забирать на «беседы». Это были не разговоры. Это была калибровка.\nОна находила в его сознании тот самый паттерн – потребность в чистоте, в устранении неисправностей – и направляла его на новое поле: мины, растяжки, неразорвавшиеся снаряды.\n«Аномалии, нарушающие целостность» – так звучало Её безмолвное объяснение. Так же Она находила других. Худую, вечно вздрагивающую женщину, которая слышала шаги за три дома. Теперь она – ухо егерей. Молодого парня, тихо зашивавшего в бараке чужую одежду. Теперь он зашивает раны с тем же бесстрастным упорством, как будто чинит прохудившийся бурдюк. Она не искала героев. Она искала функции. И находила их в странностях и тихих одержимостях речников, вытаскивала наружу и отшлифовывала своей волей.\nОбучение они проходили сами, но это были не военные учения. Это была формовка. Многочасовое, монотонное повторение одних и тех же действий под Её неусыпным внутренним взором. Разборка оружия в темноте. Дыхательные упражнения в ледяной воде. Панику выжигали не криком, а методичным, повторяющимся погружением в самый корень страха, пока он не становился просто данными, фоновым шумом\nИгорь видит, как его помощник, тоже бывший механик, подходит с докладом.\n– Приграничье полностью зачищено. Образцы доставлены.\nОн говорит не как солдат, а как лаборант, докладывающий о завершении эксперимента. Игорь кивает. Задача выполнена.\nЭто не армия. Это – скелет её воли. Костяк, на котором держится хрупкая тишина. И глядя на это, он чувствует не гордость и не страх. Он чувствует смутное, глубокое удовлетворение от того, что сложный механизм работает без сбоев. И вместе с ним – тихий, леденящий страх осознания, что он сам, со всеми его мыслями и памятью, является всего лишь одной из безупречно подогнанных деталей в этом чертеже чужой воли."
OCH_first_phase.36.a:0 "Совершенные инструменты не куют... Их медленно выращивают из тихих одержимостей, поливая волей, лишённой всяких сомнений."

OCH_first_phase.37.t:0 "Нарушенная тишина"
OCH_first_phase.37.d:0 "Его нашли в подвале разрушенного Дворца пионеров – старый катушечный магнитофон «Яуза-20Б». Почти целый, в кожаном футляре, с катушкой, на которой чудом сохранилась плёнка. Для речников это был не сувенир, а потенциальный носитель данных. Его доставили в зону сортировки. \nТихарь – бывший радист, получивший прозвище за умение слышать даже помехи в эфире – получил задание: определить ценность. Он действовал методично: очистил, проверил контакты, нашёл источник питания. Его интерес был сугубо практическим: не содержит ли плёнка координат или технических данных? Мысль о том, что это может быть «музыка», даже не пришла – такое понятие стёрто. Когда он нажал кнопку воспроизведения, произошло не ожидаемое шипение, а оглушительный, медный взрыв звука. \nФанфарный марш ушедшей, советской эпохи, полный литавр и труб, рванул из динамиков, заполнив тихий ангар. Эффект был мгновенным и катастрофическим: речники в радиусе нескольких десятков метров застыли в неестественных позах. У многих из носа и ушей потекла кровь. На лицах не было боли – лишь пустота, сменившаяся глубоким, животным ужасом. Река у берега стала шумнее. Воздух запах озоном и чем-то кислым, как от перегретой пластмассы. Это была не атака. Это была конвульсия. \nЗвук длился семь секунд. Потом магнитофон захлебнулся и замолк. Наступила тишина. Глухая, давящая, как после взрыва. Речники начинали приходить в себя, их трясло в беззвучных спазмах. \nЧерез полчаса явилась Мария – одна из тех немногих, кто лично говорила с Ней. Лицо было серым. Она смотрела на магнитофон с непереносимым отвращением. \n- Это не просто шум, – сказала она тихо. - Это форма. Чуждая. Она... рвёт сеть. Сбивает ритм. \nЕё приказ был точен: разобрать на молекулы. Динамики расплавили, ленту сожгли в металлическом ведре, корпус раскрошили, а останки утопили.\nПозже, у костра, она объяснила Шёпоту, чьи руки всё ещё дрожали: \n- Ты думал, что ищешь данные. Я понимаю. Но Её сознание... Оно выросло в тишине. Абсолютной. В белой, стерильной комнате без эха. Тот звук... Он был не просто громким. Он был... Архитектурой. Он строил в воздухе чужие, жёсткие стены. Её мир – вода, течение, шёпот. Тот мир – марш, приказ, строй. Они не могут жить вместе. Один должен уничтожить другой. Понимаешь? Это не запрет. Это война сред. А мы... Мы живём в Её среде. Шум той эпохи, той войны для Неё – как для нас вид открытой раны. Невыносимо. \nШёпот кивнул. Он понял не разумом, а нутром. Тишина – это не дисциплина. Это среда обитания, их среда. Как аквариум для рыб... А он грубо ткнул пальцем в стекло."
OCH_first_phase.37.a:0 "Некоторые раны не заживают. Они просто становятся стенками твоего мира. И любое эхо – это угроза обрушить этот мир."

OCH_first_phase.38.t:0 "Тихий отсчёт I"
OCH_first_phase.38.d:0 "Тридцать первое декабря. Дата в календаре, которую никто не отмечал. Календарей не было. Да и годам никто не придавал значения – выживали от сезона к сезону. Но что-то в воздухе осталось. Не память, а тонкая трещина в ткани обыденности, через которую пробивался призрак привычки. Привычки, которой не должно было быть. Никто не говорил о празднике. Не было приказа. Не было объявления. \nНо к вечеру, когда ранние зимние сумерки стали синими и густыми, речники стали собираться у большого костра на центральной площадке бывшего посёлка. Костра, который жгли не для тепла, а для света. Вопреки правилам. \nВопреки тишине. Охва наблюдала за ними из окна. Не вмешиваясь. Анализируя. Она видела, как они приносили скудные запасы – сушёную рыбу, тушёнку из консервов, хлеб, выпеченный из смеси жмыха и перемолотых кореньев. Выкладывали это на старый лист железа, как на общий стол. Видела, как дети, обычно безмолвные, украдкой лепили из грязи и снега мелкие фигурки - кривых животных, звёздочки. Бросали их в огонь и смотрели, как те тают. Это не было весельем. Это был ритуал очищения. Сожжение символов уходящего времени. \nКто-то принёс и поставил у костра каркас из ржавых труб, обвив его чем-то отдалённо напоминающим зелёные тряпки. Получилось нечто, смутно угадываемое как ёлка. На верхушку водрузили старый, поломанный шлем.\nНе было игрушек – на ветки-палки повесили гильзы, обрывки проводов, блестящие обёртки от рационов. Это не было украшением. Это был мемориал. Памятник вещам, из которых теперь состоял их мир. \nПотом они начали петь. Не песню. Напев. Один голос, низкий и хриплый, вывел первую ноту. К нему присоединился другой. Потом третий. Мелодии не было – был монотонный, медитативный гул, похожий на шум далёкой воды или ветра в развалинах. Они пели без слов. Просто звук. Звук, который был больше, чем тишина, но меньше, чем шум. Звук присутствия. Присутствия здесь и сейчас, вместе, у огня, в канун ничего и всего одновременно."
OCH_first_phase.38.a:0 ""

OCH_first_phase.39.t:0 "Тихий отсчёт II"
OCH_first_phase.39.d:0 "Медведь стоял в стороне, прислонившись к стене. Он смотрел на лица, освещённые пламенем. На них не было улыбок. Но было отсутствие страха. Отсутствие того вечного, подспудного напряжения, которое он слишком часто видел в других землях. Они были спокойны. Уставшие, измождённые, но – спокойные. Он поймал взгляд одного из своих бойцов - Ястреба. Тот кивнул ему, почти незаметно. И в этом кивке было больше понимания, чем в любой праздничной речи. Охва почувствовала это через воду. Не через контроль. Через вибрацию. Лёгкое изменение в ритме, в фоне. Это не мешало её порядку. Это... Дополняло его. Как новый, тихий обертон в давно знакомом звучании. Она видела, как глубокой ночью, когда огонь уже догорал, к костру подошла маленькая девочка – та, что раньше боялась даже кашлянуть... Она достала из-под обносков что-то маленькое и блестящее - вероятно, найденную стекляшку. Посмотрела на неё, потом бросила в угли. Шёпотом, так тихо, что даже стоявшие рядом не услышали, сказала: \n- За новый. \nИ отошла назад, в тень. Нового года не наступило. Наступило то же утро первого января. Такой же серый, холодный день. Но когда люди расходились, в их движениях была не привычная автоматичность. Была лёгкость. Не радостная. Смиренная. Как у человека, который пережил долгую болезнь и впервые сделал шаг без боли. \nОхва осталась у окна. Она смотрела на пепелище, на покорёженный каркас «ёлки», на следы на снегу. \n“Они ищут точки отсчёта... В мире, где все точки стёрты. Они создали свою. Из мусора и памяти. И в этом есть... Логика. Система нуждается в метках. Даже если эти метки – лишь тени от забытых праздников.” \nОна не чувствовала надежды. Она констатировала адаптацию. Но в этой адаптации, в этом тихом, немом коллективном жесте было нечто, что сильнее любого отчёта бывшего «Эдема». Была воля к форме. Даже если форма эта была призрачной. Даже если отсчёт вёлся от неизвестно чего. Это не было возрождением. Это было напоминанием: даже в самой глубокой тишине может родиться свой, едва слышный ритм. И этот ритм, возможно, и есть начало чего-то нового. Не рая. Просто – продолжения."
OCH_first_phase.39.a:0 "Когда нечего праздновать – празднуют сам факт, что дожили до даты. А когда даты нет – её выдумывают из пепла, тишины и общей, непроизнесённой тоски по тому, чтобы время снова имело смысл."

OCH_first_phase.40.t:0 "Обрыв"
OCH_first_phase.40.d:0 "Тишина начала рваться. Не сразу, не громко – тонкими, почти неосязаемыми разрывами, как трещины в старом стекле. Сначала это были единичные сбои: речник на дальнем посту вдруг забыл алгоритм проверки сетей, просто застыв и уставившись в воду. Женщина в прачечной уронила бельё и не подняла его, глядя на свои мокрые руки с тупым недоумением. Двое подростков на расчистке завала не синхронизировали движения, и бревно упало с грохотом, от которого вздрогнули все в радиусе ста метров. \nОхва ощущала это не как боль – как помеху. Постоянный, нарастающий фоновый шум в канале, который всегда был прозрачным. Её сознание, разлитое по водным путям, встретило сопротивление. Не стену – вязкость. Как если бы вода внезапно стала густой, тяжёлой, наполненной взвесью чужих мыслей, страхов, хаотичных импульсов. \nОна пыталась компенсировать. Усилить. Направить больше воли в ослабевшие узлы. Но чем сильнее она давила, тем хрупче становилась связь. Её контроль был подобен паутине, натянутой над рекой: идеальный, пока каждая нить натянута и чиста. Но достаточно нескольких порванных нитей – и вся сеть начинает провисать, путаться, терять форму. Шум был главным врагом. Не выстрелы и не крики – хотя и они тоже ранили её восприятие.\nШум в головах. Паника от прорывов противника на флангах. Боль от потерь. Усталость от мобилизации. Этот психологический хаос создавал помехи. Её речники, чьи умы были откалиброваны на приём одного чистого сигнала, начали получать искажённые, противоречивые команды. \nОдновременно «работать» и «спасаться». «Держать строй» и «отступать». Их внутренняя, искусственно поддерживаемая гармония дала сбой. \nОхва чувствовала, как от неё откалываются целые участки сознания – погружаясь в немоту, в хаос, в неподконтрольную тьму. Её взгляд был обращён внутрь. Она видела не карту, а схему распада. Яркие точки контроля тускнели одна за другой. Нити рвались. Единый ритм, который она годами навязывала этому месту, распадался на десятки хаотичных, панических тактов. Она могла приказывать телу двигаться, но тело уже плохо слушалось. \nОтдалённые группы речников замирали в нерешительности или начинали действовать по устаревшим, примитивным шаблонам – прятаться, бежать, драться в одиночку. Её совершенная система управления, построенная на тонкой настройке и гармонии, оказалась уязвима к грубому, массированному хаосу. Она не могла подавить шум – она была создана для работы в тишине. А тишина кончилась. Последним симптомом стало её собственное восприятие. Вода, всегда бывшая кристальным проводником, теперь приносила ей не отчёты, а эхо. Эхо страха её людей. Эхо чужих победных криков. Эхо нарастающего гула, в котором тонул её голос. Поражение было не вопросом силы. Оно было вопросом целостности. И целостность дала трещину."
OCH_first_phase.40.a:0 "Инструмент ломается не от удара, а от резонанса."


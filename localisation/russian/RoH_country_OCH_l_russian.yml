##############################
### POLITICS ####################
##############################

OCH_Okhva:0 "Охва"
OCH_Okhva_desc:0 "Память о старом мире порой может отрезвлять или, наоборот, опьянять и вводить в заблуждение. Порой память – это эхо, которого, впрочем, Охва почти лишена. Воспоминания о прежней жизни обрывочны и скрыты в тумане: помещения, похожие на больницу, люди в халатах и масках, яркий свет, тянущая боль, тепло... И больше ничего. Лишь суровая реальность и безмерные просторы Волги. Вода – основа жизни, её начало. Она необходима всем и каждому – как людям, так и животным. Здесь Охва и обнаружила свою поразительную способность: она могла контролировать волю всех живых существ, обращавшихся за помощью к Русской Реке. Так, капля за каплей, год за годом, под её контролем оказались обширнейшие территории, окружающие город, который был ранее известен под многими именами: Нижний Новгород, Горький, а ныне – город Заблудших душ. Но всему в этом мире есть предел, и могущество Охвы – не исключение. В один миг оказалось, что её способности по какой‑то причине не могут выйти за пределы определённых территорий. Словно кто‑то искусственно ограничил ту область, что ей подвластна..."

OCH_Bear:0 "Медведь"
OCH_Bear_desc:0 "Я почти забыл каково это... Но для меня дело офицерской чести помочь Охве в текущих обстоятельствах – и поскольку это дело чести, а не денег, я приложу все усилия."

Samodiva:0 "Волжская Самодива"

och_free_people_party:0 "Послушники Охвы"

##############################
### FOCUS ####################
##############################

OCH_I_bechold:0 "Созерцаю"
OCH_I_bechold_desc:0 "В головах людей ничего нет. Ответ явно лежит извне. Они должны наблюдать за рекой. Любая странность может стать ответом."

OCH_I_listen:0 "Внемлю"
OCH_I_listen_desc:0 "Слухи, легенды, домыслы... Если я хочу узнать кто я, то мне нельзя принеберегать ничем. Любая история о «жёлтых людях», «поющих проводах» или странных существах может быть ключом."

OCH_Echo_of_the_era:0 "Эхо эпохи"
OCH_Echo_of_the_era_desc:0 "Охве нужны ответы? Ха, кто б их дал мне самому... Впрочем, мне и самому интересно узнать, откуда она. Впрочем, есть плата, есть задача - а значит, будет и результат."

OCH_I_think:0 "Размышляю"
OCH_I_think_desc:0 "Есть те, кто находятся под мои контролем уже очень давно. Солдаты, крестьяне... Уже больше 15 лет. Но их воля не угасает. Возможно, стоит прислушаться к тому, что удерживает их угнетённый разум и попытаться понять."

OCH_Language_of_ruins:0 "Язык руин"
OCH_Language_of_ruins_desc:0 "Что ж, все хлебные крошки ведут запад, к границе с эдемцами и конфедератами. Надо бы запастись провизией и получить разрешение на разведку, да и пару-другую охранников она вряд ли откажет выделить..."

OCH_I_speak:0 "Говорю"
OCH_I_speak_desc:0 "Я должна попытаться перебороть себя. Нужно вернуть свободу воли части "речников"... Если я буду полагаться лишь на контроль, рано или поздно найдётся тот, кто его сможет избежать, и это будет намного хуже."

OCH_I_seek:0 "Ищу"
OCH_I_seek_desc:0 "Что же, ответ на один из вопросов получен. Человек, зная что его в чём-то ограничивают, будет стремиться к свободе - даже если она принесёт лишь боль. Я должна определиться с тем, как я буду обходится с теми, кто ценит свободу воли."

OCH_Ashes_of_ancestors:0 "Прах предков"
OCH_Ashes_of_ancestors_desc:0 "Как же тяжело было дойти... Интересно, если я принесу ей эти документы, она меня тоже порежет как его, или просто хмыкнет как обычно и махнёт рукой, дозволяя уйти? Впрочем, если бы я попал в такую ситуацию... Не знаю. Надеюсь лишь что никогда не попаду. Стоила ли эта папка усилий?.."

OCH_I_ask:0 "Спрашиваю"
OCH_I_ask_desc:0 "По крайней мере, теперь мне хотя бы понятно кем я была до... Всего этого. Уже что-то. Забавно... Я читаю, и воспоминания, о которых я не подозревала, начинают всплывать в сознании как плохо утопленное тело. "

OCH_I_wisper:0 "Шепчу"
OCH_I_wisper_desc:0 "И тем не менее, я всё ещё не знаю, кто я сейчас. Почему я очутилась в прдместьях Чебоксар? В чём природа моих способностей, почему они ограничены, есть ли такие же как я? Следы ведут к Казани, и я получу то, чего желаю."

OCH_I_demand:0 "Требую"
OCH_I_demand_desc:0 "Вот значит как? Я - эксперимент кучки существ, что называют себя людьми?.. Что же, Предсказуемо, пусть и печально. Спасибо тебе за добытую информацию, друг. Теперь я точно знаю что делать."

OCH_Memory_of_Earth:0 "Память земли"
OCH_Memory_of_Earth_desc:0 "Господи, да это же просто стая больных ублюдков, а не учёные! Преоброзование природы, как же... Эти ублюдки просто не заслуживают жизни. Всякое я повидал за последний десяток лет, но это... Это даже хуже, чем то что делали нацисты. "

OCH_I_declare:0 "Заявляю"
OCH_I_declare_desc:0 "Если в людях не осталось ничего от человека кроме внешности, то они не должны существовать. "Эдем" перестанет существовать - и я приложу к этому все усилия."


##############################
### IDEAS ####################
##############################

OCH_not_of_this_world:0 "Не от мира сего"
OCH_not_of_this_world_desc:0 "Непонимание того, откуда я всё же появилась, заставляет искать ответ вне собственного разума. И, к сожалению, ни в мыслях, ни в воспоминаниях речников не нашлось ничего, что могло бы мне помочь..."

OCH_Awareness_1:0 "Степень осознанности – §Rнизкая§!"
OCH_Awareness_1_desc:0 "Я не должна лгать себе – я слабо понимаю, что делаю, и совершенно не осознаю, как именно... Мои воспоминания подобны окружающим землям - столь же блёклые и безжизненные, лишь изредка озаряемые яркими проблесками. Надеюсь, я найду ответы прежде, чем случится нечто... Непоправимое."

OCH_Awareness_2:0 "Степень осознанности – §YСредняя§!"
OCH_Awareness_2_desc:0 "Что ж, по крайней мере, я знаю кем я была. Пусть я всё ещё не понимаю, кто или что я сейчас – но по крайней мере, я не просто аномалия «нового» мира и я представляю куда двигаться. Я получу ответы на свои вопросы."

OCH_The_Fury_of_Volga:0 "Ярость Владычицы Волги"

OCH_modify_nofw_intro: "§YНе от мира сего§! изменится на"



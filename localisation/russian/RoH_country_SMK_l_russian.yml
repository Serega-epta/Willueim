l_russian:
smolensk.1.t: "Конец вечной войны"
smolensk.1.d: "Ржев – место, где почти сто лет назад погибли десятки, сотни тысяч наших дедов и прадедов. Последние года он тоже обагрялся кровью. НАРФРОНТ вёл кровопролитное сражение со Смоленском, и никто из них не мог одержать верх. И вот, наконец, над городом воинской славы повисла сладостная тишина."
smolensk.1.a: "Пушки наконец замолчали..."
smolensk.1.b: "Пушки наконец замолчали..."
##############################
### POLITICS #################
##############################

COA_Father_Aoan:0 "Отец Аоан"
COA_Father_Aoan_desc: "«О заблудшие души, пребывающие в отчаянии! Отриньте свою злобу, забудьте свою усталость! Восславьте своего нового отца, ибо вы, блуждающие в бреду, всего лишь буйные дети этого Мира! Восславьте отца Аоана!» - Такие проповеди звучат во всех до единой мозырских топях, в глубине которых над единым сознанием возвышается создатель секты Блаженства – отец Аоан. Никто не помнит того момента, когда, создав свою новую религиозную мысль, старый пророк прибыл на территорию бывших белорусских болот, где готовил главных своих сыновей – Маврона, Тарувана и Порфирия. Вместе они собрали целую паству, которая, когда пришло время, обратила свое оружие против Божьего Надела Галиции и Волыни, сокрушив его силы и обратив в Блаженство миллионы людей, создавая новое, единое создание, освобождающее его членов от материальных слабостей, боли и страха.  Теперь же, культ Аоана, ведомый сильнейшей единой Волей, разносят свою веру и свободу по всем уголкам Родины, до которых могут дотянуться. И пусть только время и Воля Мира властна над сектой, паства Аоана будет использовать все свои способности, дабы противостоять всем враждебным еретикам, распространяя Блаженство по выжженым землям."

##############################
### IDEAS ####################
##############################

COA_Little_Bliss:0 "Малая Блаженность"
COA_Little_Bliss_desc:0 "Здесь утверждается Воля, здесь находят своё блаженство многие отчаявшиеся, повинуясь Миру, и отсюда Мир и Воля его утверждаются на земли ещё не постигших Блаженность."
COA_Crimson_Prayer:0 "Багровый Молебен"
COA_Crimson_Prayer_desc:0 "И воздал Мир нам за наши труды и проросли сквозь трупы врагов наших багряные цветы и диктовала Воля нам основать здесь наш Багровый Молебен..."


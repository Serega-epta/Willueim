SDC_phase_one.1:0 "Несмотря ни на что"
SDC_phase_one.1.t:0 "Несмотря ни на что"
SDC_phase_one.1.d:0 "На Онегу надвигался шторм. \nЭто была грандиозная чёрная туча, осыпавшая землю льдом и обжигающе холодной водой примерно в равных пропорциях. Привычная картина для тех, кто жил на побережье Белого моря. \nВладимир Путин поёжился и плотнее закутался в свою истрёпанную шинель. \nЛюдмила была совсем плоха. Вчера он зашёл к ней в очень неудачное время, как раз во время приступа. Перекатываясь на смятой постели из стороны в сторону, крича от боли, она даже не узнала его. \nОн пробыл с ней всего минут пять от силы. Пробыл, и вышел из палаты вон, не в силах смотреть на то, как его любимого человека съедает заживо рак. \n– Мы все на неё похожи... – неожиданно для себя самого произнёс Владимир. \nИ это было абсолютной правдой. Все они, весь Фронт, были точно такими же пациентами ракового корпуса. Съедаемые изнутри чумой виллуимов, где-то на краю вселенной, в ледяной пустыне, они бросались из стороны в сторону, из угла в угол, надеясь выкроится для самих себя хотя бы ещё один день. Здесь – удалось увернуться от когтей Тварей, что ночью вышли из Кордона. Там – урвать кусок хлеба, столь дефицитного в промёрзлом Поморье. Не жизнь, а выживание. Выживание загнанного в угол зверя, который давным-давно смирился со своей судьбой. \nИ это смирение больше всего злило Путина. \nЗамереть на краю бездны, чтобы потом смиренно упасть туда? Такова их судьба? \nДаже хрупкая женщина, далёкая от всей этой политики и войны находила себе силы бороться, а они, здоровые и крепкие мужики, решили вот так просто сдаться. \nКостяшки Путина побледнели от гнева. \nНе так. Не как тупое животное, которое ведут на скотобойню. Пусть в бою, пусть от ран или холода. Но не так. \nФронт будет драться, будет бороться. И если им всем суждено погибнуть, то пусть будет так. Но погибнуть, дерясь насмерть. \nВставая со своего кресла, Путин ощутил невиданную доселе уверенность. \n– Бороться и искать... – тихо прошептал он."
SDC_phase_one.1.a:0 "Несмотря ни на что."

SDC_phase_one.2:0 "Концепция общественной безопасности"
SDC_phase_one.2.t:0 "Концепция общественной безопасности"
SDC_phase_one.2.d:0 "Положение первое: Русский народ – величайший народ, чья непреклонная воля и невероятное упорство позволило пережить ему даже конец света. \nПоложение второе: Кровь русского народа – величайшая ценность в этом мире. Её безрассудное расточительство есть величайший грех и преступление, которым нет оправдания. \nПоложение третье: Обеспечить безопасность русскому народу в нынешних условиях может только сильное государство, опирающееся на Порядок и Дисциплину. \nПоложение четвёртое: Ради обеспечения безопасности русского народа мы должны отказаться от всякой жалости к тем, кто ставит свои мелочные интересы выше Порядка и Дисциплины. Уничтожение подобных национал-предателей есть благо, и наивысшая цель каждого русского человека..."
SDC_phase_one.2.a:0 "Подпись: В.В. Путин"

SDC_phase_one.3:0 "Искоренить виллуимов"
SDC_phase_one.3.t:0 "Искоренить виллуимов"
SDC_phase_one.3.d:0 "Первое слово – вот это. \nЭто Зов. \nОн пробивается, прорывается сквозь пелену неверия и сомнений. Он обволакивает разум и расслабляет плоть. Она, уже изменённая, лёгко поддаётся невидимому гласу, изгибается и изламывается против самой себя. \nГолос уже не шепчет, он мягким и отчётливым баритоном звучит прямиком в мозгу. Он похож на отца, давно погибшего и разложившегося в старой могиле. Он большой и добрый, он защитит, предупредит и скажет правду. Только один он, никто больше. \nЭто Зов. \nЗов проникает глубже, к сердцу и изменённым членам. Это – не мутация, как твердят глупцы. Это – нечто большее. Это благо. Благословенный янтарь течёт по венам, проникает в каждую жилу. И вот он, момент наивысшего блаженства. Он похож на эйфорию, нет, он выше эйфории, он выше оргазма, он выше всего. \nВ этом холодном и промозглом мире, что может быть лучше, чем понимать, что ты не один. Что ты – часть чего-то большего? Нерушимого и неостановимого. \nЭто Зов. \nЛишь одно беспокоит. Что-то гремит в окружающем мире, нелепом и глупом мире. Что-то гремит, лязгает и топочет. Что-то готовится с минуты на минуты выбить хлипкую дверь тайного логова тяжёлым ботинком. Лишь для того, чтобы варварски заорать прямо в ухо:"
SDC_phase_one.3.a:0 "– Пленных не брать!"

SDC_phase_one.4:0 "Нефтяная игла"
SDC_phase_one.4.t:0 "Нефтяная игла"
SDC_phase_one.4.d:0 "– Приплыли? \n– Щас должны... \nСтепаныч глухо сплюнул прямиком в море. \nПодлодку они ждали уже два дня. Обычно “фронтовики”, как звали их солдаты Карело-Финского округа, не опаздывали на встречу, но в этот раз их что-то задержало. То ли какой-то бедолага-кит выжил в отравленных водах и решил закусить атомной подлодкой, то ли на их засекли недобитки из ИОПК. А может, просто заглох двигатель. Такое тоже может быть. В конце концов, любая техника не вечна. \nВ том, что “фронтовики” соблюдали договорённость, Степаныч не сомневался. В конце-концов, это было в их интересах. \nНа самом деле, Степаныч и рад был бы плюнуть на всё, загрузить ящики с консервами обратно на броневик и умчаться в расположение части. Но приказ командира был однозначен: ждать до последнего. Горюче-смазочные слишком важный ресурс, чтобы из-за лени рисковать им. \nИ поэтому Степаныч ждал. Несмотря на то, что продрог как собака. \nНе успев додумать эту мысль, Степаныч услышал треск. А через секунду, разламывая льды Северного Ледовитого, на поверхности воды показалась узкая башня подводной лодки. \n– А вот и фронтовики, бля, легки на помине, – произнёс Степаныч, вновь сплёвывая в воду. – Эй, салага, заводи катер. Пойдём, произведём натуральный обмен..."
SDC_phase_one.4.a:0 "Капитализм, счастье?.."

SDC_phase_one.5:0 "Стабилизация Фронта"
SDC_phase_one.5.t:0 "Стабилизация Фронта"
SDC_phase_one.5.d:0 "– Что думаешь? – спросил Путин. \n– Думаю, что начало положено, – отозвался Дугин. \nВладимир хмыкнул, соглашаясь с товарищем. Начало действительно было положено. \nНесмотря ни на что, Фронт выстоял. И не просто выстоял, но даже и стабилизировал своё положение. Южные селения давали хоть и скудный, но всё же паёк, а население Архангельска, вдоволь хлебнувшее “свободной жизни”, практически не оказывало сопротивления. Даже виллуимы казались разгромлены если не окончательно, то точно надолго. \nС другой же стороны... \n– У меня один вопрос, – вновь подал голос Александр Дугин, ближайший друг и советник Владимира, – что дальше? \n– Ну, если посмотреть... \n– Нет, я имею ввиду: Зеруил или КС-3? \nПутин тяжело вздохнул, чувствуя, как в бронхах скапливается ком сухого кашля. \n– Ты же знаешь, я мало знаю об “Откровении”... \n– А много и не требуется, – парировал Дугин. – Зеруил – безусловная опасность не только для нас, но и для всей Родины. Остановить его наш долг, ты сам это написал в своей Концепции... \nПутин хмыкнул. “В своей”. Как будто Александр не был вкурсе, что писали они её вдвоём, тяжёлой и бессонной ночью. \n– ...С другой стороны, – продолжил Дугин, – противостоять ему без ресурсов остальной России сложно. Почти невозможно. Но ты действительно думаешь, что остальные царьки примут КОБ? Что прислушаются к нам? Осознают ту опасность, что нависла над Родиной? \n– Я надеюсь. \n– В этом вся твоя проблема, Володя. Ты слишком большой романтик. Хорошо. \nДугин обернулся и заглянул в глаза Путину. \n– Я расскажу тебе всё, что знаю о КС-3..."
SDC_phase_one.5.a:0 "Мы ещё всерьёз ничего не начинали."

SDC_phase_one.6:0 "Эндшпиль"
SDC_phase_one.6.t:0 "Эндшпиль"
SDC_phase_one.6.d:0 "Партия подошла к концу. Мат поставлен, фигуры убраны в коробку, а над полями сражений кружат безобразные, мутировавшие вороны. Кажется, что мы победили, что влиянию виллуимов положен конец. \nНо что-то подсказывает, что это лишь начало..."
SDC_phase_one.6.a:0 "Враг затаился"

SDC_phase_one.7:0 "День зарплаты"
SDC_phase_one.7.t:0 "День зарплаты"
SDC_phase_one.7.d:0 "Этот день настал. Добровольцы больше не могут терпеть вечный перенос сроков вправо. Они требуют свои деньги. Как нам следует поступить?"
SDC_phase_one.7.a:0 "Выплатить все долги"
SDC_phase_one.7.b:0 "Борьба с виллуимами – долг каждого человека..."

SDC_decisions.1:0 "Напряжение сил"
SDC_decisions.1.t:0 "Напряжение сил"
SDC_decisions.1.d:0 "Добровольцы получили свои деньги. Выплаты оказались щедрыми, и они готовы продолжать нести службу вплоть до окончания войны с Авангардом. \nТем не менее, наши дела оставляют желать лучшего. Слишком большие средства ушли на оплату добровольцев."
SDC_decisions.1.a:0 "Дыра в бюджете"

SDC_decisions.2:0 "Своевременная уплата"
SDC_decisions.2.t:0 "Своевременная уплата"
SDC_decisions.2.d:0 "Добровольцы получили свои деньги. Выплаты оказались щедрыми, и они готовы продолжать нести службу вплоть до окончания войны с Авангардом. \nТем не менее, наши экономические мощности напряжены, что нужно учитывать при планировании дальнейших операций."
SDC_decisions.2.a:0 "Дыра в бюджете"

SDC_decisions.3:0 "Обман"
SDC_decisions.3.t:0 "Обман"
SDC_decisions.3.d:0 "Добровольцы недовольны нашим решением. Они массово дезертируют и устраивают саботаж в тылах. Несмотря на недовольство, основной костяк из сил всё ещё остался в строю, однако последствия этого решения мы будем пожинать ещё долго..."
SDC_decisions.3.a:0 "Проклятые предатели!"

SDC_decisions.4:0 "Добровольцы соглашаются"
SDC_decisions.4.t:0 "Добровольцы соглашаются"
SDC_decisions.4.d:0 "Наши друзья согласились на отсрочку. Нам дадут дополнительное время, чтобы собрать средства, однако взамен выплата будет больше."
SDC_decisions.4.a:0 "Что же, если так надо..."

SDC_phase_two.1:0 "Установка"
SDC_phase_two.1.t:0 "Установка"
SDC_phase_two.1.d:0 "– Значит так, – произнёс Дугин, вываливая на стол кипу документов. – КС-3 была основной частью проекта “Откровение”... \n– Проекта?.. – переспросил Путин, не совсем понимая, о чём его приятель ведёт речь. \n– Ты и не должен был знать, – коротко отмахнулся от него Александр. – Уровня допуска к гостайне маловато будет. Но если коротко, то проект стартовал после Бурана-Энергии, помнишь такой? Мы тогда обнаружили подпростанственно-составную структуру. Ту самую, да. \n– Чего? \n– Если по простому – мы обнаружили Нити. Мельчайшие структуры, из которых состоит весь материальный мир и то, что находится за его пределами. Меньше атома. Манипуляции с ними открывали такие возможности, что сразу ставили всю Советскую Россию на три ступени выше в научно-техническом развитии, чем весь остальной мир. Если бы мы научились ими управлять, то эффект был сравним с тем, как если бы ты попал в Древний Рим с ядерной бомбой. \n– И вы научились? – уточнил Путин, слегка прихлебывая уже остывший гадский чай. \n– Частично. Про “Немезиду” в курсе? Ну, автомат такой? Вот, на базе Нитей делали. Но это неважно. Важно то, что КС-3 работала напрямую с завихрением Калаби-Яу. Точнее – с материальным воплощением риччи-плоской метрики. Ещё проще говоря, позволяла манипулировать пространством-временем. \n– Ты хочешь сказать... – Путин потёр лоб. – Хочешь сказать, что вы изобрели телепортацию? \n– Не совсем – отозвался Дугин, быстро перебирая документы. – Максимум, на что нас хватило – это на проекцию завихрений в макромир. Представь, что атомы вдруг увеличились до размера, ну, допустим сарая. Примерно то же самое произошло и с восьмимерными структурами. Сперва это делалось только в лабораторных условиях, но затем, когда Фронт рухнул, мощностей установки не хватило. Между макро и микромиром образовался прорыв и завихрения, пусть и в ограниченной форме, появились в форме аномалий. \n– То есть, – продолжил мысль Путин, – если мы возьмём под контроль КС-3, и восстановим её мощности... \n– Вне всяких сомнений, – кивнул Александр. – То, что сделано один раз, всегда можно обратить вспять. Кордоны исчезнут, Володя. И мы станем свободны. Теперь ты понимаешь, насколько это важно? \n– Да, – в очередной раз сглотнув вязкий комок чаю, произнёс Владимир."
SDC_phase_two.1.a:0 "– Теперь я понимаю"

SDC_phase_two.2:0 "Превентивный удар"
SDC_phase_two.2.t:0 "Превентивный удар"
SDC_phase_two.2.d:0 "– Товарищ главнокомандующий, – начал доклад Шойгу. – Согласно данным разведки, войска виллуимов пришли в движение. \n– Что это значит? – спросил Путин, прихлёбывая чай. \n– Люди Зеруила, если позволите так выразиться, кажется оправились после разгрома четырёхлетней давности. Неизвестно, удалось ли им установить связь с остальными своими собратьями за Уралом, но картина складывается крайне неблагоприятная. Трофимов и Янукович уже пали перед настиком его армий, Союз Вольных Деревень – на очереди. \nГенерал ненадолго запнулся, пытаясь найти на непроницаемом лице главнокомандующего хотя бы какой-то проблеск эмоций. \nЕго не было. Лицо Путина оставалось каменным. \n– Если хотите знать моё мнение, – после недолгой паузы продолжил Шойгу, – отдавать Вольные Деревни под контроль Авангарда никак нельзя. Иначе мы рискуем оказаться в невыгодном положении. Зеруил буквально отрежет нас от КС-3. \n– Согласен, – кивнул Путин. – Выбора у нас нет, так?"
SDC_phase_two.2.a:0 "Если драка неизбежна, бить надо первым."

SDC_phase_two.3:0 "Великая шахматная игра"
SDC_phase_two.3.t:0 "Великая шахматная игра"
SDC_phase_two.3.d:0 "– Товарищ главнокомандующий... – начал докладывай Шойгу, едва зайдя в кабинет. \n– Да можешь не докладывать, – раздосадованно махнул рукой Путин. – Что, подобосрались маленько, Малая Земля? А? У тебя спрашиваю? \n– Товарищ главнокомандующий, – попытался было оправдаться Шойгу. – Сопротивление виллуимов оказалось гораздо сильнее, чем мы ожидали. Сейчас на линии соприкосновения идут тяжёлые позиционные бои... \nПутин на это лишь раздражённо дёрнул уголками губ. \n– Выход из тупика предвидится? \n– Никак нет, товарищ главнокомандующий. разве что ценой больших потерь личного состава. \n– Хорошо, – махнул рукой Владимир. – Значит, слушай мой приказ. Атаки прекратить. Укрепиться на позициях и держать оборону. На провокации не поддаваться. \n– Могу я узнать о дальнейших планах кампании, товарищ главнокомандующий? – поинтересовался Шойгу. \n– Можешь..."
SDC_phase_two.3.a:0 "Идём на север."

SDC_phase_two.4:0 "Академия наук"
SDC_phase_two.4.t:0 "Академия наук"
SDC_phase_two.4.d:0 "Здания администрации Объекта номер 1 гудело, словно раздражённый улей. То и дело из-за массивных дверей, отделяющих учёных от остального мира, раздавался чей-то громкий возглас. Частенько даже нецензурный. \n– И вы предлагаете вручить это величайшее, не побоюсь этого слова, оружие, в руки религиозных фанатиков?! – восклицал один из учёных. – Коллеги, вы с ума сошли. Каким бы не был неприятным Путин с его замашками держиморды, но всё же он хотя бы человек. \n– Вот именно! Вы всё верно говорите, коллега, – саркастично отвечал ему его оппонент. – “Хотя бы” человек. Вам стоит напомнить, до чего это самое человечество, за которое вы так радеете, довело этот мир? Эту планету? И сейчас, когда Зеруил и его виллуимы показали нам другой путь, вы планируете вновь отдать власть над материей солдафонам и гэбистам?.. \nНаучный совет или, как его ещё называли, Сакралитет, правивший Объектом номер 1 уже четыре года, разделился надвое. Одна его половина, та, которую называли ортодоксами, выступала за сотрудничество с Фронтом, хоть это и претило идеалам неограниченного научного познания. Другая же, которую звали радикалами, выступала за союз с Зеруилом, видя в виллуимах возможность для человечества подняться на новую ступень эволюции. \nИ с каждым новым витком спора становилось всё очевиднее, что время диспутов окончено. Это противоречие, гораздо более глубокое, чем могло показаться на первый взгляд, могла разрешить только третья сила."
SDC_phase_two.4.a:0 "Сила оружия"

SDC_phase_two.5:0 "Связи Александра"
SDC_phase_two.5.t:0 "Связи Александра"
SDC_phase_two.5.d:0 "– ...Пойми, Давид, – продолжал распинаться Дугин, шатаясь по кабинету из стороны в сторону. – Путин человек принципов. До войны он был всего лишь флотским капитаном, даже не генералом. Настоящий офицер, таких даже в Советской России редко делали, что уж говорить про сегодня. Он не запятнал себя ни политикой, ни подлостью, ни даже подковёрными интригами. А насчёт последнего... многих ли ты можешь назвать из нашей научной братии, кто вёл себя так же честно? Сам знаешь, защиты докторских частенько бывают... жаркими. \n– Но это всё равно филькина грамота! – в сердцах воскликнул Давид, ещё раз бегло перелистав небольшую брошюру “Концепции Общественной Безопасности”. \nОни говорили уже долго, больше двух часов. Давид, один из членов Сакралитета, прибывший в Архангельск тайно. И Александр, его бывший коллега по кафедре физики и давний университетский товарищ. \n– Пусть филькина, – безропотно согласился Дугин. – Но у других нет даже и её. А нынешние времена это значит уже многое. \n– Ладно, – взмахнул руками давид, словно принимая поражение. – Убедил. Я приведу твои доводы Сакралитету. Не могу обещать, что это обеспечит радикальный перелом, но часть колеблющихся всё-таки примет вашу сторону. \nАлександр улыбнулся."
SDC_phase_two.5.a:0 "– На большее я и не рассчитывал"

SDC_phase_two.6:0 "Специальная военная операция"
SDC_phase_two.6.t:0 "Специальная военная операция"
SDC_phase_two.6.d:0 "– Пошли, пошли, пошли! – заорал сержант, подгоняя свой взвод. \nВся линия фронта, застывшая в ожидании уже как несколько месяцев, пришла в движение. От Ледовитого океана и до аномального кордона солдаты шли в атаку, гибли десятками и сотнями, но неумолимо взламывали оборону виллуимов. \nИ участок этого никому неизвестно сержанта был лишь одним из многих. \nС той стороны, что уже многие дни чернела пулемётными точками, неслись навстречу наступающим косые линии трассеров. Фанатики отчаянно цеплялись за свои позиции, однако всем было ясно, что их судьба предрешена. Дело дней, максимум – недель, и их ряды покатятся на восток, к Уралу. И всё Поморье, наконец, будет свободным. \nСержант ухмыльнулся, глядя в расцветающую огнём черноту ночи."
SDC_phase_two.6.a:0 "Скоро ваш зов никто не услышит..."

SDC_phase_two.7:0 "Ликвидаторы"
SDC_phase_two.7.t:0 "Ликвидаторы"
SDC_phase_two.7.d:0 "Отличные новости. Как оказалось, аномальные кордоны всё-таки проходимы. Небольшой отряд людей недавно вышел на нашу границу, прорвавших сквозь завихрения юга. Сами они назвали себя “вторым поколением” ликвидаторов и доложили, что на Урале поднимается новая мощная сила, представляющая собой остатки Сил Ликвидации. Ведомые своим лидером, Дмитрием Медведовым, эти люди готовы положить конец раздробленности нашей Родины и вернуть ей былое величие. \nУзнав о нашей проблеме с виллуимами, немногочисленный отряд тут же принял решение включиться в нашу борьбу. Пусть их немного, но даже такая помощь будет не лишней."
SDC_phase_two.7.a:0 "Достойные люди"

SDC_phase_two.8:0 "Офицерский состав"
SDC_phase_two.8.t:0 "Офицерский состав"
SDC_phase_two.8.d:0 "Помимо добровольцев, которые прибыли к нам из Заполярья, офицеры Карело-Финского округа также решили принять участие в борьбе против Зеруила. Они, будучи настоящими солдатами, устали от пассивности их лидеров. Их горячие сердца требуют борьбы за правое дело, и он готовы предложить свой опыт и свои навыки нам."
SDC_phase_two.8.a:0 "Честь имею!"

SDC_phase_two.9:0 "Опалённые местью"
SDC_phase_two.9.t:0 "Опалённые местью"
SDC_phase_two.9.d:0 "Казалось бы, наша изоляция нерушима. Но нет. \nСоратники прибывают к нам из самых разных мест. Из Южных окраин к нам прибыла группа добровольцев. Себя они называют Армией Возрождения и горят жаждой отомстить каждому, кто вверг их Родину в мрак бесконечного раздора. \nПусть они и не первоклассные воины, пусть долгий переход и измотал их, кровь в их жилах всё так же горяча. А это значит, что на фронте им не будет цены."
SDC_phase_two.9.a:0 "Нам не нужен мир без нас!"

SDC_phase_two.10:0 "Сербские добровольцы"
SDC_phase_two.10.t:0 "Сербские добровольцы"
SDC_phase_two.10.d:0 "Братья-сербы превзошли всех. \nУзнав о нашествии из-за Урала и нашей тяжёлой борьбе, они сформировали целый добровольческий корпус, готовый драться с нами плечом к плечу. \nИ пусть большую часть снаряжения им пришлось оставить в Заполярье, в качестве оплаты за перевозку, их подразделение всё ещё боеспособно. Сами себя они называют “Пантерами” и готовы рвать врагов их новой Родины чуть ли не зубами. \n"
SDC_phase_two.10.a:0 "Најхрабрији наши српски добровољци"

SDC_phase_two.11:0 "Страшный час"
SDC_phase_two.11.t:0 "Страшный час"
SDC_phase_two.11.d:0 "Людмила умирала тяжело. Она металась в бреду, уже даже не крича, а просто подвывая от невыносимой боли. Никакие препараты не помогали, и даже светила медицины, привезённые с территории Объекта, лишь разводили руками. Шансов не было никаких, рак зашёл слишком далеко. \nНачиналась агония. \nВладимир Путин сидел рядом со своей женой и по его грубым, обветренным щекам текли редкие горючие слёзы. Сжимая её тонкую ладонь, он вдруг почувствовал, как его захлёстыевает отчаяние. Чёрная волна поднималась из глубины, шла от самого сердца. \nВсе лишения, все потери, всё это было напрасно. Он не успел. У него просто не хватило времени. И ничего исправить уже было нельзя. \nОн почувствовал лёгкий толчок, услышал тихий, едва различимый всхлип. И всё закончилось."
SDC_phase_two.11.a:0 "Людмила умерла"

SDC_phase_two.12:0 "КС-3"
SDC_phase_two.12.t:0 "КС-3"
SDC_phase_two.12.d:0 "Они стояли в огромном зале, наблюдая за гигантских размеров установкой. Лица учёных лоснились гордостью, каждый из них взирал на футуристический аппарат с едва скрываемым благоговением. Даже Дугин приосанился и выпятил грудь колесом, словно в скором запуске была его и только его заслуга. \nВпрочем, во многом так и было. \nЛишь один человек в зале не разделял всеобщего ликования. Лицо Владимира было непроницаемым. На нём, грубом и морщинистом, застыла неснимаемая маска скорби. Врезалась в его физиономию. Пустила корни. \nИ в этот самый момент радости, он не чувствовал ничего, кроме всепоглощающего чувства отчаяния. Ни радости, ни гордости. Только боль и твёрдая, стальная решимость. \nОн пропустил и последние приготовления, и команду старта. Он лишь почувствовал, как невидимое нечто прошло сквозь него, ударив в грудь невидимым молоточком. Он не слушал аплодисментов, не реагировал на хлопки по плечу. Он лишь почувствовал удар, стальным камертоном отозвавшийся у него в сердце. \nВ глазах главнокомандующего больше не было боли. Лишь отблеск непримиримой, стальной решимости."
SDC_phase_two.12.a:0 "Больше никто не умрёт..."

SDC_phase_two.13:0 "Перерождение"
SDC_phase_two.13.t:0 "Перерождение"
SDC_phase_two.13.d:0 " БОЛЬШЕ НИКТО НЕ УМРЁТ!!!"
SDC_phase_two.13.a:0 "Больше никто..."


SDC_phase_three.1:0 "Диверсия"
SDC_phase_three.1.t:0 "Диверсия"
SDC_phase_three.1.d:0 "Он пришёл незадолго до того как объект ушёл этим... Людям. Просто никто, не солдат и не учёный. Сухой, закутанный в тряпки, с глазами, которые смотрели сквозь мир. Охранники пропустили его по поддельным документам. Или не заметили. Или он просто прошёл, ведь виллуимы умеют быть невидимыми, когда хотят... У него не было имени, лишь одна задача.\nОн пробрался в охлаждающую шахту КС-3 в ночную смену. Долго сидел у резонаторов, слушая гул установки и голос, слышимый лишь им самим. Потом достал ампулу, внутри которой была плесень: почти прозрачная, с едва уловимым янтарным свечением. Он влил её в систему охлаждения. Дело было сделано..."
SDC_phase_three.1.a:0 "Расплата близка."

SDC_phase_three.2:0 "Шёпот"
SDC_phase_three.2.t:0 "Шёпот"
SDC_phase_three.2.d:0 "Гул КС-3 никогда не прекращался. Даже ночью, когда весь объект погружался в тяжёлый, свинцовый сон, установка продолжала дышать — низко, монотонно, как огромное сердце из металла и бетона. \nПутин сидел в кресле командного поста, откинувшись назад, и смотрел в потолок, где тускло мерцала единственная лампа. В руке тлела самокрутка. Дым поднимался медленно, почти нехотя. Всё началось с помех. Сначала он подумал, что это просто усталость — обычный шум в ушах после очередного шестнадцатичасового дежурства. Но помехи складывались в ритм. В слова... \n...владимир... \nГолос был тихим. Женским. Знакомым до боли. \n...ты так долго держался... \nОн резко выпрямился. Самокрутка упала на пол. \n— Кто здесь? — хрипло выдохнул он в пустоту. Ответ пришёл не сразу. Он пришёл через КС-3. Через вибрацию в стенах, через лёгкую дрожь в зубах, через холод, который вдруг проник под кожу. \n...мы здесь... всегда были здесь... мы видели, как ты теряешь её... как она угасает... но это не конец... \nПутин встал. Ноги не слушались. Он подошёл к пульту управления установкой, хотя знал, что делать это опасно. Стрелки приборов слегка подрагивали. \n...мы можем вернуть... не тело... лучше... целую... такую, какой она была до всего... \nОн зажмурился. В голове всплыло лицо Людмилы — то, каким оно было в последний раз: бледное, измученное, но всё ещё живое... \n...возможно... если ты позволишь... если ты перестанешь бороться... мы дадим тебе силу... мы дадим тебе всё... \nГолос обволакивал. Не давил. Он ласкал. Обещал. И в этом обещании было что-то невыносимо притягательное. Путин прижал ладони к ушам. Но голос шёл не снаружи. Он шёл изнутри. Из самой глубины КС-3.\n...просто послушай... один раз... мы не враги тебе, Владимир... мы — то, что осталось после старого мира... будущее..."
SDC_phase_three.2.a:0 "Сладкий шёпот надежды."

SDC_phase_three.3:0 "Расстрел"
SDC_phase_three.3.t:0 "Расстрел"
SDC_phase_three.3.d:0 "Голоса больше не шептали. Они говорили в унисон — чётко, спокойно, как один большой разум.\n— Брат...\nПутин стоял на краю старого плаца, где когда-то проводили построения. Ветер с севера нёс запах железа и мокрой хвои. Перед ним выстроились те, кого он сам когда-то называл своими...\nРаненые. Больные. Те, кто начал сомневаться. Те, кто ночью плакал, вспоминая старый мир. Те, кто уже не мог держать винтовку ровно.\nИх было немного. Всего тридцать семь человек. Но каждый из них — трещина в системе. Балласт.\n— Они тянут нас назад, — произнёс он вслух, и голос его был ровным, почти чужим. — Мы не можем позволить себе слабость.\nГолоса внутри одобрительно вздохнули.\nОн не стал произносить длинных речей. Просто кивнул начальнику караула.\nПервый залп ударил сухо. Люди падали молча — кто-то уже знал, что это неизбежно. Кто-то до последнего надеялся незнамо на что...\nПутин смотрел, не отводя глаз.\nВ голове всплыло лицо Людмилы. Не то измождённое, последнее, а то — молодое, смеющееся, каким оно было до всего. Голоса тут же мягко, почти нежно поправили:\n— Она бы поняла... Она бы не хотела, чтобы ты слабел ради мертвецов...\nВторой залп. Третий.\nКогда всё закончилось, на плацу осталось лишь багровые пятна на сером снегу. Кто-то из молодых солдат, совсем ещё мальчишка, отвернулся и его стошнило. Путин медленно подошёл, положил руку ему на плечо.\n— Теперь ты понял, — тихо сказал он. — Мы больше не можем позволить себе жалость. Жалость — это смерть.\nМальчишка кивнул, вытирая рот рукавом. В его глазах уже не было страха. Только пустота. Кристально чистая, правильная пустота.\nПутин повернулся к остальным.\n— С этого момента каждый, кто не может воевать — обуза. Каждый, кто сомневается — предатель. Мы — щит. Мы — кордон. И кордон не знает жалости.\nГолоса внутри запели в унисон. Тепло. Приятно. Как будто он наконец сделал то, чего от него давно ждали...\nОн посмотрел на свои руки. Пальцы слегка дрожали. Но дрожь была уже не человеческой.\nЭто была дрожь машины, которая наконец-то начала работать без сбоев."
SDC_phase_three.3.a:0 "Теперь мы чисты."

SDC_phase_three.4:0 "Лидер"
SDC_phase_three.4.t:0 "Лидер"
SDC_phase_three.4.d:0 "Они пришли ночью, скрытно. Просто вышли из тумана, окружавшего старый корпус, будто сами были частью этой мглы.\nДвадцать фигур в рванье, поверх которых были накинуты плащи из грубой ткани, пропитанной янтарной плесенью. Глаза у всех светились слабым, ровным светом.\nПутин ждал их на краю плаца — один, без охраны. Он уже не боялся.\nВпереди шёл высокий, невероятно худой мужчина с лицом, больше похожим на высохшую маску. \n— Брат, — произнёс он первым, и голос его был мягким, почти ласковым. — Мы слышали тебя. Ты звал нас, даже когда сам не понимал, что зовёшь.\nПутин молчал. Внутри него голоса пели — уже не шёпотом, а в полный голос, торжественно и радостно.\nХудой опустился на одно колено. За ним — все остальные. Двадцать коленей одновременно коснулись мёрзлой земли.\n— Ты — тот, кто сможет открыть нам путь. Ты — Лидер. Лидер новой крови.\nПутин медленно поднял руку и положил ладонь на голову склонившегося культиста. Кожа под пальцами была холодной и сухой, как будто покрытой тончайшим слоем иссушённой плесени.\nВ этот миг он почувствовал, как по его венам пробежала тёплая волна. \n— Встаньте, — сказал он тихо.\nОни встали как один.\n— Отныне вы — часть нас, — продолжил Путин, и голос его уже не дрожал. — А мы — часть вас. Кордон больше не будет только человеческим. Он станет тем, чем должен был стать с самого начала.\nХудой улыбнулся — улыбкой, в которой не осталось ничего человеческого.\n— Мы принесли тебе дар. Пять отрядов. Тех, кто уже прошёл первое причастие. Они не знают страха или усталости.\nПутин кивнул. В голове уже не было сомнений. Только ясность. Чистая, холодная, идеальная.\nЛюдмила улыбнулась ему откуда-то из глубины памяти — и впервые за долгое время эта улыбка не причинила боли."
SDC_phase_three.4.a:0 "Так будет правильно."

SDC_phase_three.5:0 "Никто"
SDC_phase_three.5.t:0 "Никто"
SDC_phase_three.5.d:0 "Культист с медальоном стоял перед ним и ждал ответа. Путин смотрел на него и не мог выдавить ни слова.\nОн собирался сказать то, что репетировал всю ночь: “Мы используем вас. Вы — оружие. Я остаюсь капитаном. Я остаюсь человеком”.\nНо когда открыл рот, из него вышло только:\n— Хорошо. Приводите отряды.\nГолоса внутри КС-3 на секунду замолчали. Потом раздался тихий, почти удивлённый смешок.\n— Ты врёшь... Брат.\nПутин почувствовал, как по позвоночнику прошла холодная волна.\nОн попытался мысленно оттолкнуть их, как делал раньше. Не получилось. Голоса уже не шептали — они были внутри него, как кровь.\n— Ты уже не капитан. Ты уже не Путин. Ты даже не лжец. Лжец — это тот, кто ещё помнит, кем был. А ты...\nПутин шагнул назад и наткнулся спиной на холодный бетон. Руки дрожали. Он посмотрел на них — обычные руки, с старыми шрамами от тросов на “Курске”. Руки человека.\nНо внутри уже не было человека.\nОн вспомнил, как вчера ночью пытался поговорить с одним из своих старых офицеров по душам. Тот посмотрел на него пустыми глазами и сказал: “Капитан, вы... Изменились”. И Путин тогда впервые не нашёлся, что ответить.\nТеперь он понял.\nОн не стал ни лидером новой породы, ни героем, который всех перехитрил. Он просто исчез. Растворился где-то между попытками быть человеком и этим проклятым союзом. Осталась только оболочка, которая ещё умеет отдавать приказы и держать винтовку.\n— Я... — начал он и замолчал.\nСлово “я” больше не имело смысла.\nКультист смотрел на него с жалостью, которую Путин ненавидел больше всего на свете.\n— Теперь ты понял, — сказал тот тихо. — Добро пожаловать домой.\nПутин медленно сполз по стене и сел на бетонный пол. Он не плакал. Он просто сидел и слушал, как внутри него окончательно затихает всё человеческое."
SDC_phase_three.5.a:0 "— Я не предавал..."

SDC_phase_three.6:0 "Ритуал I"
SDC_phase_three.6.t:0 "Ритуал I"
SDC_phase_three.6.d:0 "Озеро Талто встретило их густым, неподвижным туманом. Вода была чёрной, как нефть, и только у самого берега едва заметно светилась янтарными прожилками. Путин стоял по колено в ледяной воде и смотрел, как плесень медленно, почти лениво, начинает подниматься по его сапогам. Культисты выстроились полукругом на берегу. Никто не произносил ни слова. Только ветер шуршал в сухом камыше. Он сделал ещё шаг. Вода дошла до пояса. Плесень уже обволакивала бёдра тонкой, тёплой плёнкой. Она не жгла. Она просто проникала. \n— Начинается, — тихо сказал он сам себе. \nГолоса КС-3 внутри него замолчали впервые за месяцы. Не исчезли — просто затихли, словно тоже ждали. Путин закрыл глаза. Он чувствовал, как плесень ползёт выше, под одежду, по животу, по груди, по шее. Она была живой. Она дышала в такт его сердцу. Когда она добралась до лица, он не сопротивлялся. Просто вдохнул. И в этот момент понял: обратного пути уже не будет."
SDC_phase_three.6.a:0 "Первая нить вошла. Осталось две..."

SDC_phase_three.7:0 "Ритуал II"
SDC_phase_three.7.t:0 "Ритуал II"
SDC_phase_three.7.d:0 "Боль пришла не сразу. Сначала было только тепло. Потом плесень добралась до позвоночника и начала вгрызаться.\nПутин стоял уже по грудь в воде. Глаза были открыты, но он ничего не видел — только янтарное свечение.\nОн чувствовал, как плесень проникает в лёгкие, в сердце, в мозг... Она не убивала. Она заменяла.\nВ какой-то момент он перестал ощущать холод. Потом перестал ощущать собственные руки. Потом — ноги.\nПоследним ушло имя.\nОн ещё помнил, что когда-то был Владимиром Путиным, капитаном «Курска», мужем Людмилы. Но эти воспоминания уже не вызывали ни боли, ни тепла. Они просто были. Как старые фотографии в чужом альбоме.\nКультисты на берегу начали тихо напевать — низко, монотонно.\nПутин открыл рот, чтобы сказать что-то, но вместо слов из него вырвался только тихий, влажный хрип. Плесень уже заполнила горло.\nОн тонул. И тонул с облегчением."
SDC_phase_three.7.a:0 "Второе причастие принято. Тело почти готово..."

SDC_phase_three.8:0 "Ритуал III"
SDC_phase_three.8.t:0 "Ритуал III"
SDC_phase_three.8.d:0 "Он открыл глаза уже на рассвете. Вода вокруг была чистой. Плесень отступила, оставив только тонкий, едва заметный янтарный налёт на коже. Путин стоял по пояс в озере Талто и смотрел на свои руки. Пальцы двигались. Сердце билось. Но внутри было тихо. Полностью тихо. Ни голосов КС-3. Ни воспоминаний о Людмиле. Ни страха, ни вины, ни надежды. Только холодная, ясная цель. Он повернулся к берегу. Культисты стояли на коленях. Все до единого. Путин вышел из воды. Шаг был ровным. Дыхание — ровным. Даже туман расступался перед ним. Он больше не был капитаном. Не был человеком в полном смысле этого слова. Он был тем, кем должен был стать с самого начала. \n— Инкубатор, — сказал он тихо, и голос его звучал уже иначе. Ниже. Спокойнее. — Нам нужны новые братья и сёстры... \nКультисты подняли головы. В их глазах было настоящее благоговение. Путин посмотрел на север. \nОн больше не сдерживал... Он стал частью того, что когда-то сдерживал."
SDC_phase_three.8.a:0 "Теперь я — это мы!"

SDC_phase_three.9:0 "Виллуим"
SDC_phase_three.9.t:0 "Виллуим"
SDC_phase_three.9.d:0 "Он пришёл к могиле Людмилы на рассвете, когда над кладбищем ещё висел тяжёлый туман. Могила была простой — грубый деревянный крест и несколько камней, придавленных сверху, чтобы ветер не унёс.\nПутин остановился в двух шагах. Внутри было тихо. Ни шёпота, ни обещаний, ни давления. Только его собственные мысли — ровные, холодные и удивительно ясные.\nОн достал из внутреннего кармана старую, потрёпанную фотографию. Людмила на ней улыбалась так, как улыбалась только ему одному. Он долго смотрел на снимок, водя большим пальцем по краю.\nПотом достал зажигалку.\nЩелчок. Язычок пламени поднялся ровно и спокойно. Путин поднёс фотографию к огню и держал, пока бумага не начала чернеть по краям. Он не спешил. Не отводил взгляд. Просто смотрел, как огонь медленно пожирает её лицо, её улыбку, их общую жизнь...\nКогда фотография превратилась в чёрный, хрупкий комок пепла, он разжал пальцы и дал ветру унести остатки.\nВ этот момент внутри него что-то окончательно оборвалось. Всё, что было Владимиром Путиным — капитаном, мужем, человеком, который когда-то пытался сдерживать — просто перестало существовать. Не потому, что его заставили... А потому что он больше не видел в этом смысла.\nОн стоял ещё минуту, глядя на могилу. Потом повернулся и пошёл обратно. Шаги были ровными. В голове — полная, чистая тишина.\nОн уже не помнил, зачем когда-то так отчаянно цеплялся за своё имя..."
SDC_phase_three.9.a:0 "Не они. Я сам."

SDC_phase_three.10:0 "Голоса"
SDC_phase_three.10.t:0 "Голоса"
SDC_phase_three.10.d:0 "Голос пришёл ночью, как всегда — тихий, почти ласковый, прямо в голову. Путин сидел на койке в своём закутке, завернувшись в вонючее одеяло, и курил самокрутку из последнего табака. В бункере было сыро и холодно, как в могиле.\n...владимир... ты ведь хочешь, чтобы она вернулась...\nОн замер. Пальцы сжали окурок так, что тот потух.\n— Заткнись, — прошептал он в пустоту.\nГолос не заткнулся. Он продолжал, мягко, настойчиво, как старый знакомый, который знает все твои слабые места.\n...мы можем. Не как раньше, не больной и умирающей. Целой. Такой, какой ты её помнишь. Только скажи «да». Просто перестань сопротивляться...\nПутин резко встал, ударился плечом о трубу и выругался. Он схватил грязную портянку, скрутил её жгутом и затолкал себе в уши так глубоко, что стало больно. Потом ещё одну — в рот, чтобы не орать.\nГолос прошёл и через это.\n...ты уже столько потерял. Флот. Родину. Её. Зачем тебе это всё теперь? Ради чего ты себя ломаешь каждый день?..\nОн сел обратно на койку, обхватил голову руками и начал раскачиваться, как умалишённый. В ушах звенело. В груди жгло. Он вспомнил, как Людмила в последний раз улыбнулась ему перед тем, как её увезли в лазарет. Как она прошептала: «Не сдавайся, Володя».\n— Я и не сдаюсь, сука, — процедил он сквозь портянку. — Не для тебя. Для себя.\nГолос замолчал. На секунду. А потом тихо, почти грустно ответил:\n...тогда ты снова её потеряешь. Навсегда...\nПутин зажмурился так сильно, что перед глазами поплыли красные круги. Он не плакал... Осознанно. Просто сидел и дышал через рот, чувствуя, как по щекам текут слёзы — злые, горячие, совсем не героические.\nОн уже знал, что завтра снова будет слушать этот гул. И послезавтра. И через неделю...\nНо сегодня он ещё отказался."
SDC_phase_three.10.a:0 "Лишь бы не сдаться..."

SDC_phase_three.11:0 "Садомазохизм"
SDC_phase_three.11.t:0 "Садомазохизм"
SDC_phase_three.11.d:0 "Старший сержант Ковалёв уже третий месяц ходил за капитаном личной тенью и давно перестал удивляться. Но сегодня даже у него внутри что-то ёкнуло.\nПутин стоял в заброшенном ангаре за командным бункером. Светила только одна тусклая лампа на аккумуляторе. Капитан был без шинели, в одной гимнастёрке, несмотря на то что изо рта шёл пар. В руке он держал раскалённый кусок арматуры, который только что вытащил из печки-буржуйки.\nКовалёв замер в дверях. Рядом тихо выматерился второй охранник — Лёха Сомов.\nПутин прижал раскалённый металл к внутренней стороне предплечья. Кожа зашипела. Запахло горелым мясом. Капитан даже не дёрнулся. Только челюсть сжалась так, что на скулах проступили желваки. Он держал железку долго, секунд десять, потом медленно убрал и бросил на бетон с глухим, гортанным стоном. На руке остался чёрный, пузырящийся ожог.\n— Опять, — тихо сказал Сомов. — Уже третий раз за неделю...\nПутин молча взял следующий кусок арматуры. На этот раз прошёлся им по тыльной стороне ладони. Медленно. Словно выжигал что-то под кожей. Когда железо остыло, он просто бросил его и пошёл дальше — босиком по битому стеклу и ржавым гвоздям, которые он сам высыпал на пол ангара.\nКаждый шаг оставлял кровавые следы.\nКовалёв отвернулся. Он видел, как капитан потом сидел на корточках у стены, тяжело дыша, и смотрел в одну точку. Глаза были красные, но сухие. Ни единого слова... Только тяжёлое, хриплое дыхание человека.\n— Он что, совсем рехнулся? — прошептал Сомов. — Зачем он себя так?\nКовалёв не ответил. Он уже понял. Не до конца, но понял. Капитан не просто так себя резал и жёг. Он боролся. С чем-то внутри. С тем, что иногда заставляло его замирать посреди приказа и смотреть в пустоту мёртвыми глазами.\nБоль возвращала его обратно. На несколько часов. Может, на сутки.\nПока боль была сильнее — голоса молчали.\nПутин медленно поднялся, надел шинель прямо на свежие ожоги и, не глядя на охрану, пошёл к выходу. Кровь из разбитых ступней оставляла на снегу тёмные пятна.\nКовалёв молча пошёл следом. Он уже знал, что завтра капитан снова будет отдавать приказы твёрдым голосом. А послезавтра, скорее всего, всё повторится."
SDC_phase_three.11.a:0 "Боль — единственное, что принадлежит ему полностью."

SDC_phase_three.12:0 "Боец"
SDC_phase_three.12.t:0 "Боец"
SDC_phase_three.12.d:0 "Они собрались в старом кабинете Путина — тесном, прокуренном помещении с единственной лампой под потолком. За столом сидели трое: Шойгу, Герасимов и Лапин. Все в потрёпанных шинелях, все с одинаково усталыми глазами.\nПутин стоял у стены, опираясь на неё спиной. Рукав гимнастёрки был закатан, и свежий ожог на предплечье блестел под светом лампы.\nПервым не выдержал Шойгу.\n— Вова, ты что творишь, а? Люди уже шепчутся! Говорят, командир с ума сходит... Один говорит — сам себя режет, другой — вообще на иглу подсел... Мы с тобой сколько лет вместе? Скажи прямо: что за херня происходит?\nПутин медленно провёл ладонью по лицу. Кожа была серой от недосыпа.\n— Не на иглу, Серёга. И не с ума... Хуже.\nОн замолчал, подбирая слова. Потом просто закатал второй рукав. Свежие следы от гвоздей, старые шрамы, ожоги разной степени заживления...\n— Это не для того, чтобы себя наказать. Это чтобы не сдаться. Там, внутри, — он постучал себя по виску, — Что-то сидит. Оно шепчет. Обещает вернуть Людмилу. Обещает силу... Обещает, что если я просто перестану сопротивляться — всё станет проще.\nГерасимов тихо выругался. Лапин только крепче сжал кружку с остывшим чаем.\n— И ты решил, что если себя калечить — оно отстанет? — спросил Шойгу.\n— Отстаёт, — Путин криво усмехнулся. — На день, на два. Боль... Она возвращает. Пока мне больно — я помню, кто я. Пока я чувствую свою кровь — я ещё человек. Стоит перестать — и я начну слушать. А если начну слушать... Тогда уже не я буду командовать.\nВ кабинете повисла тяжёлая тишина.\n— Мы не знали, — тихо сказал Лапин. — Думали... Ну, ты знаешь, что думали.\n— Теперь знаете, — мрачно кивнул Путин. — Я не прошу вас меня жалеть. Я прошу только одного — если увидите, что я начал меняться... По-настоящему... Не ждите. Стреляйте, — он посмотрел на каждого по очереди. — А пока... Я ещё держусь.\nШойгу первым встал, подошёл и молча положил руку Путину на плечо. Герасимов и Лапин сделали то же самое. Никто ничего не сказал. Просто постояли так несколько секунд.\nПутин впервые за долгое время почувствовал, что он не один в этой борьбе."
SDC_phase_three.12.a:0 "Теперь они знают."

SDC_phase_three.13:0 "Непринятие"
SDC_phase_three.13.t:0 "Непринятие"
SDC_phase_three.13.d:0 "Они ворвались без стука. Шойгу первым, за ним Герасимов и Лапин. Дверь захлопнулась с грохотом.\nПутин сидел за столом. Лицо было серым, под глазами — чёрные ямы, а зрачки отдавали лёгким янтарным блеском. На столе стояла открытая коробка с плесенью.\n— Ты совсем ебанулся, Володя? — Шойгу говорил тихо, но голос дрожал. — Люди рассказывают, ты приказал колоть раненых этой дрянью. Что ты с собой сделал, сука?\nПутин медленно поднял взгляд. Улыбнулся — криво, не по-человечески.\n— Это не дрянь. Это шанс. Они не мучаются. Становятся сильнее. Я т...\n— Заткнись нахуй! — рявкнул Герасимов, делая шаг вперёд. — Ты уже не наш! Ты один из них! Мы видели, как ты улыбаешься этой херне, как двигаешься! \nЛапин молчал дольше всех. Потом просто вытащил пистолет. Руки у него тряслись.\n— Мы за тобой от самого Мурманска шли, — сказал он глухо. — А ты... Ты нас продал.\nПутин попытался встать. Движения были слишком плавными, слишком правильными.\n— Вы не понимаете... Это единственный спо...\nШойгу вскинул пистолет.\n— Мы всё поняли. Прости, капитан.\nВыстрел ударил сухо. Путин дёрнулся и осел на пол. Изо рта у него медленно потекла тонкая струйка светящейся янтарной слизи.\nТрое мужчин стояли над телом. Никто не проронил ни слова. Только Шойгу наконец сплюнул и хрипло выдавил:\n— Лучше так, чем смотреть, как он окончательно превращается в одного из них..."
SDC_phase_three.13.a:0 "Мы не смогли его спасти..."

SDC_phase_three.14:0 "Честность"
SDC_phase_three.14.t:0 "Честность"
SDC_phase_three.14.d:0 "Ноги уже почти не слушались. Путин шёл к могиле Людмилы, тяжело переставляя ступни по снегу, и каждый шаг отдавался острой болью в обожжённых ладонях и разбитых ступнях. Ожоги от раскалённой арматуры тянули и саднили под бинтами. Он не шёл — почти полз, иногда хватаясь рукой за стволы чахлых сосен, чтобы не упасть.\nДобравшись, он просто сел прямо на мёрзлую землю у деревянного креста. Земля была ледяной, промокшая шинель мгновенно прилипла к спине. Путин долго молчал, глядя на груду камней и обрывок порванной ткани, который когда-то был её шарфом.\nПотом начал говорить. Хрипло, почти шёпотом.\n— Я боюсь, Люда... Я так боюсь, что однажды проснусь и уже не вспомню, кто я. Голоса говорят, что ты вернёшься. Что стоит только перестать сопротивляться. А я... Я уже не знаю, где кончаюсь я и начинается эта херня...\nОн провёл дрожащей рукой по лицу.\n— Я устал, понимаешь? Каждый день просыпаюсь и думаю — а сегодня я ещё человек? Или уже нет?.. Я не хочу тебя забыть, — сказал он уже громче. — Не хочу стать тем, кто будет улыбаться, когда люди умирают от этой плесени. Но я так устал держаться...\nПутин замолчал. Слёзы потекли по грязным щекам — горячие, злые, совсем не героические. Он не вытирал их. Просто сидел и дышал паром в холодный воздух.\nВнутри стало чуть тише. Не потому что голоса исчезли... А потому что он наконец-то сказал всё это вслух. Не себе в голову. А в мир. Людмиле. Себе.\nОн медленно лёг на бок, свернулся калачиком у могилы и закрыл глаза. Боль в ожогах никуда не делась. Но впервые за долгое время она не была врагом. Она была доказательством, что он ещё здесь."
SDC_phase_three.14.a:0 "Ещё не потерян... Или уже."

SDC_phase_three.15:0 "Просьба о помощи"
SDC_phase_three.15.t:0 "Просьба о помощи"
SDC_phase_three.15.d:0 "Александр Дугин открыл дверь своей каморки и замер. На пороге стоял Путин — осунувшийся, с серым лицом и свежими бинтами, которые уже проступили кровью.\n— Володя?..\nПутин молча вошёл, закрыл дверь и прислонился к ней спиной. Руки дрожали. Он долго смотрел в пол, прежде чем заговорить.\n— Я больше не справляюсь, Александр.\nДугин медленно сел обратно за стол, отодвинув кипу бумаг.\n— Говори.\n— Голоса, — выдавил Путин. — Они не прекращаются. Шепчут, что если я перестану сопротивляться, всё станет проще. Обещают вернуть Людмилу. Обещают силу. Я... Я уже начал их слушать. Иногда ловлю себя на мысли, что это звучит разумно...\nОн закатал рукав. Ожог от раскалённой арматуры выглядел отвратительно.\n— Люди уже шепчутся, что я свихнулся. А я боюсь, что они правы.\nДугин смотрел на ожог, не отводя глаз.\n— И ты думаешь, это как-то связано с КС-3?\n— Не знаю, — Путин сплюнул на пол. — Я даже не уверен... Просто... Ты сейчас главный по этой херне. Если кто и может понять, что со мной творится... То это ты, — он посмотрел другу прямо в глаза. — Александр... Я боюсь. Боюсь, что однажды проснусь и уже не буду собой. Помоги мне. Хоть как-нибудь... Проверь эту долбаную установку. Скажи, что со мной не так. Я больше не могу...\nДугин долго молчал. Потом тяжело вздохнул и кивнул.\n— Хорошо. Но ты должен понять одну вещь, Володя... Если это действительно идёт от КС-3... То мы, скорее всего, имеем дело с чем-то, чего ещё никто не видел, с чем никто не сталкивался.\nПутин криво усмехнулся."
SDC_phase_three.15.a:0 "— Вот поэтому я и пришёл к тебе."

SDC_phase_three.16:0 "Едкость"
SDC_phase_three.16.t:0 "Едкость"
SDC_phase_three.16.d:0 "Дугин долго смотрел на Путина, не произнося ни слова. Потом тяжело вздохнул, откинулся на стуле и провёл рукой по седой бороде.\n— Значит, пришёл наконец-то... А я уж думал, ты так и будешь до последнего делать вид, что всё в порядке.\nПутин сидел напротив, сгорбившись, с забинтованными руками. Он не ответил.\n— Я тебе сразу говорил, Володя, — продолжил Дугин уже жёстче. — Когда ваши решили, что военные лучше разберутся с КС-3, чем мы. «Прямое управление», мать его... Приказы сверху, отчёты по форме, никаких «рискованных экспериментов»... А в итоге что? Установка работает на пределе, резонаторы гудят как бешеные, а мы ходим по струнке и боимся лишний раз чихнуть в сторону оборудования. И вот результат.\nОн кивнул на свежие ожоги, видневшиеся из-под бинтов.\n— Голоса, да? Шепчут? Обещают вернуть Людмилу, силу, покой... Я не удивлён. \nПутин поднял глаза. В них была усталость и что-то очень похожее на стыд.\n— Александр... Помоги. Я не знаю, как это остановить.\nДугин помолчал, потом встал, подошёл и положил руку ему на плечо — тяжело, по-отечески.\n— Я посмотрю, что можно сделать... Но ты должен понять одну вещь. Мы не волшебники. Если КС-3 уже начала тебя... Перестраивать, то это не просто «голоса в голове». Это глубокий процесс. И виноваты в этом не только виллуимы. Вы сами дали им лазейку, когда решили, что вояки лучше знают, как управлять тем, чего даже мы до конца не понимаем, — он сжал плечо сильнее. — Но ты пришёл. Значит, ещё не поздно. Будем работать. Вместе. Только пообещай мне одну вещь, Володя.\n— Какую?\n— Больше не жги себя, как последний идиот. Боль помогает ненадолго. А нам нужно, чтобы ты был в здравом уме как можно дольше."
SDC_phase_three.16.a:0 "— Не могу обещать."

SDC_phase_three.17:0 "Новая концепция I"
SDC_phase_three.17.t:0 "Новая концепция I"
SDC_phase_three.17.d:0 "Голоса вернулись под утро — тихие, назойливые, как всегда. Путин стоял у окна командного бункера, курил и смотрел, как над горизонтом медленно разгорается северное сияние.\nОн уже не дёргался. Не затыкал уши. Не шёл жечь себя раскалённым железом. Просто стоял и слушал, как внутри головы снова начинает шевелиться знакомая муть.\n...ты всё равно один... ты всё равно потеряешь всех...\nПутин медленно выдохнул дым и ответил вслух, почти спокойно:\n— Знаю.\nГолос на секунду опешил. Потом попытался снова, но Путин уже отвернулся от окна и пошёл к двери. Он не победил... Но научился жить с этим.\nВ коридоре его ждали свои. Шойгу что-то бурчал про топливо, Герасимов матерился на связистов, Лапин раздавал сухпай. Обычная утренняя возня. Грязная, злая, живая.Путин остановился в дверях и просто смотрел на них. На этих измотанных, матерящихся, вечно недовольных людей, которые всё равно шли за ним.\nГолоса ещё пытались что-то шептать, но он уже почти не слышал."
SDC_phase_three.17.a:0 "..."

SDC_phase_three.18:0 "Новая концепция II"
SDC_phase_three.18.t:0 "Новая концепция II"
SDC_phase_three.18.d:0 "Ночью он снова вышел на улицу. Сел на старый ящик у входа в бункер, закурил и долго смотрел на небо. Северное сияние полыхало зелёным и фиолетовым, как всегда — красиво и совершенно безразлично к тому, что происходит внизу.\nРядом, у костра, грелись бойцы. Кто-то тихо ржал над старым анекдотом, кто-то кашлял, кто-то просто молча ел тушёнку из банки. Обычные люди. Измученные, грязные, с обмороженными пальцами и вечной усталостью в глазах. Но живые. Со своими мелкими радостями, матом, страхами и упрямством.\nПутин затянулся и подумал, что никогда не победит голоса окончательно. Они будут возвращаться. Иногда чаще, иногда реже... Но он больше не будет с ними воевать так, как раньше.\nОн просто будет жить дальше.\nС этими людьми. С этой войной. С этим холодом и этой болью.\nПотому что именно в этом и заключалась вся суть.\nНе в том, чтобы уничтожить то, что внутри... А в том, чтобы остаться тем, кто всё это выдерживает и чтит память о людях..."
SDC_phase_three.18.a:0 "И о Великой Родине."

SDC_phase_three.19:0 "Новый метод"
SDC_phase_three.19.t:0 "Новый метод"
SDC_phase_three.19.d:0 "В медпункте третьего барака пахло как всегда — карболкой, гноем и мокрой шерстью. Только теперь к этому добавился новый, сладковатый запах, от которого у людей начинало сводить скулы.\nРядовой Воронин, которому неделю назад должны были отрезать ногу по самое бедро, сидел на койке и спокойно наматывал портянки. Нога была целая. Он даже наступал на неё, чуть морщась, но без крика. На открытой ране тонким слоем лежала янтарная плесень — она едва заметно пульсировала.\nДва санитара в углу перешёптывались.\n— Командир приказал всем так делать, — говорил один. — Кого обычными средствами не вытягиваем — сразу под плесень. Говорит, теперь это стандарт.\n— Стандарт, блядь, — сплюнул второй. — Ты видел глаза у тех, кого уже «вылечили»? Они не моргают. И улыбаются... Не по-нашему.\nВера, старшая медсестра, стояла у окна и курила. Она слышала всё. Видела, как вчера вечером один из «спасённых» сидел у стены и просто смотрел в пустоту, хотя ему только что отрезали ступню. Сидел и улыбался.\nПо расположению уже ползли слухи. У костров, в блиндажах, на постах...\n— Путин совсем съехал, — тихо сказал старый кордонник Кова, грея руки у буржуйки. — Людей этой дрянью мажет...\nНикто ему не возразил. Только молча курили и косились. Все понимали: если командир начал лечить умирающих плесенью, значит, дела совсем плохи. И самое страшное — здесь, среди своих."
SDC_phase_three.19.a:0 "Теперь даже смерть — не самое страшное."

SDC_phase_three.20:0 "Раны"
SDC_phase_three.20.t:0 "Раны"
SDC_phase_three.20.d:0 "— Видели, как он вчера опять вышел из ангара? Рука вся в бинтах, а кровь всё равно просочилась. Говорят, сам себя железякой раскалённой прижигает.\nРядовой Степанов сплюнул в снег и потянулся к кружке.\n— Да ладно, может, просто обжёгся случайно...\n— Случайно? — хмыкнул лейтенант Загута. — А то, что он босиком по стеклу ходит, тоже случайно? Ноги в крови, а он даже не морщится... Стоит и смотрит в пустоту, будто с кем-то разговаривает...\nВ углу санитарка устало перебирала бинты и тихо сказала:\n— Он уже третий раз за месяц приходит с новыми ожогами. Молчит. Не объясняет. Просто просит перевязать и уходит. Я спросила — он только посмотрел так, что у меня внутри всё похолодело...\nПо всему фронту слухи множились, как вши в старом бушлате. Кто-то говорил, что Путин свихнулся после смерти жены. Кто-то — что это какой-то секретный ритуал... А самые старые кордонники просто качали головой:\n— Раньше он был как скала. А теперь... Сам себя режет, будто хочет почувствовать, что ещё живой. Если командир так себя ломает, то что нам, простым людям, остаётся?\nЛюди стали смотреть на Путина по-другому. Не со страхом, конечно — но с тяжёлой, усталой тревогой. Потому что если даже капитан не выдерживает, то на что надеяться остальным?.."
SDC_phase_three.20.a:0 "Он сам себя жрёт заживо."

SDC_phase_three.21:0 "Искра"
SDC_phase_three.21.t:0 "Искра"
SDC_phase_three.21.d:0 "В цехе №2 впервые за долгие годы снова пахло горячим металлом и машинным маслом. Старший инженер Виктор Ремизов стоял у верстака и смотрел, как медленно вращается восстановленный токарный станок. Гудел он неровно, с надрывом, но всё-таки гудел.\nРядом, прислонившись к косяку, курил доктор Семён Лазарев. В руках у него была потрёпанная тетрадь с записями.\n— Представляешь, Витя, — тихо сказал Лазарев. — Две недели назад здесь было просто холодное железо и крысиный помёт. А теперь станок работает. Пусть на соплях, но работает.\nРемизов вытер руки ветошью и хмыкнул.\n— Да я уж думал, что мы их вообще никогда больше не запустим. Запчастей нет, людей нормальных нет, электричества едва хватает. А твои яйцеголовые, кстати, уже третий день в лаборатории не вылезают. Говорят, что-то замеряют и радуются, как дети малые.\nЛазарев слабо улыбнулся, выпуская дым в потолок.\n— Не радуются. Просто впервые за годы почувствовали, что могут делать свою работу, а не только выживать. Как и ты со своими станками.\nОни замолчали. Только станок продолжал гудеть, а где-то в глубине цеха переговаривались рабочие, собирая первый за долгое время нормальный заказ на запчасти для грузовиков.\nРемизов сплюнул в сторону и проворчал:\n— Главное, чтоб это всё не загнулось через месяц...\n— Не загнётся! — уверенно ответил Лазарев. — Потому что теперь у нас хотя бы появилось то, чего давно не было.\n— И что же это?"
SDC_phase_three.21.a:0 "— Шанс."

SDC_phase_three.22:0 "Искра II"
SDC_phase_three.22.t:0 "Искра II"
SDC_phase_three.22.d:0 "В цехе Архангельского узла стоял настоящий рабочий гул — впервые за много лет. Ремизов стоял у главного конвейера, скрестив руки на груди, и смотрел, как медленно, но уверенно движется линия. Из-под пресса выходили первые комплекты усиленной модульной брони. Рядом, прислонившись к колонне, курил Лазарев — в руках у него был планшет с результатами последних испытаний.\n— Смотри, — Ремизов кивнул на конвейер. — Вчера мы выдали сорок комплектов. Позавчера — тридцать два. А месяц назад здесь вообще ничего не работало, кроме крыс.\nЛазарев затянулся и выпустил дым в потолок.\n— У нас тоже дело пошло. «Полярный Страж» вчера прошёл полный цикл. Антирадин держит в два с половиной раза дольше старого состава. И тепловизоры, которые твои ребята собрали из трофейного барахла, наконец-то не сгорают через неделю.\nОни замолчали. Где-то в глубине цеха кто-то громко матерился на неисправный сварочный аппарат, но в этом мате уже не было отчаяния — была обычная рабочая злость.\nРемизов сплюнул в сторону и усмехнулся уголком рта.\n— Я уже думал, что мы тут просто доживаем свой век. А теперь смотрю на это железо и понимаю — мы начали не просто латать дыры. Мы начали делать что-то новое.\nЛазарев кивнул, глядя на готовые бронежилеты.\n— Главное, чтоб не загнулось. Потому что если снова всё встанет... Тогда уже точно конец.\nРемизов молча хлопнул его по плечу с улыбкой.\n— Не встанет. Пока мы тут хотя бы станки крутим и пробирки греем — не встанет..."
SDC_phase_three.22.a:0 "Работаем."


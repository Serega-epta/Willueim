############
###Партии###
############

NMG_dem_statesmen_party:0 "Социал-Демократическая Партия Норвегии"
NMG_dem_militarists_party:0 "Патриотическйи союз"
NMG_dem_humanists_party:0 "Либеральная партия Норвегии"


######################
###Национальный_Дух###
######################

NMG_Preparation_for_war:0 "Подготовка к Последней войне""
NMG_Preparation_for_war_desc:0 "Мы не повторим своих ошибок. Все или ничего. Никаких полумер.""

NMG_Norwegian_protests:0 "Протесты норвежцев""
NMG_Norwegian_protests_desc:0 ""Несмотря на установление контроля над крупнейшими оставшимися городами, местное население все еще регулярно устраивает политические акции с призывами к независимости и переходу к гражданской форме самоуправления. Несмотря на кажущуюся несерьезность данных угроз, аналитики советуют не пускать ситуацию на самотек.""

NMG_activity_of_ULF:0 "Активность Объединенного Освободительного Фронта""
NMG_activity_of_ULF_desc:0 "Активность боевиков ООФ продолжает наносить ущерб нашим операциям: партизаны затрудняют переброску войск, совершают нападения на миротворцев и расстреливают конвои с припасами."

NMG_increased_activity_of_ULF:0 "Усиленная активность ООФ"
NMG_increased_activity_of_ULF_desc:0 "На фоне репрессий и кровавого подавления протестов, ООФ радикализировался, в его ряды ежедневно прибывает все новое и новое пополнение. Нам нужно срочно что-то предпринять по этому поводу.

NMG_decreased_activity_of_ULF:0 "Пониженная активность ООФ"
NMG_decreased_activity_of_ULF_desc:0 "На фоне обещаний о выборах и независимости, многие члены ООФ приняли решение отступить от насильственных методов. Конечно, некоторые ячейки все еще функционируют, но они уже не так опасны."

NMG_soldiers_support:0 "Солдаты поддерживают правительство!""
NMG_soldiers_support_desc:0 "Полные патриотического пыла, наши солдаты выполнят любой, даже самый самоубийственный приказ."

NMG_people_support:0 "Население поддерживает правительство!"
NMG_people_support_desc:0 "Полные патриотического пыла, гражданские массово записываются в ряды Норвежской армии, а сельские жители активно помогают бойцам с припасами."

NMG_countermeasures:0 "Подобранные методы противодействия"
NMG_countermeasures_desc:0 "Путем подробного анализа и опросов наших офицеров, мы смогли составить методичку по борьбе с большинством оборонительных и наступательных тактик КФВО. Впрочем, действовать надо быстро: русские скоро поменяют свои методы атаки и защиты."

NMG_spirit_of_revanchism:0 "Дух реваншизма"
NMG_spirit_of_revanchism_desc:0 "Наш народ полон решимости отомстить русским за все унижения и поражения. Наша месть свершится, и она будет ужасающей."

############
###Фокусы###
############
NMG_briefing:0 "Введение в ситуацию"
NMG_briefing_desc:0 "Двадцать с лишним лет длилсяпериод анархии и разрухи. Как долго мы пыталисьналадить ситуацию? Как много жизней мы отдали завосстановление порядка? Но все это было не зря:IOPК наконец-то восстановила контроль над всейтерриторией северной Швеции и Норвегии.\nВпрочем, все еще остается достаточно многопроблем: будет необходимо реорганизоватьэкономику, умиротворить местное население иподготовить инфраструктуру к предстоящимвоенным операциям.\nНо это лишь дело времени."

NMG_resolution_of_civil_matter:0 "Решение гражданского вопроса"
NMG_resolution_of_civil_matter_desc:0 "Итак, проблема достаточно ясна.Население требует реформ, проведениявыборов, возвращения власти в рукигражданских.\nОчевидно, это невозможно, но сказатьнапрямую мы им об этом не можем.\nВоенные предлагают достаточно простой ипонятный вариант: провести рядкарательных операций против протестующих и активистов из ООФ, послечего приступить к "действительно важным делам." Данный подход будет выгоден в краткосрочной перспективе, но населениенавсегда потеряет к нам доверие.\nВ то же время, специалисты из внутреннихорганов безопасности предлагают иной вариант: создать видимость демократии. Чисто в теории, данный вариант можетсработать, но потребуется крайне многовнимания к деталям. Одна ошибка -- и все рухнет.\nВыбор, разумеется, остается за главнокомандующим."

NMG_operation_suppression:0 "Операция «Подавление»"
NMG_operation_suppression_desc:0 "Нет. Никаких «переговоров» или «компромиссов». Мы не будем якшаться с предателями и дегенератами, которые могут поставить под угрозу всю нашу работу!\nПодразделения военной полиции немедленно обеспечат контроль над ситуацией, а специальные подразделения начнут охоту за ООФ в районах их активности.\nМы доберемся до них, до их семей, до их домов и убежищ, до каждой мрази, которая смеет угрожать миру и порядку. Когда мы закончим, от антиправительственных элементов не останется и следа.\nПобеда будет достигнута любой ценой."

NMG_counter_terrorism_operation:0 "Контртеррористическая операция"
NMG_counter_terrorism_operation_desc:0 "Итак, протесты подавлены, контроль над городами восстановлен. На каждом углу дежурят патрули военной полиции, изоляторы доверху заполнены митингующими и нелояльными элементами. \nСамое тяжелое, впрочем, еще впереди. Нам предстоит подавить активность ООФ, который в данный момент пользуется громадной поддержкой среди оппозиции. Для достижения наших целей мы введем режим проведения контртеррористической операции на северных территориях, пограничных с КФВО.\nВпрочем, многого бояться не стоит: благодаря увеличенному влиянию миротворческого контингента, коллапса государства удастся избежать даже в самом отчаянном сценарии."

NMG_remove_borders:0 "Убрать границы"
NMG_remove_borders_desc:0 "Все эти гражданские руководители в свое время немало навредили безопасности нашей деятельности. Бесконечные запреты на досмотры, необходимость ордеров с обвинениями ... \nДовольно. \nК черту ограничения. \nС этого момента все права населения ликвидируются до стабилизации обстановки и победы над чертовыми варварами из Карелии."

NMG_operation_vortex:0 "Операция «Вихрь»"
NMG_operation_vortex_desc:0 "Теперь, когда мы обеспечили себе свободу действий, мы можем действовать без ограничений. Подразделения военной полиции с поддержкой со стороны армейского спецназа проведут рейды на все цели, когда-либо подозревавшиеся в политической поддержке нелояльных элементов.\nМы прошерстим и городские районы, и сельскую местность: у нас хватит людей, чтобы выкурить повстанцев из их нор. Поплатятся все, от заводских рабочих до чиновников."

NMG_operation_highway:0 "Операция «Магистраль»"
NMG_operation_highway_desc:0 "Несмотря на тот факт, что мы имеем контроль над всеми населенными пунктами в Норвегии, дороги между ними по факту почти полностью беззащитны. Регулярно совершаются нападения на конвои с припасами и провизией, что подрывает наши операции. \nДля борьбы с данным явлением мы проведем операцию "Магистраль»: направим дополнительные силы на поддержание порядка в наиболее опасных зонах, а также займемся улучшением инфраструктуры, чтобы обеспечить непрерывный поток снабжения к войскам на границе с КФВО.""

NMG_operation_debauch:0 "Операция «Дебош»"
NMG_operation_debauch_desc:0 "Несмотря на улучшение ситуации со снабжением, нашивойска продолжают нести регулярные потери из-задействий ООФ. Скорее всего, внедренные информаторы исочувствующие идеям повстанцев солдаты передаютданные о передвижениях наших войск, что позволяеторганизовывать крайне эффективные засады.\nОперация "Дебош", проведенная в сотрудничестве сУправлением по Безопасности, позволит нам выкуритьпредателей и шпионов и тем самым оборвать ООФ потокинформации."

NMG_operation_lambda:0 "Операция «Лямбда»"
NMG_operation_lambda_desc:0 "Подготовка завершена. Допрошенные нами пленныешпионы и боевики выдали достаточно информации,чтобы мы смогли сформировать полноценную картинупроисходящего. Были определены лидеры ООФ, ихглавные базы и схроны.\nУже в ближайшем будущем от этих маргиналов неостанется ни малейшего следа."

NMG_masquerade:0 "Маскарад"
NMG_masquerade_desc:0 "Нет. Никакого насилия, никаких силовых операций --это лишь подорвет наши старания в долгосрочнойперспективе. Необходимо действовать куда болеетонко.\nНаши ребята назвали это «камарильей»,«маскарадом». Мы устроим видимость свободных инезависимых выборов, пообещаем независимость ивозврат к самоуправлению, чтобы завоеватьподдержку среди местного населения и обеспечитьстабильность в условиях войны.\nКонечно, никто не будет знать, что наши политикибудут абсолютно подконтрольны Управлению поБезопасности IOPK, а все результаты выборов будутзаранее продуманы. Это потребует огромногоколичества усилий и ресурсов, а провал будет стоитьHaм всего.\nНо и награда в случае успеха будет колоссальной."

NMG_elections:0 "Выборы, выборы..."
NMG_elections_desc:0 "Пора начать подготовку к процессу«демократического перехода». Мы распространиминформацию о готовящихся реформах, обеспечимстабильность и безопасность их проведения.\nКонечно, надо будет убедить армейское руководствовоздержаться от более радикальных мер по борьбе с,как они их называют, антиправительственнымиэлементами, но это уже дело техники.\nВыше нос, выборы уже скоро!"

NMG_candidate_selection:0 "Подбор кандидатов"
NMG_candidate_selection_desc:0 "Конечно, далеко не все подойдут на рольподконтрольного нам болванчика. Будет необходимопровести анализ кадров среди наших Управлений,подобрать необходимых людей и провести с нимиличные разговоры, чтобы склонить на свою сторону.\nВ кратчайшие сроки мы соберем штат из полностьюподконтрольных нам министров и представителейпарламента, которых народ в, разумеется, абсолютночестных выборах изберете."

NMG_Camera_action:0 "Камера, мотор!"
NMG_Camera_action_desc:0 "Все наши аналитики сходятся в одном: дляповышения уровня лояльности стоит подключить всюимеющуюся у нас кинопромышленность ирадиомощности. В эфире будут исключительноодобренные цензорами сообщения, а в кинотеатрахначнут крутить объединяющие фильмы. \nРазумеется, в краткосрочной перспективе этовызовет недовольство среди народа, но вдолгосрочной приведет к повышению доверия кправительству."

NMG_shut_their_mouths:0 "Заткнуть им рты"
NMG_shut_their_mouths_desc:0 "Среди гражданского населения популярны такназываемые «произведения самиздата»:антиправительственные книги, газеты, музыка и прочее. \nОчевидно, в открытую мы ничего делать не будем, дажеогласки этому не дадим ... но через какое-то время людизаметят, что больше не имеют доступа к потоку данных,не одобренных Управлением по Информации."

NMG_Act_on_Ministries:0 "Акт о министерствах"
NMG_Act_on_Ministries_desc:0 "Управления заменили министерства сразу послеформирования Военного Правительства. Возвращениегражданских органов руководства позволит создатьвидимость демократии и государственности. \nНесмотря на тот факт, что на большинстве позиций будут те же люди, что и раньше."

NMG_facade_of_democracy:0 "Фасад демократии"
NMG_facade_of_democracy_desc:0 "Наконец-то, вот она - Норвегия, кульминация наших трудов. Страна, а не осколок, с демократией инезависимостью.\nКонечно, мы не допустим, чтобы кто-то что-то делалбез нашего ведома, а вся оппозиция и пресса будет подконтрольной ... но это куда лучше открытого военного управления. \nЯ люблю демократию. Я люблю Норвегию."

NMG_stability:0 "Стабильность"
NMG_stability_desc:0 "Итак, период политическойтурбулентности остался позади нас. Времязаняться внешними проблемами."

NMG_democracy_protocol:0 "Протокол «Демократия»"
NMG_democracy_protocol_desc:0 "-Чертовы русские! Как и два десятилетия назад, они напалина нас вероломно, без объявления войны!Нецивилизованные варвары будут отброшены иуничтожены! \nМы объявляем тотальную мобилизацию! Да здравствует демократия!"

NMG_fire_of_patriotism:0 "Зажечь огонь патриотизма"
NMG_fire_of_patriotism_desc:0 "Мы не дадим им ни сантиметра нашей земли! Мы будем биться до последнего! Мы будем сражаться на холодных северных берегах, в ледяных лесах и вязких болотах!\nМы никогда не сдадимся!"

NMG_understand_their_tactics:0 "Понять их тактики"
NMG_understand_their_tactics_desc:0 "Конечно, бойцы КФВО сражаются на удивление умело, ноони используют одни и те же шаблоны атаки и обороны, чтохарактерно для организации, которую ведут престарелыеветераны.\nВыучив их паттерны, мы сможем эффективно подбиратьконтратаки и разрушать их планы на корню."

NMG_Polar_Waltz:0 "Операция «Полярный вальс»"
NMG_Polar_Waltz_desc:0 "Время пришло. Мы уничтожим их подчистую, не оставимкамня на камне, вырежем их командный состав и снесемукрепления. \nНаша месть свершится. Цивилизация вернется."

NMG_Calm_population_down:0 "Успокоить население"
NMG_Calm_population_down_desc:0 "Разумеется, даже после конца сопротивления со стороны КФВОпродолжается пассивная борьба со стороны мирного населения:каждый день происходят акты мелкого и крупного саботажа,разрозненные нападения на миротворцев и их имущество. Нампотребуется некоторое время, чтобы успокоить хотя бы частьнедовольных."

NMG_reconstruct_infrastructure:0 "Провести реконструкцию инфраструктуры"
NMG_reconstruct_infrastructure_desc:0 "Для всех было очевидно, что КФВО являлся исключительноситуативным военным союзом: он был озабоченисключительно развитием того убожества, котороеназывалось "советской армией". Очевидно, что любая не-военная инфраструктура попросту игнорировалась.\nОтчасти для поднятия уровня поддержки со стороныместных, а отчасти и из куда более прагматичныхпобуждений, мы выделим средства на починку автодорог вобластях бывшего КФВО."

NMG_round_up_collaborators:0 "Собрать коллаборантов"
NMG_round_up_collaborators_desc:0 "Неожиданно, но среди местных собралось достаточнолояльных к нам индивидов, чтобы мы могли сформировать изних несколько полков. Конечно, использовать на передовоймы их не будем, вместо этого они будут нести службу вгарнизонах в тылу, на территориях, которые мы освободили."

NMG_Alps:0 "Операция «Альпы»"
NMG_Alps_desc:0 "Итак, с КФВО покончено. Теперь мы сможем заняться освобождением всего Кольского полуострова: уже запланирован ряд операций по ликвидации местной «Полярной Федерации» и прочих убогих осколков советской власти."

NMG_population_census:0 "Провести перепись населения"
NMG_population_census_desc:0 "В то время как численность населения Норвегии и Швециивесьма пристально отслеживается, последняя перепись в техтерриториях, которые мы проводили, проводилась как минимумтридцать лет назад. Нужно точно знать, сколько людей присоединилось к нашему государству, сколько провизии импотребуется, сколько еще местных мы сможем призвать."

NMG_relocate_defense_industry:0 "Передислоцировать военную промышленность"
NMG_relocate_defense_industry_desc:0 "Учитывая общее состояние КФВО, мы были приятноудивлены состоянием его военных заводов. Судя по всему,старые советские законсервированные объекты двадцать слишним лет работали без перебоя. Такого рода сокровищепригодится нам в тылу."

NMG_establish_occupation_administrations:0 "Создать оккупационные администрации"
NMG_establish_occupation_administrations_desc:0 "Конечно, мы тут не навсегда. Рано или поздно наступит мир,вернется порядок, цивилизация ... но до той поры будет лучше,если местные будут жить по нашим законам и по нашимправилам. Для этого мы создадим ряд оккупационных администраций в немногочисленных городах региона, чтопозволит нам укрепить свой контроль.

NMG_Mannerheim:0 "Операция «Маннергейм»"
NMG_Mannerheim_desc:0 "Заключительный этап нашей задачи. Финляндия прямоперед нами, наполненная мутантами и бандитами. Поравернуть на ее территории порядок и стабильность."

NMG_Wait_for_orders:0 "Ожидать приказов"
NMG_Wait_for_orders_desc:0 "Вот и все. Наша эпопея подошла к концу. Теперь мы можемлишь ожидать приказов от Европейского Командования.\nДаже не верится, что мы зашли так далеко и все равнопобедили. Позади остались годы анархии, голодапостоянных бунтов и протестов.\nИ все же, Миротворцы выстояли."


############
###Ивенты###
############

NMG_phase_one.1:0 "ВСТУПЛЕНИЕ"
NMG_phase_one.1.t:0 "ВСТУПЛЕНИЕ"
NMG_phase_one.1.d:0 "Некоторые скажут «норвежцы», иные - «шведы», «немцы», «финны» ... ипусть каждый из этих ответов является правильным, истиной является иное.\nМы - миротворцы. Мы - единственные, кто поддерживает порядок в северной Скандинавии и защищает ее население от самого себя. Мы сдерживали натиск советских варваров более двадцати лет, и мы ненамерены отступать.\nМы - защитники западной цивилизации в этом богом проклятом месте.\nНо многие сомневаются в наших целях: сепаратисты, бунтовщики, дезертиры и прочие элементы общества, которых хлебом не корми, а дай причину быть недовольным. Проблемы с ними предстоит решить вкратчайшие сроки, если мы хотим избежать коллапса и без того шаткогорежима."
NMG_phase_one.1.a:0 "За мир и порядок!"

NMG_phase_one.2:0 "ОТЧЕТ О СОСТОЯНИИ ДЕЛ"
NMG_phase_one.2.t:0 "ОТЧЕТ О СОСТОЯНИИ ДЕЛ"
NMG_phase_one.2.d:0 "КОМУ: Йенсу Столтенбергу, командующему силами ІОРК в зонеумиротворения «Скандинавия»\nОТ: Управление по Безопасности, отдел аналитики\nМистер Столтенберг,поздравляем вас с вступлением в должность! В соответствии спротоколом, мы передаем вам актуальную информацию оситуации в зоне умиротворения «Скандинавия».\nГлавной угрозой нашим операциям в регионе является «Карело-Финский Военный Округ» (КФВО), представляющий изсебя пусть и значительно ослабленное и деморализованное, новсе еще достаточно боеспособное объединение ряда военныхчастей бывшей советской армии. Наши прогнозы: атака с ихстороны маловероятна, но на прорыв их обороны уйдетдостаточно много ресурсов. \nВторичной угрозой является т.н. «Объединенный Освободительный Фронт» (ООФ). Военизированная группировка нелояльно настроенных норвежцев и шведов,выступающих против проведения миротворческих операций иставящих под удар стабильность в регионе. Скорее всего,имеют связи с КФВО. Активно действуют в пограничных с КФВО территориях, пользуются значительной поддержкой средиместного населения благодаря на удивление грамотной пропагандистской работе и ряду успешных террористических акций против наших администраций. \nРЕКОМЕНДАЦИИ: \nА) сконцентрировать внимание на нейтрализации внутренних угроз: ООФ не упустит возможности навредить нашим операциям, что может поставить под удар весь фронт в случае начала полномасштабной военной операции;\nБ) организовать линию обороны на границе с КФВО: в случае внезапной атаки (пусть и являющейся маловероятной) это позволит сдержать наступление советских войск;\nВ) обеспечить лояльность гражданского населения: независимые от ООФ протестующие только из-за своей численности представляют не меньшую угрозу нашим операциям.\nЖелаем успехов на посту главнокомандующего, мистер Столтенберг!"
NMG_phase_one.2.a:0 "За мир и порядок!"

NMG_phase_one.3:0 "ОТЧЕТ О ПРОВЕДЕНИИ МИРОТВОРЧЕСКОЙ ОПЕРАЦИИ"
NMG_phase_one.3.t:0 "ОТЧЕТ О ПРОВЕДЕНИИ МИРОТВОРЧЕСКОЙ ОПЕРАЦИИ"
NMG_phase_one.3.d:0 "КОМУ: Йенсу Столтенбергу, командующему силами IOРK в зоне умиротворения «Скандинавия»\nОТ: Управление по Безопасности, отдел аналитики\nМистер Столтенберг,\nИнформируем вас, что миротворческая операция подошла к концу. Ликвидированы последние очаги гражданского неповиновения в крупных населенных пунктах, контроль над стратегически важными целями обеспечен.\nТем не менее, с момента начала операции была зафиксирована повышенная активность ООФ. Значительно увеличилось количество террористических акций и попыток покушений на миротворцев. Согласно нашим прогнозам, данная тенденция будет лишь набирать обороты, пока не дойдет до открытого мятежа.\nРЕКОМЕНДАЦИИ:\nНемедленно предпринять меры против ООФ."
NMG_phase_one.3.a:0 "За мир и порядок"

NMG_phase_one.4:0 "ОТЧЕТ ОТ УПБ"
NMG_phase_one.4.t:0 "ОТЧЕТ ОТ УПБ"
NMG_phase_one.4.d:0 "Йенсу Столтенбергу, командующему силами IOРKв зоне умиротворения «Скандинавия»\nОТ: Управление по безопасности IOРK в зоне умиротворения «Скандинавия»\nМистер Столтенберг,\nРады представить вам финальную версию плана «Маскарад».\nВ течение следующих нескольких месяцев мы проведем номинальную замену военного управления на гражданское: будут воссозданы министерства, парламент и прочие органы власти. Тем не менее, вы все так же будете главнокомандующим до завершения «режима чрезвычайного положения».\nБудьте уверены, все это будет под нашим строгим контролем. Мы дадим народу иллюзию, в которую он с радостью поверит, и будем поддерживать ее даже после завершения миротворческих операций и предоставления «независимости».\nТем не менее, просим вас держать руку на пульсе: можетпотребоваться ваше вмешательство в процесс выборов."
NMG_phase_one.4.a:0 "За мир и порядок"

NMG_phase_one.5:0 "КОЛЛАПС"
NMG_phase_one.5.t:0 "КОЛЛАПС"
NMG_phase_one.5.d:0 "КОМУ: Йенсу Столтенбергу, командующему силами IOРК в зоне умиротворения\n«Скандинавия»\nОТ: Управление по безопасности IOPK в зоне умиротворения «Скандинавия»\nМистер Столтенберг,\nВ результате массовой утечки информации, публика узнала о плане «Маскарад». Нелояльные элементы, поддерживаемые ООФ и диверсантами из КФВО, уже захватили ряд стратегически важных объектов и теперь движутся по направлению к штабу войск ЮРК. Ряд подразделений, состоящих из набранных среди местных жителей рекрутов, присоединился к мятежу и оборвал коммуникации с командованием.\nМы начинаем процедуру эвакуации. В ближайшее время вас переместят в безопасное место, откуда вы сможете приступить к выполнению новых обязанностей.\nЕсли, конечно, вас не отдадут под трибунал за халатное отношение к должности."
NMG_phase_one.5.a:0 "За мир и порядок ... верно?"

NMG_phase_one.6:0 "Выборы в Норвегии!"
NMG_phase_one.6.t:0 "Выборы в Норвегии!"
NMG_phase_one.6.d:0 "КОМУ: Йенсу Столтенбергу, министру обороны Норвегии\nОТ: Служба Безопасности Норвегии\nПоздравляем вас, мистер Столтенберг, с назначением на должность министра обороны Норвегии. Приглашаем вас отпраздновать это в заранее оговоренное место.\nСамое сложное позади. Мы завершили процесс реорганизации, а публика слишком занята наблюдением за заранее продуманной политической борьбой, чтобы заметить подвох. Как вы можете понять по выступлениям на улицах, настроение в стране является про-правительственным. Даже многие бывшие активисты ООФ выступают в поддержку того или иного политического кандидата.\nДаже после окончания периода нестабильности и возврата цивилизации в этот мир, мы сможем удерживать власть. Маскарад станет вечным, но поддерживать его будет куда легче: все заявления о «заговоре» будет отметать само население, с радостью принявшее иллюзию нормальности происходящего.\nПроще говоря, мистер Столтенберг ..."
NMG_phase_one.6.a:0 "... мы победили."

NMG_phase_one.7:0 "СРОЧНОЕ КОММЮНИКЕ"
NMG_phase_one.7.t:0 "СРОЧНОЕ КОММЮНИКЕ"
NMG_phase_one.7.d:0 "[nmg_event_7]"
NMG_phase_one..7a:0 "Срочно созовите штаб! Демократия под атакой!"

nmg_event_7_mil:0 "КОМУ: Йенсу Столтенбергу, командующему силами IОРК в зоне умиротворения «Скандинавия»\nОТ: войска западного пограничного контроля\nТРИ МОЛНИИ, ТРИ МОЛНИИ, ТРИ МОЛНИИ\nПРИОРИТЕТ «АЛЬФА»\nСИЛЫ КФВО ПРОРВАЛИ ОБОРОНУ В РЯДЕ УЧАСТКОВ ФРОНТА\nТРЕБУЕТСЯ ПОДКРЕПЛЕНИЕ\nБУДЕМ УДЕРЖИВАТЬ ВСЕМИ ДОСТУПНЫМИ СИЛАМИ\nПЕРЕДАЙТЕ НАШИМ СЕМЬЯМ, ЧТО МЫ ИХ ЛЮБИМ\nЗА МИР И ПОРЯДОК"
nmg_event_7_dem:0 "КОМУ: Йенсу Столтенбергу, министру обороны Норвегии \nОТ: пограничные войска армии Норвегии\nТРИ МОЛНИИ, ТРИ МОЛНИИ, ТРИ МОЛНИИ\nПРИОРИТЕТ "АЛЬФА»\nСИЛЫ КФВО ПРОРВАЛИ ОБОРОНУ В РЯДЕ УЧАСТКОВ ФРОНТА\nТРЕБУЕТСЯ ПОДКРЕПЛЕНИЕ\nБУДЕМ УДЕРЖИВАТЬ ВСЕМИ ДОСТУПНЫМИ СИЛАМИ\nПЕРЕДАЙТЕ НАШИМ СЕМЬЯМ, ЧТО МЫ ИХ ЛЮБИМ\nСЛАВА НОРВЕГИИ"



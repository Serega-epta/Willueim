OPENING_TITLE:0 "§OTHE REQUIEM OF HUMANKIND: OPEN BETA 0.2.0§!"
OPENING_DESC:0 "§OДобро пожаловать в The Requiem of Humankind: Open Beta! \n\nУже целых пять лет наша команда неустанно работает над «Реквиемом Человечества». Некоторые из вас видели, как из нескольких небольших рассказов мод обретал плоть, наблюдали формирование игровой карты, год за годом следили за выходом контента варлордам, пока не вышла первая общедоступная альфа-версия. Никто из нас не скажет, что путь был лёгким: мод менял дизайн, команда меняла свой состав, но, так или иначе, наша работа продолжалась и продолжается, а значит, каждое новое путешествие в мир «Реквиема» будет иным, всё более и более полным различных событий.\n\nВ этой альфа версии у многих стран отсутствует контент, который будет добавляться по мере разработки мода. Тем не менее, мир продолжает меняться, создавая сцену для грядущих событий!\n\nДо сих пор, сталкиваясь с проблемами, нам помогала ваша бесконечная и искренняя поддержка, и мы благодарим вас - за неё и за бесконечное терпение, которым обладают игроки-ветераны, как не знающие сна часовые дожидаясь новых версий мода. Мы надеемся, что вы насладитесь уникальной атмосферой и захватывающим геймплеем нашей альфа версии! Впереди еще много интересного, и мы хотим, чтобы вы были с нами надолго.\n\n~С любовью, Willumit Team.\n\n\n\n\n\n\n\n\n\n\n§!"
OPENING_SCREEN_BUTTON_TEXT:0 "Поехали!"
opening_screen_button_tt:0 "Приветственный экран"
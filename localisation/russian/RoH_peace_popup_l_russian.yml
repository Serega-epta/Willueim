 #Flavor loc
 PEACE_POPUP_FLAVOR_DEFAULT:0 "Очередная кровь была пролита на землю некогда Великой Родины."
 
 PEACE_POPUP_FLAVOR_SMK:0 "Жизнь творит порядок, но порядок не творит жизни."
 PEACE_POPUP_FLAVOR_NAR:0 "Хаос всегда побеждает порядок, поскольку лучше организован."
 PEACE_POPUP_FLAVOR_LPC:0 "Бери шинель, пошли домой."
 PEACE_POPUP_FLAVOR_AGE:0 "Мечта сербов о своей Родине на Балканах навсегда так и останется мечтой, погребённой вместе с ними."
 PEACE_POPUP_FLAVOR_ODS:0 "Безумный фанатик похоронен вместе со своим идеальным миром."
 PEACE_POPUP_FLAVOR_GLS:0 "Такая уж судьба у отцов — разочаровывать детей." #Не так страшен чёрт, как его малютки.
 PEACE_POPUP_FLAVOR_ORL:0 "Огонь погас, так и не разгоревшись."
 PEACE_POPUP_FLAVOR_IMP:0 "Предатели не расскажут историю со своей точки зрения."
 PEACE_POPUP_FLAVOR_SDC:0 "Быть рядом с ней — это всё, что было ему нужно."
 PEACE_POPUP_FLAVOR_MGL:0 "Учёные настрадались, машина выключена, всё теперь спокойно на Кольском полуострове."
 PEACE_POPUP_FLAVOR_LWV:0 "Нет хуже безумия, чем религиозный фанатизм."
 PEACE_POPUP_FLAVOR_ARM:0 "Месть хороша, пока ты её не совершил."
 PEACE_POPUP_FLAVOR_FSR:0 "Последний лучик надежды погас."
 PEACE_POPUP_FLAVOR_KUH:0 "Его рай оказался пылью." #Его бог отвернулся первым.
 PEACE_POPUP_FLAVOR_STW:0 "Стая уважает силу, а не логические аргументы."
 PEACE_POPUP_FLAVOR_BGD:0 "Вечное бдение окончено."
 PEACE_POPUP_FLAVOR_SMX:0 "Мечта о вольной жизни так и останется мечтой."
 PEACE_POPUP_FLAVOR_SBT:0 "Он бился в аду Барселоны, но погиб от русской пули."
 PEACE_POPUP_FLAVOR_ZAK:0 "...или голова в кустах."
 PEACE_POPUP_FLAVOR_ASR:0 "Закостеневший режим рассыпался под ударами молодняка."
 PEACE_POPUP_FLAVOR_SFL:0 "Мразь должна быть убита."
 PEACE_POPUP_FLAVOR_NFL:0 "Мразь должна быть убита."
 PEACE_POPUP_FLAVOR_MOT:0 "Мотор заглушен навсегда."
 PEACE_POPUP_FLAVOR_OCH:0 "Её загадка так и не будет разгадана."
 PEACE_POPUP_FLAVOR_EDM:0 "Их рай никогда не стал бы примером гуманизма."
 PEACE_POPUP_FLAVOR_MGL:0 "Сердце механизма остановилось."
 PEACE_POPUP_FLAVOR_DRG:0 "Боги не услышали их."
 PEACE_POPUP_FLAVOR_TAG:0 "Батькин курс завёл на рифы."
 PEACE_POPUP_FLAVOR_ARK:0 "Их мятеж окончился сам собой."
 PEACE_POPUP_FLAVOR_ODJ:0 "Власть над Установкой не помогла им."
 PEACE_POPUP_FLAVOR_TRO:0 "Хруст черепов стих."
 PEACE_POPUP_FLAVOR_BAL:0 "Мечта о свободном Калининграде останется с ними навсегда."
 PEACE_POPUP_FLAVOR_SWR:0 "Егеря обещали, но не выстояли. Старцы обещали, но не придумали. Вольнодумцы обещали, но не потрудились."
 PEACE_POPUP_FLAVOR_VDS:0 "Если уж стал на путь коррупции, то сумей вовремя сменить курс."
 PEACE_POPUP_FLAVOR_SUM:0 "Ну подойди уже к девушке. Необязательно убивать сотни людей ради этого."
 PEACE_POPUP_FLAVOR_POL:0 "Есть в Европе традиция такая - раз в сто лет делить Польшу."
 PEACE_POPUP_FLAVOR_GER:0 "Никак вы, блядь, не научитесь."
 PEACE_POPUP_FLAVOR_ITA:0 "O bella ciao bella ciao bella ciao ciao ciao."
 PEACE_POPUP_FLAVOR_FRA:0 "Стоило бы поучиться на опыте Наполеона."
 PEACE_POPUP_FLAVOR_SPA:0 "Gloria a nuestros camaradas libertadores!"
 PEACE_POPUP_FLAVOR_NMG:0 "Пожалуй, они не лучшие сыны викингов."
 PEACE_POPUP_FLAVOR_DOG_CLANGING:0 "Грызня пережила причину."
 #PEACE_POPUP_FLAVOR_:0 "Умирать тоже надо человеком."
 #PEACE_POPUP_FLAVOR_:0 "У судьбы своя логика."
 #Нацдцхи

 PMD_preparations_for_war:0 "Подготовка к Последней Войне"
 PMD_hunger:0 "Голод"

 PMD_People_without_future:0 "Люди без будущего"
 PMD_People_without_future_desc:0 "Пусть на картах генералов и изображено, что Карело-Финский Военный Округ простирается вдоль всей бывшей границы Великой Родины, на деле Округ состоит всего из уцелевших военных баз Заполярья, в которых солдатам приходится прятаться как крысам от холода и радиации. Еда стремительно заканчивается. Топлива почти не осталось. Округ окружён километрами непроходимой Заполярной Пустоши. Чтобы не случилось, мы останемся здесь навсегда. У нас нет будущего. "

 PMD_Eternal_Night:0 "Вечная ночь"
 PMD_Eternal_Night_desc:0 "Заполярье и до Последней войны было не самым тёплым и гостеприимным местом, а после, когда ядерные взрывы подняли в небо огромное количество пепла и пыли, солнце здесь и вовсе оказалось надолго сокрыто облаками. А в последнее время ветра с юга всё чаще приносят ледяные дожди, и что лучше - невообразимый холод или превращающий всё в ледяные статуи, неизвестно."

 PMD_Dwellers_of_Ruins:0 "Обитатели руин"
 PMD_Dwellers_of_Ruins_desc:0 "Примерно за год до Последней Войны, старое правительство ВР, понимая, что основная часть войск в случае начала мировой войны будет скована в Центральной Европе, возвело сеть баз и ДОТов, выстроенных вдоль границы с Норвегией и Швецией, задача которых было предотвратить возможное вторжение войск противника в Заполярье. Когда началась ядерная зима, и настала вечная ночь, именно в них скрылись остатки войск ВР Северного Фронта."

 PMD_Reduced_ration:0 "Урезанный паёк"

 PMD_Hunger_strike:0 "Голодовка"

 PMD_Decent_rations:0 "Нормальный паёк"

 PMD_Good_rations:0 "Хороший паёк "

 PMD_Fuel_from_SDC:0 "Топливо от Северного Фронта"
 PMD_Fuel_from_SDC_desc:0 "Топливо, поставляемое нам фронтовиками на подводной лодке Курск - единственное, что не даёт нам полностью скатиться в каменный век."

 PMD_Our_last_campaign:0 "Наш последний поход"
 PMD_Our_last_campaign_desc:0 "Мы поклялись уничтожить врагов нашей Великой Родины, и мы исполним эту клятву. Или героически погибнем, выполняя её…"

 PMD_God_of_Wrath:0 "Бог гнева"
 PMD_God_of_Wrath_desc:0 "Кирилл Люфтов, рождённый человеком, начал ядерную войну и уничтожил старых богов, тем самым сам став богом. Богом гнева. Да, он нас не ненавидит. Как и мы его. Но именно по этому мы ему и поклоняемся, чтобы его гнев не обрушился на нас, и чтобы наши враги были уничтожены."

#Модификаторы Мнения
 american_interventionists:0 "Американские интервенты"
 brother_in_arms:0 "Товарищи по оружию"
 warlords:0 "Варлорды"
 trade_for_existance:0 "Торговля на выживание"


#Фокусы
PMD_All_that_remains:0 "Всё, что осталось от Фронта"
PMD_All_that_remains_desc:0 "аполярье- пожалуй одно из наиболее худших мест, где вы могли оказаться в день обмена ядерными ударами. В регионе располагалось большое количество важных стратегических объектов, таких как баз Северного флота СР и ракетных площадок, поэтому Мурманск и почти всё северное побережье Кольского полуострова были уничтожены прямыми ядерными ударами. Войска Карело-Финского Фронта оказались полностью отрезаны от остальной части страны, а поднявшееся облако радиоактивной пыли вскоре полностью закрыло небо, ознаменовав начало вечной ночи. Полная неразбериха и дезорганизованность, значительная часть солдат дезертировало, бежа на юг. Всё более-менее успокоилось лишь, когда остатки Фронта смог объединить под своим началом Попадейкин. И лишь его железная хватка до сих пор сохраняет Округ от полного развала."

PMD_Army_Without_State:0 "Армия без государства"
PMD_Army_Without_State_desc:0 "Территории, контролируемые Округом, слишком велики и безлюдны, чтоб была хотя бы призрачная надежда на построение здесь государства. На картах Попадейкина конечно изображено, что Округ простирается вдоль всей линии бывшего Фронта, но на деле Округ состоит всего из нескольких старых уцелевших военных баз Заполярья и пары финских деревень."

PMD_Existential_enemy:0 "Экзистенциальный враг"
PMD_Existential_enemy_desc:0 "После Конца у многих сложилось ошибочное мнение, что I.O.P.K, как и многое другое, сгорел в пламени ядерной войны. Святая наивность! Ещё очень долгое время после наступления всеобщего радиомолчания нашим солдатам приходилось отбиваться от вооруженны групп  I.O.P.K, прущих с запада. Начиная с 2005 года их атаки стали редкими, максимум 1-2 столкновения в год. А с 2020 и вовсе ни одного сражения не произошло. Но Попадейкин убеждён: Последняя Война ещё не окончена, и всё это лишь временное затишье перед их новой попыткой похода на Восток"

PMD_Reliable_Shield_of_Motherland:0 "Надёжный щит Родины"
PMD_Reliable_Shield_of_Motherland_desc:0 "Да, у нас нет еды, нет боеприпасов, нет семей и хоть какой-то надежды на будущее, но у нас есть то, чего нет у многих в этом мире - цели! И наша цель - защита Родины от вторжения противника. И мы будем её защищать, даже если ради этого придется умереть, ибо других целей в жизни у нас больше нет."

PMD_Everything_for_front:0 "Всё для фронта…"
PMD_Everything_for_front_desc:0 "У нас, впрочем как и у всего севера, остро стоит проблема голода. Наши и так немногочисленные солдаты буквально валятся с ног от недоедания. Это неприемлемо. Мы проведём продразверстку в тех поселениях, что находятся на территории Округа. Скорее всего местное население будет недовольно такими мерами, но в условиях военного времени интересы армии стоят выше интересов гражданских."

PMD_Everything_for_victory:0 "…Всё для победы"
PMD_Everything_for_victory_desc:0 "Большинство военных баз оказалось уничтожено в ходе бомбардировок I.O.P.K., но по слухам некоторым из них удалось уцелеть, и они представляют из себя настоящий кладезь довоенной техники и оружия. Мы наверняка не знаем так ли это, но сейчас, когда на горизонте маячит новая битва с I.O.P.K., нам пригодится любая техника и боеприпасы, что там могут находиться. Мы снарядим экспедицию и отправим её ко всем военным базам, о которых нам известно, в том числе и к заснеженным руинам Мурманска"

PMD_Oil_dependency:0 "Нефтяная игла"
PMD_Oil_dependency_desc:0 "АПЛ Курск - единственная наша связь с внешним миром. Раз в несколько месяцев, как мы их называем, “фронтовики” приплывают на ней для продажи нам топлива в обмен на наше оружие и припасы. Они и нам самим позарез как нужны, но только благодаря этой сделке мы так и не скатились полностью в Каменный век, ибо наше собственное топливо давно закончилось"

PMD_Old_dog_new_tricks:0 "Старая собака - новые трюки"
PMD_Old_dog_new_tricks_desc:0 "Когда солнце сокрылось облаком радиоактивной пыли и всё накрылось медным тазом, многие, пытаясь выжить, дезертировали, бежа на юг, однако не у всех это получилось. Некоторые, не сумев пересечь Заполярную Пустошь, так и осели в саамских и финских деревнях. По хорошему их бы следовало расстрелять как предателей, но в нынешних условиях, когда каждый человек на счету, мы готовы предоставить им уникальную возможность исправиться и таки отдать свой долг Родине. Конечно, они уже не так проворны и энергичны, какими были в молодости, но зато у них есть опыт. И будьте уверены они ещё способны на новые подвиги, надо только им это напомнить…"

PMD_Only_OldMen_Are_Going_to_Battle:0 "В бой идут одни старики"
PMD_Only_OldMen_Are_Going_to_Battle_desc:0 "Приготовления к крупному противостоянию с I.O.P.K почти закончены, но перед началом основных боевых действий майор Моисеев хочет провести операцию в тылу противника по захвату ряда важных стратегических точек. Это должно будет облегчить дальнейший путь основной части армии"

PMD_Final_Assault:0 "Последний штурм"
PMD_Final_Assault_desc:0 "Настало время вернуть должок нашей Великой Родине и исполнить её последнюю волю. Тряхнём же стариной, товарищи! Враг будет уничтожен! Победа будет за нами!"


#Ивенты
PMD_phase_one.1.t:0 "И вновь на одного меньше, 1 часть"
PMD_phase_one.1.d:0 "Только что прошло прощание с полковником Лебедевым. Большая часть персонала бункера собралась в ангере. В свои лучшие годы он был забит всякой военной техникой, но сейчас всем, чем он мог похвастаться, это парочкой БТРов и одним сломанным танком, которые вряд ли когда-нибудь вновь вступят в бой, за неимением топлива. В его центре стоял стол, на котором лежал сам виновник торжества- Лебедев, по случаю такого важного события одетый в свою старую парадную форму, напротив стола, выстроившись в ровные линии, стояли прочие обитатели бункера, отдавая честь павшему товарищу. Тусклое красное аварийное освещение наполняло помещение, отчего это собрание больше походило на какую-то сцену из ада. Слева от стола на импровизированной трибуне стоял генерал Даниил Попадейкин и говорил с фанатизмом пламенную речь о том, каким храбрым и правильным солдатом был почивший, и о том, какая это большая потеря для ним и всей Великой Родины. \nИ для них это действительно была большая потеря. Лебедев был самым старшим среди них всех, не каждый в нынешние времена может похвастаться семидесятилетним возрастом, и он был единственным среди высшего состава Карело-Финского Военного Округа, кто получил своё высокое звание ещё до Последней Войны, даже Попадейкин до ядерной войны и до вызванной её в последующим кадровым голодом был всего лишь лейтенантом. Все его уважали, но, как это часто бывает, смерть (а именно апоплексический удар) забирает нужных стране людей в самый неподходящий момент.\nПосле речи генерала и последующей минуты молчания в память об усопшем, всем было приказано вернуться к своей работе. Участь хоронить полковника досталась Андрею Моисееву и ещё одному незадачливому солдату. Андрей, несмотря на то, что был в хороших отношениях с Лебедевым, который всегда отличался скверных характером, явно не хотел в этом участвовать. Но деваться было уже некуда, приказ есть приказ. Одев на себя 2 слоя зимней формы и завернув в брезент раздетое тело полковника (одежда нужна живым), они покинули ангар и вышли на улицу."
PMD_phase_one.1.a:0 "Старые солдаты никогда не умирают…"
 
PMD_phase_one.2.t:0 "И вновь на одного меньше, 2 часть"
PMD_phase_one.2.d:0 "Резкий холодный воздух ударил им в лицо, было градусов -40, а то и ниже. Небо было скрыто чёрной пеленой и звёзд не было видно, так что единственным источником света для них был их убогий фонарь. Яма для трупов находила в 50 метрах от главного входа бункера. Небольшое расстояние, которое можно было пройти за пару минут, казалось бы. Но в нынешних условиях, когда твоё лицо буквально режет холодный ветер, а тебе приходится пробираться через метровые сугробы, такой маршрут становится смертельно опасным. \nКогда они добрались до ямы, вход в бункер уже не было видно. Лишь их следы, что стремительно заметал ветер, указывал то, в каком направлении он был. Вытащив тело полковника из брезента, они положили его к остальной куче трупов и засыпали снегом. Теперь со стороны и нельзя было сказать, что здесь лежит именно Лебедев, а не кто-то другой. Андрей перекрестился и мысленно проговорил “Покойся с миром”. Когда-то он действительно был верующим, но теперь это была просто привычка. Тел в яме было больше раза в полтора, чем живых в бункере, и с каждым годом разница только увеличивается. В бункере была заготовлена кремационная печь на подобные случаи, но в нынешних условиях постоянного голода человеческое тело становится слишком ценным ресурсом, чтобы так неэкономно им распоряжаться. Андрей слишком хорошо помнил первые, самые тяжелые, годы после Конца, ему тогда только стукнуло 20, полная неразбериха, крах государства и всяких моральных ориентиров, и чтобы выжить им порой приходилось прибегать к поеданию своих мёртвых товарищей. С тех пор он на многие вещи смотрит со значительной долею хлоднокровия и цинизма (вещь для выживания- необходимая). Однако, факт того, что когда-нибудь их армия просто напросто вымрет, не может не печалить его. \n–Когда-то Фронт насчитывал 200.000 солдат, теперь нас от силы 10.000, а к концу этого десятилетия останется в лучшем случая сотня,- озвучил свои мысли Андрей, посмотрев на снежный холм, под которым лежали сотни замерзших неразложившихся тел. \n–Чего?- спросил другой солдат, он его действительно не услышал из-за ветра. \n–Возвращаемся скорее!- командным голосом ответил Андрей, устремившись обратно к заставе."
PMD_phase_one.2.a:0 "...Они просто исчезают"

PMD_phase_one.3.t:0 "Огоньки, 1 часть"
PMD_phase_one.3.d:0 "Группа пробирались по сугробам, волоча за собой сани с припасами. Только натянутая верёвка, что уходила далеко вдаль, напоминала, что здесь есть дорога, которая связывает весь Северный Вал. Среди них был и Андрей, он возглавлял это шествие из пятерых людей. Он был смертельно уставшим, замёрзшим и насквозь промокшим от пота. Погода была, если можно так выразиться, хорошая. Солнца по прежнему не было видно, но по крайней мере пурга была не настолько сильная и можно было разглядеть пространство вокруг себя почти в радиусе километра.\nВпереди виднелся тёмный силуэт горы. Именно туда им и надо было забираться, так как там располагался другой бункер Округа, в который им командование назначило доставить провизию. Андрей посчитал, что заберутся они туда в лучшем случае к ночи, хотя сейчас была, если верить его часам, только середина дня. Он подметил для себя одно важное правило: что бы ты не делал, даже если это обычно занимает у тебя всего пару секунд, здесь, на морозе в снегу, займёт в два, а то в три раза больше времени. Андрей поморщился, перспектива пробираться по сугробам в ночи, когда вокруг ничего не видно даже на расстоянии вытянутой руки, ему не очень нравилась, но делать нечего. В противном случае они так навсегда и останутся в этих сугробах.\n–Навались!- подбадривающе крикнул он остальным и потянул за собой сани.\nОни и так были тяжелые, но теперь когда надо было идти вверх под наклоном, чтобы их сдвинуть с места приходилось браться за упряжку обеими руками и наваливаться всем своим телом. \nТяжелый физический труд приглушил разум, и они даже не заметили как быстро пролетело время. \n“Давай, ещё немного, ещё чуть-чуть” мысленно подбадривал себя Моисеев. Вдруг что-то зацепило его глаз, он сначала подумал, что ему просто померещилось, но приглядевшись, он убедился, что видит вдали внизу группу слабых огоньков. "
PMD_phase_one.3.a:0 "Этот мир…"

PMD_phase_one.4.t:0 "Огоньки, 2 часть"
PMD_phase_one.4.d:0 "Андрей знал, что там находится небольшой посёлок с непроизносимым финским названием, он даже бывал там когда-то до Последней Войны, ничего интересного. Но ему казалось, что он давно вымер от голода, от холода или ещё чёрт знает чего, а оказывается, что там до сих пор кто-то живёт. “Надо будет доложить об этом Попадейкину по возвращению”, решил для себя Моисеев. “Интересно, знают ли они о том, что мы живы и что они находятся под юрисдикцией Карело-Финского Военного Округа, или они думают что в этих казематах уже все давно умерли?”, подумал Андрей. \nК моменту, как весь окружающий мир полностью погрузился во тьму, они наконец добрались до точки назначения: прямо в скале был вырыт небольшой туннель, в конце которого была огромная металлическая дверь. Моисеев со всей силы постучал в неё.\nОткрыли не сразу, а лишь спустя десять минут. За это время Моисеев успел предположить худшее, что по ту сторону двери уже просто некому отвечать. Подобное уже случалось, когда на базе случалась какая-то неприятность (вспыхнувшая внезапно инфекция, голодный бунт или прорыв труб с последующем затоплением всей базы), от которой та оставался навеки запертым изнутри.\nНо вот дверь с тяжелым скрипом открылась. За дверью бункера шло продолжение туннеля. В этом бункере последние источники энергии были уже полностью израсходованы, так что местным военным приходилось жить в полном мраке. Солдаты, что встретили группу Моисеева, больше походили на пещерных людей, бледные, неопрятные, в рванье, только висевшие на них автоматы, напоминали о их “цивилизованности”. \n–Здравия желаю, товарищ Моисеев,- произнес один из них.\nМоисеев обернулся, ему хотелось ещё раз взглянуть на огоньки ещё живого финского посёлка, хотя бы на секунду. Но обернувшись он увидел лишь непроглядную тьму ночной пурги. Никаких огоньков нигде уже не было видно.\nГлубоко вздохнув, Моисеев поспешил спрятаться от холода в казематах."
PMD_phase_one.4.a:0 "…больше не принадлежит людям"

PMD_phase_one.5.t:0 "Недобитый враг, 1 часть"
PMD_phase_one.5.d:0 "Попадейкин находился в своём кабинете и при свете керосиновой лампы разглядывал карты, коими был завален его стол. Он был одет в генеральскую форму, она была ему мала, так как изначально принадлежала не ему, а его предшественнику, но его это не смущало. \nВ кабинет постучали.\n–Входите,- строго сказал Попадейкин.\nВ помещение зашёл Илья, секретарь и помощник Попадейкина, в руках он нёс поднос, на котором была металлическая кружка с горячем чаем и тарелка с двумя бутербродами. Раньше это был бы небольшой перекус, но теперь это был роскошный пир, который может себе позволить лишь высшее руководство. \nИлья поставил поднос на стол и без лишних слов удалился из кабинета. Попадейкин принялся с большим аппетитом есть свой ужин (наверное, он единственный человек во всём Округе, у которого сохранилось трёхразовое питание, у рядовых солдат есть только завтрак, и то не всегда). Возможно кто-то может посчитать это слишком расточительным, но Попадейкин убеждён, что руководство, дабы сохранить ясный ум, всегда должно быть всем обеспечено, особенно едой.    \nПосле того как Попадейкин закончил трапезу, он вернулся к своему предыдущему занятию - разглядыванию карт. А именно: разработке плана обороны на случай повторной атаки  I.O.P.K. Вновь и вновь Попадейкин возвращался к этому занятию. Это уже стало его своеобразным хобби. \nПосле того как упали бомбы и наступило всеобщее радиомолчание, ещё долгие годы солдаты Северного Фронта то тут то там сталкивались с выжившими отрядами  I.O.P.K. Но вот уже два года ы с западной стороны больше никто не появлялся. Пусть Попадейкин и говорит, что враг жив и он не дремлет, большинство уже считают, что по ту сторону баррикад все либо уже умерли от голода или холода, либо снизошли до уровня разрозненных племён, просто пытающихся выжить."
PMD_phase_one.5.a:0 "Лучшая защита…"

PMD_phase_one.6.t:0 "Недобитый враг, 2 часть"
PMD_phase_one.6.d:0 "Нападение произошло утром на одну из военных баз Округа расположенных на юге. Также подвергались нападению прилегающие к базе полевые укрепления и финская деревня, что находилась недалеко. Нападение случилось внезапно, отчего солдаты Округа не смогли оказать достойное сопротивление. Пленных не брали. Лишь некоторым удалось спастись. К моменту, когда были собраны и отправлены силы для контратаки, враг уже ушёл. Вся техника и провизия с атакованной военной базы была похищена. \nПервоначальная версия событий: обычный рейд крупной банды с целью раздобыть ресурсы. Но в ходе разбирательства, Попадейкин пришел к выводу, что это была хорошо спланированная операция сил  I.O.P.K. Враг выжил, реорганизовался, адаптировался и провёл атаку с целью нащупать слабое место КФВО. И он его нашёл. \nПопадейкин искренне ненавидел американцев, англичан, французов и всех прочих, кто состоял в  I.O.P.K, но он должен был сказать им спасибо, ведь если бы не они, он навряд ли бы смог так долго удержать власть. \nПопадейкин не знал, почему враг не предпринял ни одной другой попытки атаки после 2020-ого года, но он знал другое: когда-нибудь враг всё равно придет. И каждое своё свободное время он посвящал разработке плана обороны на такой случай.  \nОднако каждый раз что-то не складывалось. Какую бы стратегию обороны он не придумывал, каждый раз он сам находил в ней изъяны, из-за которой всё рушилось. Холод, голод, дефицит припасов, нарушенная коммуникация, радиация, старость. Каждый раз Округ терпел неудачу. \n–Будь ты проклято, гребанное Заполярье,- выругался Попадейкин. \nНаконец он оставил это занятие и устало откинулся на спинку кресла. \nНа самом деле, у него в голове уже давно созревал один план, по которому Округ не терпел стопроцентное поражение, но он гнал его от себя, настолько этот план казался фантастичным и невозможным. Попадейкин всё это время пытался придумать ему более лучшую альтернативу, но так и не придумал. \nИ вот наконец окончательно пришёл к выводу: «Если я хочу, чтобы Округ победил, а враг получил по заслугам, то надо действовать прямо сейчас. И так много времени было потрачено впустую». \n–Илья!- крикнул Попадейкин. \n–Да, генерал-полковник,- показался помощник из-за двери. \n–Созывай Генштаб! И чтобы эти имбецилы были здесь через 15 минут!\n–Слушаюсь, генерал-полковник!"
PMD_phase_one.6.a:0 "...это нападение"

PMD_phase_one.7.t:0 "Плутон 2"
PMD_phase_one.7.d:0 "–Вызывали, генерал-полковник?\n–А, Моисеев. Что так долго? Через пустыню пробирался что ли? Ха!- отчеканил Попадейкин свою любимую шутку, которую Андрей за долгие годы успел возненавидеть. \n–Прибыл как только смог, генерал-полковник,- сухо ответил Моисеев, он всего полчаса назад вернулся с поверхности и всё, о чём сейчас мечтал - о сне. \n–Ладно-ладно, пошутил я… Да! Я вызывал тебя. Настало время тебе вернуться к твоим профессиональным обязанностям, капитан!\nМоисееву открылась дивная картина: весь военный штаб Округа собрался в кабинете Попадейкина и что-то активно обсуждал, глядя на карты.  \nПопадейкин жестом приказал ему подойти к столу. \n–Моисеев, ты - тот кто больше всех остальных бывал на поверхности, знаешь всё о том, как там выжить, особенности рельефа и погодных условий. Поэтому я желаю, чтобы ты принял непосредственное участие в разработке плана «Плутон 2» по нападению на силы  I.O.P.K в северной Норвегии и их последующее полное уничтожение. \nАндрей был в шоке.\n–Но… разве звание мне позволяет участвовать в подобном мероприятии?- не нашел ничего другого сказать Моисеев. \n–Поздравляю, капитан Моисеев! Вы повышены! Илья, распорядись, чтобы ему были найдены генеральские погоны!\nМоисеев всё ещё недоумевал. «Напасть на  I.O.P.K - чистое безумие. Мы ничего не знаем о противнике, мы даже не до конца уверены, что он жив ли он до сих пор. Мы просто группа голодных стариков, что прячется в своих катакомбах как крысы». \n–Да-да, я понимаю твоё удивление. Меня тоже сначала одолевали сомнения. Но послушай. Враг есть - это факт, и возможно не сегодня, но когда-нибудь они вновь двинутся на восток, чтобы покорить нашу Родину . . .  то, что от неё осталось. Возможно когда это случится, от нас вообще уже ничего не останется. Кто тогда спасёт её? Кто если не мы? Так почему бы нам первыми не напасть на них? Превентивный удар. Мы всё равно когда-нибудь умрём, так не лучше ли нам перед этим выслужиться напоследок перед Родиной ещё раз, уничтожив её врагов?\nМоисееву эта авантюра всё ещё казалась безумной, но в самом деле, что они теряют? «У нас всё равно нет будущего». К тому же Моисеев сомневался, что у него есть право отказаться. \n–Да, генерал-полковник. Так точно, генерал-полковник!\n–Отлично, вольно, включайся в работу. \nПопадейкин склонился над картами и начал объяснять первый этап плана «Плутон 2». \n–На данный момент все имеющиеся у нас силы распределены по имеющимся военным базам. Так не годится. Здесь нужно собрать всё, что у нас есть в один кулак и ударить со всей силы! Все войска, ресурсы и техника должны быть сконцентрированы в поселении Инари, ввиду военного времени тамошние жители будут обязаны предоставить солдатам жильё. Все оставленные базы и бункера должны быть затоплены, чтобы они не достались врагу. Когда все наши силы будут сконцентрированы, можно будет перейти к следующей фазе: атаке на предполагаемые базы противника…"
PMD_phase_one.7.a:0 "Снова за работой"

PMD_phase_one.8.t:0 "Продразвёрстка"
PMD_phase_one.8.d:0 "Местные жители были не готовы к встрече с ними. Группа из двадцати солдат Округа во главе с Моисеевым в первой половине дня вошла в поселение Устйоки, в котором проживало около 100 человек, с целью проведения продразвёрстки. Мужская часть населения попыталась дать отпор солдатам Округа. Со стороны КФВО погиб только 1 незадачливый боец, что успел получить стрелу в голову. Со стороны же местных погибло 45 человек, вся взрослая мужская часть населения была ликвидирована. Старые автоматы всё равно эффективнее копий и стрел. \nОстались только женщины, дети и старики, не способные более препятствовать солдатам Округа. Всё, что они могли делать, выкрикивать слова ненависти и скорби на своём языке, но Моисеев их не понимал. Ему, сказать по правде, было и не очень-то интересно. \nПеред Андреем стояли сани, в которые бойцы загружали всю ту провизию, что смогли найти. \n–Капитан…,- хотел было обратиться к нему один из его бойцов. \n–Генерал,- поправил он. \n–Генерал Моисеев, мы собрали всё то, что лежало на поверхности. Я убеждён, они ещё где-то хранят свою еду, если разрешите провести допрос с пристрастием, то они покажут где они её прячут. \nМоисеев посмотрел на ту провизию, что успели погрузить в сани: много, но недостаточно, чтобы прокормить это поселение. «Солдат прав, где-то у них ещё есть еда». \nПотом он посмотрел на местных жителей, что были согнаны на улицу. «Если забрать у них последнюю еду, они не переживут и этот месяц. А смысл об этом беспокоиться? После того, как мы перестреляли всех их мужиков, они и так обречены на погибель. Не велика разница: вымрет эта деревня через месяц или через год-два"
PMD_phase_one.8.a:0 "Мы собрали достаточно, возвращаемся на базу"
PMD_phase_one.8.b:0 "Все равно обречены, узнать где они прячут еду"

PMD_phase_one.9.t:0 "Нефтяная игла"
PMD_phase_one.9.d:0 "–Приплыли?\n–Всё ещё нет, - Степаныч глухо сплюнул в снег.\nОн наполовину вылез из люка броневика и осматривал окружение. Вид бескрайней белой пустоши Северного Ледовитого океана оставался неизменным. \nПодлодку они ждали уже два дня. Обычно "фронтовики", как звали их солдаты Карело-Финского округа, не опаздывали на встречу, Но в этот раз их что-то задержало. Может наткнулись на какого бедолагу кита, может с двигателем что случилось, а может их засекли недобитым из  I.O.P.K. Всё могло случится. Степаныч ненавидел это чувство неизвестности и ожидания. \nОн был бы и рад на всё махнуть рукой, загрузить ящики с припасами обратно в броневик и умчаться в расположение части. Но приказ командира был однозначный: ждать до конца. Горюче-смазочные - слишком важный ресурс для Округа, и только торговля с фронтовиками не допускает его полный скат в каменный век. И поэтому Степаныч ждал. Несмотря на то, что продрог как собака.\nНе успев додумать эту мысль, Степаныч услышал треск. А через секунду, разламывая льды Северного Ледовитого, в полукилометре на поверхности воды показалась узкая башня подводной лодки.\n–А вот и фронтовики, бля, легки на помине, - произнес\nСтепаны, вновь сплюнув в снег.\n–Эй, салага, вылезай давай!- постучал он по корпусу броневика.\n–Пойдём, произведём натуральный обмен,- Степаныч полностью вылез из броневика и спрыгнул на лёд, толщина которого была настолько велика, что он выдерживал вес бронемашины.\nБоевой товарищ также выбрался наружу, взялся за поводья саней с ящиками и вместе со Степанычем повёз их к подводной лодке, откуда уже стали тоже выбираться люди."
PMD_phase_one.9.a:0 "Капитализм, счастье?.."

PMD_phase_one.10.t:0 "Я не Саша"
PMD_phase_one.10.d:0 "Сандра очень плохо помнила жизнь до войны, ей тогда было лет 15 кажется. Это было так давно, что она сейчас не уверена не был всё это просто сон. Сандра жила тогда в небольшой коммуне вместе со своей семьёй. Мамой, папой и сёстрами. Жили вроде неплохо, но молодой Сандр хотелось поехать жить в большой город. Зачем - этого уже она вспомнить не могла. В какой-то момент случилась ядерная война и солнце оказалось скрыто за серой пеленой. Стало холоднее и тяжелее жить, но им, северным людям, не привыкать к трудностям. А потом пришли военные. Поначалу они просто бежали на юг, но когда побег на юг стал невозможным, они захватили их коммуну и остались в ней жить. Всех мужчин и детей убили, а женщин поделили между собой. Так и оказалась Сандр вместе со своими сестрами и матерью в стане наложниц одного из военных.  \nСначала она конечно сопротивлялась, старалась сохранить свою гордость и достоинство. Но побои со стороны «мужа» быстро сломали её и заставили смириться со своей участью. \nДетей у Сандр нет. Вернее, они были, но ни один из них не протянул больше года после рождения. Она была этому даже рада, она не любила своего «мужа» и не любила его детей (своих племянников). \nЗа долгие годы Сандра привыкла к новой жизни, позабыв, что была другая. Иногда ублажаешь «мужа», иногда выполняешь работу по дому, а во всё остальное время просто лежишь, смотришь в потолок и ждёшь своей очереди на еду. «Чем тебе не жизнь? Без проблем и без мечты». Сандра вполне могла бы так прожить всю свою оставшуюся жизнь. Но сегодня вновь случились перемены.\nПришли военные, другие. Сандра вначале подумала, что они хотят разграбить их поселение и что сейчас найнётся бойня (такое уже случалось). Но нет, перестрелки не началось. Военные что-то обсуждали между собой, вели переговоры и вели их долго. Но в конечно счете они договорились. \nУ «мужа» было явно недовольное лицо. \n–Собираемся, бабоньки. Берём детей и все свои пожитки. Мы уходим. \nПогрузив свои немногочисленные вещи на спину, они, вместе с остальными «семьями» покинули поселение. Более чем за 20 лет Сандр вышла на его пределы. Ей было даже грустно от этого, да, жили плохо, но дальше они будут жить ещё хуже. На щеке неожиданно для неё самой появилась слеза. \n–Саша, ну чего ты? Не боись, и не из таких передряг выкручивались,- решил подбодрить её «муж». \n«Я не Саша, а Сандра. И можешь засунуть своё сочувствие себе в жопу», мысленно послала его Сандра. Она улыбнулась, уж лучше так, чем никак. \nОни, выстроившись в длинную тонкую линию, пробирались по большим сугробам через лес. \n“А что если сбежать? Вот он, лес - беги на все 4 стороны. Всё равно помру»,- поразила её на мгновенье мысль. \nНо всего на мгновенье. Погода резко испортилась, и сил на то что на побег, на простое продолжение пути уже не оставалось. \nМногие не пережили этот поход. Из «семьи» Сандр осталась только она сама, её «муж» и один племянник. \nИх привели в какое-то другое поселение, которое сейчас было перестроено под военны лагерь со стеной, смотровыми вышками и казармами, в одной из них их и разместили. \nЖизнь здесь действительно оказалась хуже прежней: стены казарм (которые судя по всему построили недавно) почти не держали тепло, еды выдавали мало, здешние люди были злыми и постоянно орали. Когда-нибудь Сандра и к этой жизни привыкнет, человек вообще ко всему может привыкнуть, но до тех пор она сожалела, что не погибла вместе со своей семьёй (настоящей семьёй, мамой и сестрами) в ходе этого похода."
PMD_phase_one.10.a:0 "Если есть жизнь - будет и счастье, да только разве это жизнь"

PMD_phase_one.11.t:0 "Успешная разведка"
PMD_phase_one.11.d:0 "Группа Моисеева возвращалась с задания обратно на территорию Карело-Финского Округа. Разведывательная операция оказалась для них невероятно трудной: они попали в непогоду, температура опускалась до почти минус 60-и градусов, и пару раз им довелось встретиться с белыми медведями. У группы были все шансы провалить задание и погибнуть. Но они выжили и таки смогли раздобыть для Округа ценные разведданные. \nА именно то, какие поселения Норвегии и северной Швеции в приграничной зоне смогли пережить ядерную зиму и до сих пор обитаемы. И это были не просто независимые друг от друга коммуны, Моисеев своими глазами видел через бинокль, что во всех этих поселениях есть люди в форме  I.O.P.K и даже флагшток с белым мальтийским крестом  I.O.P.K. \n« I.O.P.K живы… эти сукины дети всё ещё живы! Мы вынуждены сидеть в своих подземных каморках и доедать прогнившие консервы, а они живут на поверхности в своих деревнях. Пусть я ослепну, если мне лишь показалось, что в некоторых из домов почему-то сохранилось электричество!» \nСейчас отряд переходил через замерзшую реку. Было уже поздно, но видимость оставалась хорошей. \nНо вдруг послышался громкий звук треста, которого никто из группы не ожидал услышать. Неожиданно один из солдат провалился под лёд, по грудь он оказался в ледяной воде. Другие члены группы ринулись вытаскивать своего товарища из воды. \nМоисеев стоял в нескольких шагах от них и смотрел на всё происходящее удивлёнными глазами. Он никак не ожидал, что лёд в их широтах может быть настолько тонким, что не выдержит вес человека. Но бездействовал командир не из-за шока, а из-за осознания бессмысленности помощи. \nОбщими усилиями бедолагу смогли полностью вытащить на поверхность. Он промок на насквозь и дрожал от холода. \n-Не повезло тебе, дружище,- сказал Моисеев мысль вслух. \n «Он уже труп. До базы ещё минимум день пешего пути, и никакой лишней сухой одежды у нас нет. В таком состоянии он умрёт в муках от переохлаждения через несколько часов». \n-И что же, командир, просто бросите меня здесь?- спросил солдат на удивление спокойным голосом (он и сам прекрасно понимал, что это конец, и уже успел смириться с этим). \n-Ну почему же, окажем напоследок тебе солдатскую честь. \nДругие члены группы забрали у промокшего солдата рюкзак и оружие, тот не сопротивлялся. Моисеев наставил на него пистолет. \n-Для меня было честью служить вместе  с тобою,- сказал Андрей. \n-Ой, да пошли Вы нахер, командир…\nРаздался выстрел, тело солдата безвольно повалилось на землю, и снег стал пропитываться кровью.  \n«А ведь так всё хорошо шло», с досадой подумал Моисеев. \nГруппа не стала задерживаться ради формальной панихиды и прощания с умеющим. Распределив между собой вещи умершего, что не промокли полностью, они продолжили свой путь обратно в Округ, однако настроение у всех было надолго испорчено."
PMD_phase_one.11.a:0 "Главное - задание успешно выполнено"

PMD_phase_one.12.t:0 "Всё пошло не по плану"
PMD_phase_one.12.d:0 "Моисеев бежал что было сил, он буквально глотал ртом воздух, вся его одежда под курткой насквозь промокла от пота, сердце его бешено колотилось. Андрей испытывал страх, настоящий животный страх и желание лишь одного: поскорее спрятаться в одном из ДОТов Округа или любой другой норе, где было бы безопасно. \nСейчас он бежал по вниз склону небольшой горы. Местность абсолютно не защищённая от ветра, так что мелкие хлопья снега буквально резали лицо Моисеева. Снег наваливался в ботинки. Видимость почти нулевая. \nВсё, что могло пойти не так в их разведывательном походе - пошло не так. \nВначале всё шло ещё более менее, но потом отряд наткнулся на кордон военных в форме  I.O.P.K (толи группа Моисеева случайно на них наткнулась, толи их заметили и специально послали за ними). Завязался бой. Группа Моисеева вышла из него победителем, ей удалось перестрелять всех кордонников, но сама понесла большие потери. Выжил только Моисеев и его подчиненный по имени Илья. Было принято решение немедленно возвращаться в Карело-Финский Округ.  \nКак назло на обратном пути ещё сильно испортилась погода. Но самое худшее произошло ночью, когда они легли спать. Андрей и Илья лежали вдвоём в палатке, спасаясь от ветра снаружи. Моисеев тогда ещё долгое время не мог заснуть, это его и спасло, когда раздался противный звук распоротого нейлона, из которого была сделана палатка. “Белый медведь…”, пришло ужасное осознание Моисееву.\nОдним ударом лапы он сорвал всю переднюю часть палатки. Проснувшийся Илья закричал во весь голос, и тут медведь схватил того за шею и потащил из спальника, а потом вонзил свои зубы прямо ему в голову. Андрей кое-как нащупал в темноте свой автомат, включил фонарик, что был установлен на нём, и открыл по медведю огонь. Тот так завыл, что Моисеев чуть не оглох. В какой-то момент они пересеклись глазами. \nМоисееву помнилось, что в довоенных мультиках часто использовали приём с очеловечивание животных. Так вот: это полная чушь! В его глазах не было ничего человеческого, в этом Моисеев готов был поклясться.\nОн снова открыл по медведю огонь и заставил его убежать. Андрей тут же кинулся к Илье. Он бился в конвульсиях и кричал от боли, на месте лица осталась лишь кровавая каша. На все попытки командира достучаться до него, он лишь пинался и беспорядочно бился руками, выкрикивая неразборчивые слова. “Прочь” - единственное слово, что смог понять Моисеев. \nПоняв, что Илья выбыл из игры, он застрелил его, чтобы прекратить мучения, в спешке собрал все свои вещи и, не собирая палатку, побежал прочь отсюда. Медведь был ещё жив, и Андрей боялся сейчас больше всего того, что тот вернётся.\n“Выжить любой ценой. Выжить любой ценой. Выжить любой ценой. Выжить чего бы это не стоило. Я обязан добраться до Округа, до Попадейкина и сообщить, что  I.O.P.K действительно выжили. Ведь иначе… иначе…"
PMD_phase_one.12.a:0 "Всё это было зря"

PMD_phase_one.13.t:0 "Новая цель"
PMD_phase_one.13.d:0 "Погода была на удивление хорошая. Она напоминала Попадейкину о днях его молодости, проведённой в Ленинграде, там была такая же погода в холодное время года: всё небо скрыто белой пеленой, что равномерно освещало землю под собой, не оставляя теней.   \nПлац, что располагался рядом с их военной базой, впервые за долгие годы был полностью очищен от снега (Попадейкин уже и забыл, что он такой большой). На нём были выстроены в ровные ряды солдаты Карело-Финского Военного Округа, старые, бледные, но впервые за долгое время с огнём в глазах. \n-Здравствуйте, красноармейцы!- громко поздоровался Попадейкин. \n-Здравия желаем, товарищ генерал-полковник!- ответили ему всем разом. \nВид его армии приводил Попадейкина в состояние эйфории. Как он мечтал в детстве, чтобы так стоять на трибуне в красивой генеральской форме перед тысячей солдат, что будут боготворить его и что выполня любой его приказ, будь то даже приказ умереть. Как он мечтал об этом, как он долго шёл к этому, и вот наконец мечта стала явью.\nПопадейкин зачитал пламенную речь, как он делал это уже множество раз, так что оригинальностью эта речь не отличалась. Кульминация данного мероприятия случилась после, когда к пустому флагштоку, вышли трое солдат, у одного из которых был некий свёрток. Подойдя к шесту, он развернул его. Это оказалось старое, почти полностью выцветшее, дырявое в некоторых местах боевое знамя Великой Родины (многие солдаты уже и забыли как оно выглядит). \nСолдаты закрепили знамя на флагштоке, после чего к нему подошёл Попадейкин и поцеловал красное полотнище. \nПопадейкин долгие годы хранил его у себя в коробке под кроватью, уже и не веря, что оно может вновь когда-нибудь пригодиться. \nСолдат начал тянуть верёвку, и знамя стало медленно подниматься вверх. Холодный ветер развевал его. \nУ некоторых солдат покатились слёзы при виде этого. \nВ этот момент все присутствовавшие, в том числе и сам Попадейкин, решили для себя: “Я скорее умру, но не дам этому знамени быть спущенным вновь. Больше никогда!”\nКогда знамя достигло верха шеста, раздалось всеобщее “ура”, что эхом разнеслось по всей округе, предвещая начало последнего и окончательного похода солдат Великой Родины против её врагов."
PMD_phase_one.13.a:0 "За нашу Великую Родину"

PMD_phase_one.14.t:0 "Суп, 1 часть"
PMD_phase_one.14.d:0 "Сегодня в столовой подавали суп, довольно редкое в их время угощение. Конечно это не тот самый довоенный мамин суп, с овощами и сметаною, но и не просто кипяток с плавающими там опилками. Это был костный бульон с небольшими нарезанными кусочками мяса. При аварийном освещении он внешне даже походил на борщ. Подобная щедрость очень удивила Моисеева, так как он знал наверняка, что на их складе уже давно закончилось мясо, но как ему ответили, недавний поход на охоту оказался очень удачным. «Не очень убедительный ответ». Андрей сидел в столовой за отдельным столом для офицеров и задумчиво смотрел на свою тарелку. Все остальные уже давно жадно поедали свои порции, было заметно, что у всех приподнялось настроение. Вновь где-то была слышна солдатская болтовня, кто-то даже решился шутить. Армейская столовая вновь стала походить сама на себя. Не желая выделяться, Андрей взял ложку, но он чувствовал, что что-то здесь не так. Режущая боль снова поразила его желудок, он аж немного скорчился от неё, не сумев сохранить вид. Он уже два дня ничего не ел. И учитывая то, что его питание и до этого было не очень насыщенным, эти два дня дались ему, и так не молодому человеку, очень тяжело. Он еле стоял на ногах и был более раздражительным, чем обычно.\n«К черту! Суп уже приготовлен и стоит прямо перед тобою, откуда было взято мясо- не суть важно», решил Моисеев. Он зачерпнул ложкой и попробовал его. Приятное тепло распространилось по его желудку. \nДа, это не мамин суп, но Андрею он показался одним из самых вкусных супов, что он ел в своей жизни. Да и вообще самым вкусным блюдом в мире. В их мире, ограниченном бескрайней ледяной пустыней, так точно. Оставив все свои прежние сомнения, он принялся жадно поедать его."
PMD_phase_one.14.a:0 "Бога нет ..."

PMD_phase_one.15.t:0 "Суп, 2 часть"
PMD_phase_one.15.d:0 "Вот уже и вечно хмурый Моисеев повеселел. Даже кинул положительный комментарий по поводу вкуса супа своему соседу. Куски мяса были жёсткие, поэтому Андрей тщательно их пережёвывал прежде, чем проглотить. И вот, во время пережёвывания одного из кусков, что-то хрустнуло у него между зубов. Андрей сначала в ужасе подумал, что это сломался его зуб, но это оказалась всего лишь маленькая косточка, что коварно спряталась в куске Mяca.\nМоисеев засунул грязные пальцы к себе в рот и аккуратно вытащил её, принявшись после её внимательно рассматривать. Она была наполовину раздроблена, а аварийное освещение не давало много видеть, но Андрей почти сразу понял что это за кость. Это фаланга, одна из костей человеческого пальца. Моисеев, офицеры и, судя по всему, все солдаты в столовой едят суп из человеческого мяса. Андрей смотрел на косточку ещё какое-то время, после чего брезгливо выбросил её на пол, вытер свои пальцы о форму и продолжил есть суп, допивая бульон.\nОн уже давно перешёл эту черту, лет 20 назад, когда упали бомбы, его отряд в спешке покидал Швецию, отступая к Северному Валу. Полная неразбериха и неорганизованность, это была зима, а они умудрились застрять где-то в горах. Припасы давно закончились и они не ели уже несколько дней. У одного из его боевых товарищей произошло воспаление лёгких из-за холода, и он очень сильно тормозил их отряд. Тогда они и решились на этот шаг: пожертвовать одним ради всех остальных. Во время одного из привалов, когда тот заснул, они пристрелили его (тогда Андрей считал это своеобразным проявлением милости, сейчас же он воспринимает это лишь как бессмысленной тратой дефицитного патрона), разделали на кровавые куски и зажарили их на костре. Что интересно, наиболее сложной частью этого процесса стал момент, когда нужно было просто проглотить уже положенный в рот кусок мяса. Он был голоден. Очень голоден. Но некая сила, гуманизм, вера или что ещё, не давала ему это сделать. Через силу, через отвращение к мясу и к самому себе, через ненависть к миру, в котором он оказался, через отказ от всех своих старых убеждений и веры он заставил себя проглотить этот кусок человеческого мяса. Он выжил.\n-... Не, вы подумайте, сколько лет эта сука гоняла меня по плацу. Каждый свой недовольный блять день срывался на мне. Ещё смел прикрываться "гордостью Красной армии". А чё в итоге? A !? На! Плавает вот в супчике, а я с удовольствием его поедаю. Дерьмом был, дерьмом и станет,- послышался где-то злорадный голос одного из солдат.\nМоисеев рассмеялся. Причем он рассмеялся так неожиданно и звонко, что на него удивлённо посмотрели не только товарищи офицеры, но и простые солдаты, сидевшие рядом. Наверное, даже он сам бы не смог сказать точно, что стало причиной смеха, но спустя минуту его наконец отпустило ."
PMD_phase_one.15.a:0 "...а суп есть"

PMD_phase_one.16.t:0 "Еды больше нет"
PMD_phase_one.16.d:0 "Провиант кончился, но трагического описания отдел писателей не сделал. Но еды прям вообще нет, даже опилки все съедены и суп варить не из чего"
PMD_phase_one.16.a:0 "Путь ты проклят Йенс НАТОнос"

PMD_phase_one.17.t:0 "Надежды больше нет"
PMD_phase_one.17.d:0 "Солдаты дали ёбу"
PMD_phase_one.17.a:0 "Кто такой Ёб?"

PMD_expedition.1.t:0 "Экспедиция"
PMD_expedition.1.d:0 "Наконец-то мы решились на то, чтобы организовать экспедицию на поиски уцелевших военных баз Великой Родины. Весьма своевременно, учитывая скорую войну с ИОПК. Экспедиция будет состоять из двадцати солдат, которым уже доводилось выходить на повержность, и двух врачей. Руководителем назначен Алексей Беляев, член группы Попадейкина. Экспедиции будет выделено оружие, сани и даже три работающий вездехода (больше у нас просто нету). Но главный вопрос, вставший перед начальством: сколько выделить им припасов и топлива.\nРесурсы очень дефицитные, а гарантии, что они найдут хоть что-то - никакой. Однако чем больше мы выделим им ресурсов, тем дальше они смогут продвинуться в своём путешествии."
PMD_expedition.1.a:0 "Выделить 6 ед. провизии"
PMD_expedition.1.b:0 "Выделить 12 ед. провизии"
PMD_expedition.1.c:0 "Выделить 18 ед. провизии"
PMD_expedition.1.d:0 "Выделить 20 ед. провизии"

PMD_expedition.2.t:0 "Записи из экспедиции Беляева 2 день"
PMD_expedition.2.d:0 "Продолжаем наше путешествие по заполярной пустоши. Деревьев почти нет. Дорога неровная. Ветер очень сильный, трясёт всю машину. Температура примерно-40. Не будь у нас вездехода здесь мы бы погибли.\nНаконец мы достигни первой воен. 6азы в нашем списке. Нерпичья губа. Все дороги здесь засыпаны снегом толщиной в несколько метров. Чтобы проникнуть внутрь зданий, нам приходилось забираться в окна третьего этажа.\nПоход сюда можно считать удачным. Людей или их останков мы не обнаружили. Видимо они ушли на юг, когда настала вечная ночь. На складе было обнаружено большое количество оружия и патронов к нему. Были найдены и консервы, но их содержимое уже испортилось. Проверено."
PMD_expedition.2.a:0 "Мы получили, что хоотели. Пора возвращаться домой"
PMD_expedition.2.b:0 "Загрузив оружие и припасы, мы продолжили путь"

PMD_expedition.3.t:0 "Записи из экспедиции Беляева 4 день"
PMD_expedition.3.d:0 "Путь дальше оказался труднее. Из-за тяжелого оружия. Счётчик гейгера трещит всё громче и громче. Это настораживает.\nМы зря ехали сюда. От Арв-Губы осталась лишь огромная фонящая воронка. Нет смысла подъезжать к ней ещё ближе."
PMD_expedition.3.a:0 "Мы уже достаточно далеко зашли. Возвращаемся"
PMD_expedition.3.b:0 "Продолжаем экспедицию"

PMD_expedition.4.t:0 "Записи из экспедиции Беляева 7 день"
PMD_expedition.4.d:0 "Достигли Полярного. Мой родной город. Грустная картина. Многие дома уничтожены бомбардировками ИОПК. Внутри уцелевшик зданий найдено много останков людей. Есть следы борьбы людей между друг другом. Видимо город страдал от голода.\nБыло найдено небольшое количество уцелевшего оружия и снаряжения, Хоть так. Не зря заглянули «домой»."
PMD_expedition.4.a:0 "Пора вернуться в Округ"
PMD_expedition.4.b:0 "Наша следующая цель - Мурманск"

PMD_expedition.5.t:0 "Записи из экспедиции Беляева 10 день"
PMD_expedition.5.d:0 "Разочерование. Мурманск уничтожен. Полностью. Радифактивный фон здесь самый высокий, что нам встретится в этой акспедиции. Удивительно- Алеша продолжает стоять и охранять город, жотя охранять то уже нечего.\nВид Мурманска негативно сказался на группе. Сейчас спорят о том, куда ехать дальше. Двадцать человек за возвращение в Округ, но один упорно настаивает на отправку в Североморск.\nРешающее слово за мной, ведь командир здесь я"
PMD_expedition.5.a:0 "Давайте уже просто вернёмся домой"
PMD_expedition.5.b:0 "Ненадолго заедем в Североморск."

PMD_expedition.6.t:0 "Записи из экспедиции Беляева ? день"
PMD_expedition.6.d:0 "Моя вина. Я неправильно рассчитал топлива на обратную дорогу. Теперь вездеходы встали. Нам придется оставить то немногое, что мы смогли добыть в ходе экспедиции. Мы возвращаемся в Округ пешком по заполярной пустоши. Еды почти не осталось. Многие (если не все) не переживут этот поход. Боже прости. Это моя вина."
PMD_expedition.6.a:0 "Надо было думать об обратной дороге"

PMD_expedition.7.t:0 "Записи из экспедиции Беляева 11 день"
PMD_expedition.7.d:0 "Надежда не оправдалась. Североморск сильно пострадал от бомбардировок ИОПК (те так сильно как Мурманск). Внутри уцелевших зданий нет ничего ценного. Видимо местным удалось покинуть город, забрав с собой всё ценное. Целые сутки были потрачены в пустую. Все расстроены и раздражены. Но теперь мы точно можем вернуться в часть без опасения, что мы что-то забыли"
PMD_expedition.7.a:0 "Ну наконец-то"

PMD_expedition.8.t:0 "Записи из экспедиции Беляева 11 день"
PMD_expedition.8.d:0 "Надежда не оправдалась. Североморск сильно пострадал от бомбардировок ИОПК (не так сильно как Мурманск). Внутри уцелевших зданий нет ничего ценного. Видимо местным удалось покинуть город, забрав с собой всё ценное.\nНевероятно !!! В городе есть выжившие. Когда мы уже собирались уходить, мы обнаружили, что за нами наблюдают какие-то люди. Сначала подумали, что разведчики ИОПК. Началась перестрелка. Их было двое. Одного мы убили. Второго ранили и пленили, Мальчишка, лет 20, русский, очень бледный и худой. После допроса выяснилось, что они тоже подумали, что мы из ИОПК. Оказывается некоторым жителям Североморска и Мурманска удалось выжить в "святилище" (бункер?), что располагается неподалёку. Нам удалось заставить его сопроводить нас в это место.\nЭто оказалась подземная база для подводных лодок. Мальчишка стал нашим билетом внутрь. Странно. Сначала к нам местные относились с недоверием, но увидя отличительные знаки ВР на нашей форме, они изменили своё отношение.\nУ них здесь настоящая секта. Они поклоняются какому-то Кириллу Люфтову (у них даже есть его довоенный портрет, старик в деловом костюме, мне не известен). Они называют его Господом Гнева. С их слов именно из-за него началась последняя война с последующим применением ядерного оружия. Он уничтожил старый мир и его прежних богов, самим став богом. Поэтому они ему поклоняются, желая избежать его гнева. Знаки ВР для вроде церковной утвари (я не понял всех тонкостей их культа). Попадейкин бы оценил (*зачеркнуто). Нас они воспринимают как божественных посланников, Жизнь в "святилище" ничуть не лучше, чем в Округе (хуже). Но оружия и военной техники завались. Метсные относительно вменяемые. В высушенном доке стоит огромная подводная лодка (переоборудована в а-ля храм). Как нам говорят, ядерная ракета, чт располагается внутри, до сих пор рабочая (жаль, что её мы не можем использовать для войны с ИОПК). Удивительно. Топливные баки подлодки полны. И местные готовы нам предоставить это топливо.\nЧто мне делать дальше? Узнав об КФВО (как об осколке ВР), местные захотели отправиться туда вместе с нами. У меня нет полномочий принимать таких решений. И они сильно осложнят нам дорогу назад. И я им не доверяю. Но они смотрят на нас с такой надеждой. Они правда верят, что мы посланники этого Кирилла !! Некоторые из команды пропитались к ним симпатией."
PMD_expedition.8.a:0 "Они граждане ВР, наш долг - их защищать Берём вместе с собой."
PMD_expedition.8.b:0 "Мы получили, что хотели. Возвращаемся без них."

PMD_expedition.9.t:0 "Записи из экспедиции Беляева 11 день"
PMD_expedition.9.d:0 "Надежда не оправдалась. Североморск сильно пострадал от бомбардировок ИОПК (те так сильно как Мурманск). Внутри уцелевших зданий нет ничего ценного. Видимо местным удалось покинуть город, забрав с собой всё ценное. Целые сутки были потрачены в пустую. Все расстроены и раздражены. Но теперь мы точно можем вернуться в часть без опасения, что мы что-то забыли.\n-.. 3333 ... Засаа., да .. / .. Ззаддддд .... /а. кж -_ к .. тпт .. ПлПоо ... моги.//"
PMD_expedition.9.a:0 "* *последняя страница дневника"

PMD_expedition.10.t:0 "Экспедиция возвращается"
PMD_expedition.10.d:0 "Экспедиция смогла успешно вернуться. Улов оказался не такой большой, какой ожидало начальство. Но это лучше, чем ничего."
PMD_expedition.10.a:0 "Итог"

#Решения
PMD_state_of_district:0 "Состояние Округа"
PMD_state_of_district_desc:0 "Заполярье - пожалуй самое худшее место, где можно оказаться в нашем новом дивном мире. Так как к таким рядовым проблемам как голод, дефицит ресурсов и радиация прибавляется ещё дикий холод и риск сойти с ума. Солдатам приходится месяцами сидеть в своих тесных казиматах, спасаясь от чёрной пурги прежде, чем выпадет возможность выбраться наружу. Их разум буквально изнемогает от ничегонеделанья. И уж лучше им занятие, хоть самое бесполезное, выдаст командование, чем они сами его себе придумают, будь то суицид, бунт или что ещё. \nЗапасы провизии: [?provisions_var|G] ед. \nПотребление провизии: [?consumption_of_provisions_var|G] ед. в неделю \nМентальное благополучие: [?mental_well_being_var|R] ед. \n Изменение ментального благополучия: [?mental_well_being_change_var|R] ед. в неделю"

PMD_hold_Hour_of_Hate:0 "Провести «Час ненавести"
PMD_hold_Hour_of_Hate_desc:0 "Округ чем-то похож на рыцарский орден из Средневековья- у нас нет ни жен, ни детей, ни личного имущества, есть лишь наше боевое братство и своеобразная вера в Великую Родину. Так вот если Округ это орден, то «Час ненависти» - это наша литургия, на которой Попадейкин напоминает за что и против кого мы воюем. Отлично очищает мозг на время."

PMD_conduct_drill:0 "Провести муштру"
PMD_conduct_drill_desc:0 "Муштра - старый как мир способ поддержкии воинской дисциплины. Конечно, большинству наших солдат уже далеко за 40, и если мы начнём их муштровать как каких-то новобранцев, они могут воспринять это как оскорбление. Благо их мнения командование не Спрашивало."

PMD_conduct_exercises:0 "Провести военные учения"
PMD_conduct_exercises_desc:0 "Наши «военные учения» и на толику не похожи на те военные учения, что были до Последней войны, и тем более не похожи на реальные боевые действия. Но это всё равно хороший способ занять солдат и не дать мозгам наших офицеров стухнуть."

PMD_carry_out_rotation_in_warehouse:0 "Провести внеочередную ротацию на складе"
PMD_carry_out_rotation_in_warehouse_desc:0 "По идея главная задача этих ротаций - не дать товарам залежаться и испортиться, но на деле это очередной способ занять скучающих солдат. Надо лишь присматривать за ними, чтобы они ничего не украли."

PMD_increase_rations:0 "Увеличить дневной паёк"
PMD_increase_rations_desc:0 "Да, у нас почти не осталось еды, но накормить солдата - самый простой и эффективный способ задобрить его."

PMD_decrease_rations:0 "Сократить дневной паёк"
PMD_decrease_rations_desc:0 "Положение дел такое, что мы вынуждены сократить дневную порцию солдата, даже если это вызовет недовольство."

PMD_use_stocks_of_alcohol:0 "Воспользоваться запасами алкоголя"
PMD_use_stocks_of_alcohol_desc:0 "Водка - вещь универсальная. Она помогает солдатам легче переносить холод, снижает стресс, уменьшает чувствительность при ранении и притупляет чувство страха. Единственный её недостаток - ограниченное колличество."

PMD_send_soldiers_on_hunt:0 "Отправить солдат на охоту"
PMD_send_soldiers_on_hunt_desc:0 "После ядерной войны флора и фауна Заполярья стали совсем скудными. Но иногда нашим солдатам может повести поймать какого-нибудь белого медведя или северного оленя. Тогда у всей военной базы праздник."

PMD_concentrate_our_forces:0 "Сконцентрировать наши силы"
PMD_concentrate_our_forces_desc:0 "Лучшая защита - это нападение. Для нашего последнего штурма нам потребуются сконцентрировать все силы, что у нас есть, а это не простая организационная и логистическая задача. Нашим солдатам на время придётся стать строителями."

PMD_carry_out_surplus_appropriation:0 "Провести продразвёрстку в поселениях Округа"
PMD_carry_out_surplus_appropriation_desc:0 "Солдатам нужно много калорий, чтобы совершать подвиги во славу Великой Родины, поэтому, ввиду военного времени, нам прийдётся изымать продовольствие у своего гражданского населения, хотят они того или нет."

PMD_outfit_expedition:0 "Снарядить экспедицию"
PMD_outfit_expedition_desc:0 "Уцелевшие военные базы ВР для нас всё равно, что Эльдорадо для испанцев. Найденная там техника может сыграть решающую роль в войне с ИОПК."

PMD_meat_from_mass_grave:0 "Использовать мясо из трупной ямы"
PMD_meat_from_mass_grave_desc:0 "Как бы это не было ужасно, но мы должны будем пойти на этот шаг ради выживания. Мёртвым всё равно нет дела до живых..."


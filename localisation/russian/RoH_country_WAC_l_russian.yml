Mikhail_Tolstoy:0 "Михаил Толстых" 
BRD_Mikhail_Tolstoy_desc:0 "На бескрайних просторах развернувшейся после падения Родины анархии, военные стали символом относительного порядка, и пусть этот самый порядок варьировался относительно нравов отдельных командиров, сложившаяся ситуация продвинула по карьерной лестнице даже бывших средних чинов, ибо людям нужен был человек, на силу и власть которого они могли бы рассчитывать в борьбе с бандитами и городскими сумасшедшими. Во всяком случае те, у кого был право такого выбора.\nОдним из таких "продвинувшихся" является и Михаил Толстых. О его прошлом известно лишь то, что в войсках Великой Родины он служил офицер среднего ранга. После войны Толстых организовал группировку "Общинники", ставившей собой благую цель в виде поддержания жизни на территориях от Курска до Белгорода, однако этот альтруизм не помог "общинникам" защититься от нашествия войск Малорусского царства. Офицеру было больно наблюдать, как его родной край обращается в пепел параллельно идущим на его территориях боестолкновениям, но он был вынужден отступить. После потери доброй половины бывших владений, Толстых был вынужден просить помощи у Харьковского Военного Совета, благодаря которому сумел реорганизовать группы "общинников" в то, что отныне известно как Чёрная дуга. Главной целью Толстого является захват власти в Совете и реорганизация всех его территорий в Малоросскую республику, а также разгром "царистов", дабы на его родных землях наконец установился мир."
WAC_Denis_Pushkarenko:0 "Денис Пушилин" 
WAC_Denis_Pushkarenko_desc:0 "Уроженец города Сталино, по профессии – военный. Ныне является самым влиятельным человеком востока Малороссии, держа под контролем один из крупнейших её городов – Харьков. На момент начала войны был военным комиссаром города, а позднее стал его губернатором. С помощью своих личных лидерских качеств, общего бедственного положения войск после ядерного пожара, смог объединить под своим началом большое количество солдат ВС Великой Родины, также заполучив немалое количество военной техники. Ввиду своего удачного положения и относительной безопасности на территории Харьковского Военного Совета, люди тянутся в Харьков. Результатом такой «миграции» стал величайший политический триумф Пушилина – формирование союза под названием «Черная Хунта», куда вошли Егеря, Чёрная Дуга и 35-я Бригада. Однако, все не так хорошо, как кажется на первый взгляд. От южных «диких» областей исходит постоянная угроза, потому что, по словам самого Пушилина: «Черт его знает, что происходит на юге. Возможно прямо сейчас там концентрируется такая военная сила, что сметет наши среды в одночасье». Также проблемой для Пушилина являются Егеря – своенравные бандиты, пока что лояльные ему, но на долго ли?"
HAN_arsen_rurikovich:0 "Арсен Павлов"
HAN_arsen_rurikovich_desc:0 "Арсен Павлов родился 24 июня 1980 года на Северщине. Война застала его во время службы в Вооруженных Силах Великой Родины. Будучи человеком трезвого ума и расчетливого склада характера, Арсен не стремился стать бессмысленной жертвой на переднем крае, отдав приоритет выживанию и сохранению собственных ресурсов. Волею судеб Павлов был отправлен нести гарнизонную службу в один из городков черноморского побережья. Ввиду удаленности от основных линий фронта Арсен рассчитывал, что это место станет надежным тылом. Однако сослуживцы и местное командование быстро поддались упадочным настроениям: в гарнизоне началось разложение дисциплины, процветали азартные игры и пьянство. Но спокойствие оказалось временным - с неба упали первые бомбы.\n\nСразу после первых ударов местная администрация при поддержке гарнизона взяла на себя контроль над ситуацией. Первое время властям удавалось обеспечивать пайком солдат и рабочих на ключевых производствах. Но ресурсы быстро таяли. Понимая неизбежность окончательного коллапса, Арсен Павлов проявил инициативу: собрав группу из сослуживцев, прапорщика, кладовщика и трех женщин из гражданского персонала, а также захватив гарнизонного кота, армейский «Урал» и несколько ящиков с вооружением, он организовал эвакуацию на север.\n\В разрушенных северных районах группа столкнулась со сбившимися в кучи деморализованными солдатами. Не дав им окончательно опуститься до мародерства, Павлов взял их под свое крыло, сформировав дисциплинированное и дееспособное автономное подразделение «Егеря».\n\nСо временем «Егеря» вышли на территорию Харьковской Хунты. Местное руководство оценили потенциал отряда и предложило Павлову взаимовыгодный контракт: полное снабжение боеприпасами, провизией и снаряжением в обмен на проведение автономных рейдов, диверсий и партизанских операций на территории противников Хунты.\n\nСегодня Арсен Павлов обустроил свою резиденцию и штаб в здании бывшего Горисполкома. Окружив себя верными людьми, наладив быт и обеспечив периметр надежной огневой защитой из трех пулеметных гнезд, он умело управляет отрядом и вынашивает амбициозные планы - однажды стать полноправным и единственным хозяином Харькова."
BRI_igor_streltsov:0 "Игорь Стрелков"
BRI_igor_streltsov_desc:0 "Игорь Стрелков, порой называемый в народе новым Корниловым из-за схожести идей, родился 19 августа 1963 года в небольшом хуторе в Малороссии. С детства проявлял интерес к военной службе, ввиду чего был отправлен в военное училище в Киев, который с отличием окончил в возрасте 20 лет, после чего был зачислен в 35-ую Мотострелковую бригаду. Великую, или же, последнюю войну Стрелков встретил в чине командующего 35-ой бригадой. Когда упали бомбы, он и его люди были расквартированы неподалеку от Днепропетровска. Вся плачевность ситуации стала ясна Стрелкову: необходимо действовать своими силами. Благодаря своему волевому характеру, Стрелкову удалось силой пули объединить под своим началом обширные территории, став полноправным её хозяином. Однако, не все было так гладко, как казалось на первый взгляд. Перед Стрелковым стояли две проблемы: реформа уже устаревшей армии и поднимающаяся с колен харьковская хунта.\n\nКак и Л.Г. Корнилов, Стрелков предпринял попытку «большой игры» в политику, однако, это закончилось для него весьма печально. Реформы армии, основанные на ещё царском кодексе, провалилась, а Харьковский Военный Совет стал уже реальной угрозой, ввиду чего Стрелков был вынужден примкнуть к союзу Чёрной Хунты, став своеобразным буфером между Харьковом и дикими областями.\n\nКто знает, что его ждет дальше?"


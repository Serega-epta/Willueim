l_russian:
 RoH_loadscreen_header:0 "Вы знали?"
 LOADING_TIP_0:0 "Днём рождения модификации можно считать дату создания группы The Requiem of Humankind в ВКонтакте —\n29 августа 2021 года."
 LOADING_TIP_1:0 "В модификации присутствуют целых две отсылки на Виктора Резнова —\nодного из главных героев в Call of Duty®: World at War и Call of Duty®: Black Ops."
 LOADING_TIP_2:0 "Прообразом Егора Никитина — главы Черноморского Адмиралтейства — является реальный человек,\nкурировавший разработку модификации в самом начале её зарождения."
 LOADING_TIP_3:0 "Несмотря на падение Великой Родины,\nАПЛ Курск всё ещё находится в строю на вооружении Северного Фронта Сдерживания."
 LOADING_TIP_4:0 "Несмотря на разгром сил IOPK в Европе часть американских войск сумели избежать уничтожения.\nПричем большая часть расположена за пределами нынешней игровой карты..."
 LOADING_TIP_5:0 "Единственными наследниками Великой Родины являются семь государств: Государственный Ликвидационный Комитет, Срочный Совет Реагирования, 227-ая Армия, Ликвидаторы, Буковинская Гвардия, Северный Фронт Сдерживания, 35-ая Бригада и Заполярный Военный Округ."
 LOADING_TIP_6:0 "В конце 2010-х в Центральной России пошли слухи о возникновении новой синкертической религии - Культе Победы.\nЭта секта рассматривает в качестве центрального события Великую Отечественную войну и Третью Мировую как борьбу России\nкак сил Добра против безбожных сил Зла - Запада."
 LOADING_TIP_7:0 "Янтарная плесень - загадка нового мира, появившаяся вскоре после начала ядерных бомбардировок.\nНикто не знает, откуда она взялась и что именно представляет, равно как достоверно не знает, куда пропадают коснувшиеся её."
 LOADING_TIP_8:0 "Инициатива «Ликвидация» - Проект Великой Родины, заложенный с целью самовосстановления государства после ядерной войны.\nСорванная началом войны подготовка Инициативы привела к тому, что Великая Родина сейчас лежит в руинах."
 LOADING_TIP_9:0 "Великая Родина, в отличие от Советского Союза, создала бесчисленное множество разных чудес. Сможете ли вы их отыскать и поставить на службу человеку?"
 LOADING_TIP_10:0 "Под давлением Великой Родины Муаммар Каддафи гораздо активнее внедрял социалистические элементы в экономику Ливийской Джамахирии и меньше критиковал марксизм."
 LOADING_TIP_11:0 "Советские учёные всегда были смелыми в идеях и мечтаниях, и ещё смелее - в делах.\nНапример, победа в т.н. «Звёздных Войнах» была одержана благодаря талантливому конструктору Владимиру Челомею и его комплексу орбитальной обороны."
 LOADING_TIP_12:0 "Никто не мог представить, что нацисты потребуют у американцев официального укрытия. США не могли пойти на такое, а немцы демонстративно перевели свою армию на запад. Говорят, именно это спасло СССР от кровопролитных боёв за Восточную Пруссию и Берлин."
 LOADING_TIP_13:0 "Во время периода Бессилья в Советской России было много недовольных отходом от идей марксизма-ленинизма. Возникла даже подпольная организация, имевшая пусть и небольшой, но успех, даже на фоне внешних и внутренних побед Великой Родины."
 LOADING_TIP_14:0 "Советская Россия выиграла космическую гонку, высадив людей на поверхность Луны в 1969. Говорят, что до Последней войны работало особое Предприятие, занимавшееся вопросами колонизации Луны и Марса."
 LOADING_TIP_15:0 "Передовые и наиболее ресурсоёмкие проекты Великой Родины получили огромные закрытые зоны по всей стране.\nНа данный момент известно о местонахождении пяти таких Объектов."
 LOADING_TIP_16:0 "Высадка войск IOPK в Калининград стала возможна только из-за халатности командования Прибалтийского Военного Округа. Тем не менее, Ставка рассчитывала дождаться капитуляции или попыток эвакуировать этот контингент из-за стремительных успехов войск С.Е.Р.П. на фронте."
 LOADING_TIP_17:0 "Страшные слухи ходят об Аномальном кордоне, отгораживающих Поморье от остальной России.\nГоворят, человек может идти и внезапно исчезнуть навсегда. А может появиться через секунду, но искромсанным в кровавую кашу."
 LOADING_TIP_18:0 "Никому не известна точная судьба Балтийского флота. Говорят, он защищал наступление войск С.Е.Р.П., в Данию, и был уничтожен вместе с ней оружием, которое затопило после часть Швеции и Ленинград с Нарвой."
 LOADING_TIP_19:0 "Народный фронт, он же НАРФРОНТ, был сформирован остатками подпольной марксистско-ленинской организации."
 LOADING_TIP_20:0 "Администрация Консульства очень опасалась мятежа военных. Поэтому ею было принято решение о формировании автономных групп - Щитов - между которыми неравномерно разделили армию и авиацию."
 LOADING_TIP_21:0 "Наёмники из Чёрной Дуги славятся по всей Советской России. Их тяжело перекупить, и, самое главное - они могут оказаться даже куда более стойкими, чем обученные ополченцы."
 LOADING_TIP_22:0 "После того, как оружие Третьей Мировой отравило Великую Родину, южные степи стали быстро пустеть.\nЧтобы восстановить сельское хозяйство, потребуется сначала восстановить довоенное производство ингибиторов, нейтрализаторов и антирадина."
 LOADING_TIP_23:0 "Северный Фронт Сдерживания когда-то был мощной силой, которая подменила Ликвидаторов в борьбе с последствиями Последней Войны.\nТеперь сам Фронт едва отличим от мертвеца"
 LOADING_TIP_24:0 "Когда-то вся Западная Украина была частью Киевского Военного Округа. Но появление и стремительное распространение болотных культистов разрушило и разгромило Инициативу «Ликвидация». И породило фанатиков Львова и Ужгорода."
 LOADING_TIP_25:0 "ГКЧП, возглавленное академиком Сахаровым в июле 1990, стало последней попыткой либерально-демократических сил оказать влияние на политику Советской России, но по итогу привело лишь к милитаризации и радикализации Великой Родины."
 LOADING_TIP_26:0 "Для приведения в жизнь Инициативы «Ликвидация» руководство Великой Родины разместило по всей стране закрытые склады с огромными запасами герметично упакованной консервированной еды, а также оружия, антирадина и антихимикатов."
 LOADING_TIP_27:0 "Немногим крупным городам, городам-миллионникам Великой Родины удалось избежать ядерных ударов. Те же, кому повезло избежать такой участи, стали центрами новых государств."
 LOADING_TIP_28:0 "После наступления радиомолчания никаких вестей о Закавказье или предгорьях Кавказа не поступало. Говорят, что они полны чудовищ, злобных горцев и виллуимов. Что из этого хуже, пока не ясно."
 LOADING_TIP_29:0 "Политика насильственного обрусения Советской России не нравилась многим гражданам, но послевоенная борьба с бандеровцами, «лесными братьями» и горцами была ещё слишком свежа в памяти."
 LOADING_TIP_30:0 "На начало Последней Войны считалось, что украинцы, мордва и белорусы прекратили своё существование как отдельные народы. Поволжские немцы - ассимилированы или высланы в ГДР. Вовсю решался вопрос ликвидации народов Сибири."
 LOADING_TIP_31:0 "После окончания Второй Мировой войны в Европе и подписания маршалом Кессельрингом капитуляции 9 июня 1945 года, Германия оказалась разделена на Советскую зону оккупации и зоны оккупации Союзников."
 LOADING_TIP_32:0 "15 июня 2000 год: Торжественное взаимное открытие посольств ФРГ и ГДР. Создание «Конгресса единства германского народа», занимающегося вопросами объединения двух Германий."
 LOADING_TIP_33:0 "3 ноября 2000 год: Подача ФРГ заявки на выход из I.O.P.K. Выступление руководства ФРГ с требованием к странам-участницам I.O.P.K о немедленном выводе всех воинских контингентов с территории ФРГ."
 LOADING_TIP_34:0 "10-11 ноября 2000 год: Пересечение воинским контингентом С.Е.Р.П границы ГДР и ФРГ. Взятие в блокаду объединёнными войсками ФРГ и С.Е.Р.П военных баз I.O.P.K."
 LOADING_TIP_35:0 "12 ноября 2000 год, 21:06: Начало Последней войны."
 LOADING_TIP_36:0 "ФРГ должна была представлять из себя образец западного образа жизни. Однако нехватка промышленных мощностей, ввиду раннего свёртывания плана Маршалла, а также отсутствие достаточного количества людских ресурсов, не позволили ФРГ добиться впечатляющих экономических достижений. "
 LOADING_TIP_37:0 "В ходе наступательных действий в декабре 2000 года войскам С.Е.Р.П. удалось нанести поражения силам I.O.P.K. в Бенилюксе и выйти к северной границе Франции."
 LOADING_TIP_38:0 "К лету 2001 года части С.Е.Р.П. выходят к Пиренеям и занимают почти всю территорию Франции."
 LOADING_TIP_39:0 "В ходе наступления на Сицилию в июне 2001 впервые со времён Второй Мировой войны применено ядерное оружие. Целью тактического ядерного удара со стороны С.Е.Р.П. был выбран город Мессина."
 LOADING_TIP_40:0 "16 января 2002, 23:59: Большая часть человеческой цивилизации уничтожена взаимными атомными ударами. Потери исчисляются миллиардами. По всему миру наступило радиомолчание."
